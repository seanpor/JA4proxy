[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# --tb=short: concise tracebacks
# --timeout=60: per-test hard limit (requires pytest-timeout)
# -q: quiet mode by default; run-local-tests.sh adds -v when writing to log
addopts = "--tb=short --timeout=60"

markers = [
    "live_services: requires live Go/Python proxy and Redis; excluded from make test (use make test-live)",
]

# Warning policy:
#   - Third-party library internals: ignore (too noisy, nothing we can fix)
#   - asyncio cleanup noise from mocks: ignore specific patterns
#   - Everything else: default behaviour (shown but not fatal)
#   - Our own code: any unexpected RuntimeWarning will surface naturally
filterwarnings = [
    # pytest-asyncio internal deprecation notices
    "ignore::DeprecationWarning:pytest_asyncio",
    "ignore::DeprecationWarning:_pytest",
    # Third-party library internals — nothing actionable for us
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:google",
    "ignore::DeprecationWarning:aiohttp",
    "ignore::DeprecationWarning:redis",
    # urllib3 / requests noise in test environments
    "ignore::urllib3.exceptions.InsecureRequestWarning",
    "ignore::urllib3.exceptions.SecurityWarning",
    # asyncio teardown with mocked tasks — not a real resource leak
    "ignore:.*Enable tracemalloc.*:pytest.PytestUnraisableExceptionWarning",
    "ignore:coroutine .* was never awaited:RuntimeWarning",
    # aiohttp connector cleanup in unit tests (no real connections, just mocks)
    "ignore:.*Unclosed client session.*:ResourceWarning",
    "ignore:.*Unclosed connector.*:ResourceWarning",
    # ssl.OP_NO_TLS* deprecated in Python 3.10+ (security/validation.py — third-party pattern)
    "ignore:ssl.OP_NO_SSL.*:DeprecationWarning",
    "ignore:ssl.OP_NO_TLS.*:DeprecationWarning",
    # pycares async DNS callbacks arrive after asyncio loop closes during test teardown.
    # This is a known interaction between pycares, Python 3.10 asyncio, and pytest-asyncio.
    # Nothing actionable in our code — pycares teardown is outside our control.
    # Approved Exception #001: see docs/security/EXCEPTIONS.md
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
# Phase 16f baseline — check src/ and proxy.py; tests are advisory only.
target-version = "py314"
line-length = 120

[tool.ruff.lint]
# Enable: pyflakes (F), pycodestyle errors (E), isort (I)
# Skip: W (warnings — cosmetic), C (complexity), ANN (annotations — covered by mypy)
select = ["E", "F", "I"]
ignore = [
    "E501",   # line-too-long — handled by black
    "E402",   # module-level import not at top — some files have conditional imports
    "F401",   # unused import — too noisy in tests; addressed separately in src/
]

[tool.ruff.lint.per-file-ignores]
# Tests: allow unused imports (often imported for re-export or side effects)
"tests/**" = ["F401", "F811", "F841", "E711", "E712", "E721"]
# Admin CLI: allow broad exception handling
"scripts/ja4proxy_admin.py" = ["E722"]
