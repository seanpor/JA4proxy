# Known bad / bulletproof hosting organizations for RDAP enrichment (Phase 11).
#
# Each entry is matched against RDAP org data:
#   1. Exact `handle` match (registry-stable; most reliable)
#   2. Case-insensitive substring match on `name`
#
# Sources: Spamhaus ASN-DROP, abuse.ch, public incident reports, RIPE/ARIN abuse data.
#
# score: Risk contribution when an IP belongs to this org (added to composite score).
#        Default: 45. Range: 1–100. Keep ≤ 65 so org reputation alone never crosses
#        the block threshold (70) — needs corroboration from other signals.

