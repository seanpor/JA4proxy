# Analytics Node Configuration
# Phase 12a: Foundation

# Redis configuration
redis:
  host: localhost
  port: 6379
  # password: your-redis-password  # Uncomment and set if Redis requires authentication

# Stream configuration
# Phase 814k (JA4PROXY-2026-0100): the Go proxy writes events:connection
# (config/proxy.yml webhooks.stream_key / cmd/ja4pd/main.go), not the
# retired ja4proxy:events. Analytics must consume the stream the proxy
# actually writes.
stream:
  key: events:connection
  consumer_group: analytics
  consumer_name: analytics-1
  batch_size: 100
  timeout_ms: 5000

# Security configuration
security:
  hmac_secret: default-secret-change-me-in-production
  hmac_required: true

# Aggregation configuration
aggregation:
  window_seconds: 300  # 5 minutes

# Detection thresholds (phase-827)
#
# These were hardcoded defaults on the detector constructors with nothing ever
# passing a value, so tuning sensitivity meant editing Python. Every key below
# is optional and hot-reloadable via SIGHUP; omitted keys keep the historical
# default shown, so an absent block changes nothing.
#
# Sizing matters more than it looks. "campaign" requires density >= 0.15 of a
# /24 — that is 39+ distinct IPs inside one 256-address block, which is the
# right shape for a site fronting many client networks and far too coarse for a
# single-tenant deployment. Lower it deliberately, and remember the asymmetry:
# these thresholds gate FINDINGS shown to an operator, not blocking, so erring
# toward more findings costs review time rather than blocked users.
detection:
  campaign:
    min_unique_ips: 10        # Distinct source IPs in one subnet before considering it
    density_threshold: 0.15   # Fraction of the subnet seen (0.15 of a /24 = 39 IPs)
    block_rate_threshold: 0.70  # Share of that subnet's connections that were blocked
    window_seconds: 300
  slow_scan:
    min_unique_ips: 20        # Many IPs...
    max_requests_per_ip: 3    # ...each making only a few requests: the scan signature
    window_seconds: 300
  ja4_intelligence:
    min_observations: 10      # Sightings of a fingerprint before judging its block rate
    block_rate_threshold: 0.95
    window_seconds: 3600

# Monitoring configuration (Phase 12c)
monitoring:
  enabled: true

  baseline:
    capture_interval_seconds: 3600  # Hourly
    retention_days: 7
    baseline_key_prefix: analytics:baseline:hourly

  drift_detection:
    enabled: true
    z_score_threshold: 2.0
    check_interval_seconds: 60
    alert_ttl_seconds: 3600
    alert_key: analytics:alerts:score_drift
    severity_levels:
      low: 1.5
      medium: 2.0
      high: 3.0

  distribution_analysis:
    enabled: true
    ks_test_threshold: 0.05
    check_interval_seconds: 300
    alert_ttl_seconds: 3600
    alert_key: analytics:alerts:distribution_shift

  shadow_scoring:
    enabled: true
    known_good_alpn: ['h2', 'h1']
    calibration_threshold: 10.0
    check_interval_seconds: 300
    alert_ttl_seconds: 3600
    shadow_key: analytics:shadow_scores:latest
    calibration_alert_key: analytics:alerts:calibration_issue

  monitoring_cycle_seconds: 60
