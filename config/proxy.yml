# Proxy configuration
proxy:
  # POC: Bind to all interfaces for Docker networking
  bind_host: "0.0.0.0"
  bind_port: "${PROXY_PORT:-8080}"
  # Backend server — set BACKEND_HOST / BACKEND_PORT in .env to point to your real server.
  # POC default: "backend" (Docker container name). Production: your server IP or hostname.
  # Supports ${VAR:-default} syntax: falls back to "backend":443 if env vars are not set.
  backend_host: "${BACKEND_HOST:-backend}"
  backend_port: "${BACKEND_PORT:-443}"
  # Tarpit container for redirecting blocked connections
  tarpit_host: "tarpit"
  tarpit_port: 8888
  max_connections: 1000
  # Graceful shutdown: max seconds to wait for in-flight connections to complete
  # after SIGTERM before forcing close.  Hot-reloadable.
  drain_timeout_seconds: 30
  # SECURITY FIX: Configurable timeouts to prevent resource exhaustion
  connection_timeout: 30
  read_timeout: 30
  write_timeout: 30
  keepalive_timeout: 60
  buffer_size: 8192
  # Enable PROXY protocol v2 support (for HAProxy)
  proxy_protocol: true

# Redis configuration
redis:
  host: "${REDIS_HOST:-redis}"
  port: "${REDIS_PORT:-6379}"
  db: 0
  # SECURITY: Password MUST be set via environment variable REDIS_PASSWORD
  # Never commit actual passwords to version control
  password: "${REDIS_PASSWORD}"
  timeout: "${REDIS_TIMEOUT:-5}"
  # Enable TLS for Redis connections in production
  ssl: false
  ssl_cert_reqs: "required"

# Security settings
security:
  whitelist_enabled: true
  blacklist_enabled: true
  rate_limiting: true
  max_requests_per_minute: 100
  block_unknown_ja4: false
  tarpit_enabled: true
  tarpit_duration: 10
  block_action: "tarpit"
  ban_duration: 604800
  permanent_ban: false
  max_ban_duration: 2592000

  # Multi-strategy policy: any, all, majority
  # "majority" requires 2 of 3 strategies to agree before blocking — eliminates
  # single-strategy false positives (e.g. BY_IP_JA4_PAIR alone triggering on burst).
  multi_strategy_policy: "majority"

  # Threat thresholds (connections per 1-second window)
  thresholds:
    suspicious: 20
    block: 50
    ban: 100

  # Rate limit strategies
  rate_limit_strategies:
    by_ip:
      enabled: true
      thresholds:
        suspicious: 50
        block: 200
        ban: 500
      action: "tarpit"
      ban_duration: 300
    by_ja4:
      enabled: true
      thresholds:
        suspicious: 20
        block: 100
        ban: 200
      action: "block"
      ban_duration: 300
    by_ip_ja4_pair:
      enabled: true
      thresholds:
        suspicious: 20
        block: 50
        ban: 100
      action: "tarpit"
      ban_duration: 300

  # Adaptive rate limiting (Phase 16h)
  # Requires the analytics node to be running (it computes per-subnet EWMA thresholds).
  # When enabled, the proxy reads rate:adaptive:{subnet} from Redis and uses the
  # analytics-computed threshold instead of the static values above — but only when
  # confidence >= confidence_minimum. Falls back to static config otherwise.
  # Default: disabled. Enable only once analytics node is deployed.
  rate_limiter:
    adaptive:
      enabled: false              # Default: false. Enable only with analytics node running.
      min_threshold_rps: 5        # Never adapt below 5 req/s regardless of EWMA
      max_threshold_rps: 1000     # Never adapt above 1000 req/s
      confidence_minimum: 0.7     # Use adaptive threshold only if analytics confidence >= 0.7
      fallback_to_static: true    # Default: true. Fall back to static if no adaptive data.

  # Known good JA4 fingerprints (whitelisted)
  whitelist:
    - "t13d1516h2_8daaf6152771_02713d6af862"  # Chrome/Chromium
    - "t13d1517h2_8daaf6152771_b0da82dd1658"  # Chrome (pre-shared key)
    - "t13d1517h2_8daaf6152771_b1ff8ab2d16f"  # Chrome (no key)
    - "t13d1715h2_5b57614c22b0_7121afd63204"  # Firefox
    - "t13d2014h2_a09f3c656075_14788d8d241b"  # Safari
    - "t13i1515h2_8daaf6152771_02713d6af862"  # Chrome (IP destination)

  # Pattern-based whitelist: match JA4 prefix patterns (survives OpenSSL version changes)
  # Whitelisted connections skip ALL rate limiting — they are never blocked.
  whitelist_patterns:
    - "h2"   # HTTP/2 ALPN = modern browser (Chrome, Firefox, Safari, Edge)
    - "h1"   # HTTP/1.1 ALPN = older browser or browser in fallback mode

  # Known bad JA4 fingerprints (blacklisted)
  blacklist:
    - "t13d190900_9dc949149365_97f8aa674fd9"  # Sliver C2 Agent
    - "t13d201100_2b729b4bf6f3_9e7b989ebec8"  # IcedID Banking Trojan
    - "t12d190800_d83cc789557e_16bbda4055b2"  # Cobalt Strike Beacon (wininet)
    - "t12d210800_76e208dd3e22_16bbda4055b2"  # Cobalt Strike Beacon (winhttp)
    - "t12i190700_d83cc789557e_16bbda4055b2"  # Cobalt Strike Beacon (wininet, IP)
    - "t13d191000_9dc949149365_e7c285222651"  # Evilginx Phishing / GoLang net
    - "t13d880900_fcb5b95cb75a_b0d3b4ac2a14"  # SoftEther VPN Client

  # Human-readable names for known JA4 fingerprints (used in metrics labels)
  fingerprint_labels:
    # Known good (browsers)
    "t13d1516h2_8daaf6152771_02713d6af862": "Chrome"
    "t13d1517h2_8daaf6152771_b0da82dd1658": "Chrome (PSK)"
    "t13d1517h2_8daaf6152771_b1ff8ab2d16f": "Chrome (alt)"
    "t13d1715h2_5b57614c22b0_7121afd63204": "Firefox"
    "t13d2014h2_a09f3c656075_14788d8d241b": "Safari"
    "t13i1515h2_8daaf6152771_02713d6af862": "Chrome (IP)"
    # Known bad (malware/tools)
    "t13d190900_9dc949149365_97f8aa674fd9": "Sliver C2"
    "t13d201100_2b729b4bf6f3_9e7b989ebec8": "IcedID Trojan"
    "t12d190800_d83cc789557e_16bbda4055b2": "CobaltStrike (wininet)"
    "t12d210800_76e208dd3e22_16bbda4055b2": "CobaltStrike (winhttp)"
    "t12i190700_d83cc789557e_16bbda4055b2": "CobaltStrike (IP)"
    "t13d191000_9dc949149365_e7c285222651": "Evilginx/GoLang"
    "t13d880900_fcb5b95cb75a_b0d3b4ac2a14": "SoftEther VPN"
    # Suspicious (libraries)
    "t13d181000_85036bcba153_d41ae481755e": "Python stdlib"

# GeoIP country filtering
geoip:
  # Path to IP2Location LITE database (bundled in container)
  database_path: "/app/geoip/IP2LOCATION-LITE-DB1.BIN"

  # Country whitelist: only allow traffic from these countries
  # When enabled, ALL traffic from countries NOT in this list is blocked
  country_whitelist_enabled: false
  country_whitelist:
    - "IE"  # Ireland
    - "GB"  # United Kingdom
    - "IM"  # Isle of Man
    - "JE"  # Jersey
    - "GG"  # Guernsey
    - "US"  # United States
    - "CA"  # Canada
    - "AU"  # Australia
    - "NZ"  # New Zealand
    - "DE"  # Germany
    - "FR"  # France
    - "NL"  # Netherlands

  # Country blacklist: block traffic from these countries
  # Applied before all other checks
  country_blacklist_enabled: false
  country_blacklist:
    - "KP"  # North Korea
    - "RU"  # Russia
    - "CN"  # China
    - "IR"  # Iran

  # Safe countries: NEVER auto-blocked by geoip-monitor even under heavy attack.
  # These are loaded into Redis geoip:safe_countries on startup.
  # Note: this protects against AUTOMATIC blocking only.
  # A manual 'ja4-admin block-country' will be refused for countries in this list.
  safe_countries:
    - "IE"  # Ireland
    - "GB"  # United Kingdom
    - "IM"  # Isle of Man
    - "JE"  # Jersey
    - "GG"  # Guernsey
    - "US"  # United States
    - "CA"  # Canada
    - "AU"  # Australia
    - "NZ"  # New Zealand
    - "DE"  # Germany
    - "FR"  # France
    - "NL"  # Netherlands

# Metrics configuration
metrics:
  enabled: true
  port: "${METRICS_PORT:-9090}"
  # SECURITY FIX: Add authentication for metrics endpoint
  authentication:
    enabled: false  # Set to true in production
    username: "${METRICS_USERNAME}"
    password: "${METRICS_PASSWORD}"
  # Restrict access to internal networks only
  bind_host: "0.0.0.0"  # Override to 127.0.0.1 or specific IP in production

# Backup configuration
backup:
  enabled: false
  destination: "/app/backups"
  retention_days: 30
  retain_count: 10
  schedule: "0 2 * * *"
  max_keys_per_run: 1000
  max_size_bytes: 1073741824
  include_audit_log: true
# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  # json_enabled: emit all log lines as JSON objects (one per line).
  # Enabled automatically when ENVIRONMENT=production; set true here to
  # enable in development too.  Structured JSON is required for SIEM ingest.
  json_enabled: false

# Phase 14c: Tarpit self-protection.  Controls how many connections the proxy
# will simultaneously hold in the tarpit container.  When either cap is hit the
# overflow_action is taken instead of tarpitting.
tarpit:
  max_concurrent_connections: 500  # Hard global cap on simultaneous tarpit slots
  max_per_ip: 3                    # Max concurrent tarpit connections from one source IP
  overflow_action: "block"         # When cap reached: block | rst | allow (allow = fail open to backend)
  overflow_log: true               # Log overflow events (always true; field reserved for future rate-limiting)

# ── Phase 0: Infrastructure ───────────────────────────────────────────────

# Upstream proxy / CDN trust for PROXY protocol v2 client IP extraction.
# Enable only when the proxy sits behind a CDN or load balancer.
upstream_trust:
  enabled: false            # Default: false. Enable only when behind a trusted upstream.
                            # CAUTION: enabling without setting trusted_cidrs accepts
                            # spoofed client IPs from any source.
  trusted_cidrs:
    - "10.0.0.0/8"          # Internal HAProxy instances — adjust to your network.

# In-process LRU cache sizes and per-type TTLs.
# TTLs are tuned for the false-positive asymmetry: allow decisions are
# cached longer than block decisions (a stale allow is less harmful than
# a stale block on a real user).
local_cache:
  whitelist_decisions:
    max_size: 50000          # Default: 50000.
    ttl_seconds: 1800        # Default: 1800s (30 min). Long — stale allow lets traffic through.
  block_decisions:
    max_size: 100000         # Default: 100000.
    ttl_seconds: 30          # Default: 30s. Short — stale block hurts real users.
  abuseipdb_scores:
    max_size: 50000          # Default: 50000.
    ttl_seconds: 14400       # Default: 14400s (4 h). Scores change slowly.
  asn_class:
    max_size: 100000         # Default: 100000.
    ttl_seconds: 3600        # Default: 3600s (1 h).

# Per-bypass security policy. Each bypass is independently toggleable.
# Disabling an ALLOW bypass routes those connections through the scorer.
# Disabling a BLOCK bypass routes matches through the scorer instead.
# The proxy emits a startup WARN for every high-risk bypass that is disabled.
security_policy:
  # ── ALLOW BYPASSES ────────────────────────────────────────────────────
  alpn_browser_bypass:
    enabled: true           # Default: true. h2/h1 ALPN → ALLOW without scoring.
                            # CAUTION: disabling scores all browser traffic; false positive risk elevated.
  ja4_whitelist_bypass:
    enabled: true           # Default: true. JA4 in whitelist → ALLOW without scoring.
  mtls_bypass:
    enabled: true           # Default: true. Valid mTLS client cert → ALLOW without scoring.
  static_ip_allowlist:
    enabled: true           # Default: true. IP in static allowlist → ALLOW without scoring.

  # ── BLOCK BYPASSES ────────────────────────────────────────────────────
  ja4_blacklist_bypass:
    enabled: true           # Default: true. JA4 in blacklist → immediate RST.
  country_blacklist_bypass:
    enabled: true           # Default: true. Country in GeoIP blocklist → immediate block.
  spamhaus_bypass:
    enabled: true           # Default: true. Spamhaus DROP/EDROP match → immediate block.
  tls_version_bypass:
    enabled: true           # Default: true. TLS 1.0/1.1 → immediate RST (Phase 3+).

# Static IP allowlist. IPs and CIDRs listed here bypass the entire pipeline.
# Both IPv4 and IPv6 supported. CIDR ranges supported.
# UI-added entries are stored in Redis (static:allowlist SET) and propagated
# via pub/sub. Config-file entries are authoritative.
static_allowlist:
  enabled: true             # Default: true. Set to false to disable all static allowlist checks.
  ips: []                   # Add entries as: {ip: "x.x.x.x", comment: "...", added_by: "..."}

# Config reload behaviour.
config:
  hot_reload_enabled: true  # Default: true. SIGHUP and pub/sub config_reload both trigger reload.

# ── Phase 1: Risk Scorer ──────────────────────────────────────────────────

# Composite risk scorer thresholds and action durations.
risk_scorer:
  enabled: true             # Default: true. Set to false to disable scoring (monitor mode forced).
  thresholds:
    flag:       20          # Default: 20. Connection allowed; elevated logging.
    rate_limit: 35          # Default: 35. Connection rate-limited.
    tarpit:     55          # Default: 55. Connection slow-drained.
    block:      70          # Default: 70. Connection rejected with RST.
    ban:        85          # Default: 85. Rejected; IP banned for ban_duration_seconds.
  ban_duration_seconds: 300 # Default: 300 (5 min). Duration of IP bans triggered by scorer.

# ── Phase 2: Monitor Mode & Progressive Blocking Dial ─────────────────────

monitor_mode:
  # 0 = monitor only (log scores, never block). 100 = full blocking.
  # Deploy at 0. Observe risk score distribution. Raise gradually.
  dial: 0
  # Safety gate: proxy resets dial to 0 at startup until explicitly set to true.
  # Set to true only after reviewing score distribution at dial=0.
  blocking_acknowledged: false
  # Include "would=action@dial" in MONITOR log lines and counterfactuals in JSON.
  log_counterfactuals: true
  # Which dial values to include in counterfactual reporting.
  counterfactual_thresholds: [25, 50, 75, 100]
  # Max dial value changes allowed per hour (prevents accidental 0→100 jump).
  max_dial_change_per_hour: 25
  # Emit structured log on every dial change.
  alert_on_dial_change: true

# ── Phase 3: TLS Version & Cipher Enforcement ─────────────────────────────

tls_enforcer:
  enabled: true             # Default: true. Set false to disable all TLS enforcement.
  block_ssl3:       true    # Default: true. Block SSLv3 — protocol is broken by design; no bypass option.
  block_tls_10:     true    # Default: true. Block TLS 1.0 connections (hard block via tls_version_bypass).
  block_tls_11:     true    # Default: true. Block TLS 1.1 connections (hard block via tls_version_bypass).
  flag_tls_12:      false   # Default: false. Set true to add a scored signal for TLS 1.2 connections.
  score:            10      # Score contribution when flag_tls_12 is true. Default: 10.
  block_weak_ciphers: false # Default: false. Hard-block connections offering weak cipher suites.
  weak_cipher_score:  20    # Score contribution when block_weak_ciphers is false. Default: 20.
  weak_ciphers:
    - 0x0004  # TLS_RSA_WITH_RC4_128_MD5
    - 0x0005  # TLS_RSA_WITH_RC4_128_SHA
    - 0x000A  # TLS_RSA_WITH_3DES_EDE_CBC_SHA
    - 0x0035  # TLS_RSA_WITH_AES_256_CBC_SHA (no PFS)
    - 0x002F  # TLS_RSA_WITH_AES_128_CBC_SHA (no PFS)

  # ── Phase 5: TCP & Connection Behaviour + mTLS ────────────────────────────

  tcp_analyzer:
    enabled: true
    tcp_fingerprinting:
      enabled: true
      score: 30
    session_resumption:
      enabled: true
      min_connections: 10
      score: 15
    connection_lifespan:
      enabled: true
      threshold_ms: 500
      min_connections: 5
      score: 20
    concurrent_connections:
      enabled: true
      thresholds: { moderate: 20, high: 50, severe: 100 }
      risk_scores: { moderate: 10, high: 25, severe: 40 }
    return_visitor:
      enabled: true
      trusted_days: 7
      trusted_allow_rate: 0.90
      score_reduction_pct: 20
    tls_alerts:
      enabled: true
      rate_threshold: 5
      score: 20

  mtls:
    enabled: false
    ca_cert_path: "config/trusted_cas.pem"
    require_client_cert: false
    cert_cn_allowlist: []

  # ── Phase 6: ASN & Datacenter Classification ─────────────────────────────

  asn_classifier:
    enabled: true
    datacenter_list_path: "config/asn_datacenter_list.yml"
    maxmind_db_path: "config/GeoLite2-ASN.mmdb"
    tor_exit_list:
      enabled: true
      refresh_interval_seconds: 3600
      download_url: "https://check.torproject.org/tor-exit-consensus"
    risk_contributions:
      tor: 40
      datacenter: 20
      vpn: 10
      unknown: 5
      residential: 0
      mobile: 0

# ── Phase 7: FCrDNS & Passive DNS Enrichment ─────────────────────────────

dns_enrichment:
  enabled: true
  queue_size: 1000          # Max IPs queued for background enrichment.
  worker_count: 5           # Concurrent DNS lookup workers. DNS is fast — more workers than RDAP.
  resolver_timeout_seconds: 5
  resolver_nameservers: []  # Empty = system default. Set to override (e.g. ["8.8.8.8"]).
  fcrdns:
    enabled: true
    cache_ttl_seconds: 21600   # Default: 21600s (6h). DNS can change but usually doesn't.
    no_ptr_score: 15            # Score added when IP has no PTR record.
    fcrdns_failed_score: 20     # Score added when PTR exists but forward-confirm fails.
    residential_score_reduction: 10  # Score removed for confirmed residential PTRs.
  passive_dns:
    enabled: false          # Default: false. Requires external feed API key.
    feed: ""                # Options: circl | dnsdb | custom
    api_key: ""
    cache_ttl_seconds: 3600
    new_domain_days: 7
    score: 20

# ── Phase 8: Spamhaus DROP/EDROP & Blocklist Feed Framework ──────────────

blocklists:
  feeds:
    - name: spamhaus_drop
      url: "https://www.spamhaus.org/drop/drop.txt"
      format: spamhaus         # Options: spamhaus | cidr | ipset
      is_bypass: true          # Default: true. Hard-block matches before scorer.
                               # Set false to route through scorer as RiskSignal instead.
      action: block            # Options: block | tarpit | flag. Default: block.
      score: 80                # Score contribution when is_bypass: false. Default: 80.
      refresh_interval_seconds: 43200   # Default: 43200 (12h).
      enabled: true

    - name: spamhaus_edrop
      url: "https://www.spamhaus.org/drop/edrop.txt"
      format: spamhaus
      is_bypass: true
      action: block
      score: 80
      refresh_interval_seconds: 43200
      enabled: true

    # Example custom scored feed (disabled by default)
    # - name: custom_blocklist
    #   url: "https://example.com/threats.txt"
    #   format: cidr             # Options: cidr | ipset | spamhaus
    #   is_bypass: false         # Produces RiskSignal instead of hard block.
    #   action: block
    #   score: 60                # Risk score contribution when is_bypass: false.
    #   refresh_interval_seconds: 3600
    #   enabled: false

# ── Phase 9: Beaconing Detection ─────────────────────────────────────────────

beaconing_detector:
  enabled: true
  min_observations: 8              # Timestamps required before scoring (prevents FP from coincidental timing)
  window_size: 20                  # Max timestamps to keep per key (memory cap)
  observation_window_seconds: 3600 # Short-window duration (1 hour)
  score: 35                        # Max risk score contribution (multiplied by beacon_score 0–1)

  cv_thresholds:
    strong_beacon: 0.15    # CV < 0.15 → 0.9 confidence (very regular — strong beacon)
    moderate_beacon: 0.40  # CV < 0.40 → 0.5 confidence (moderately regular)
    weak_signal: 0.70      # CV < 0.70 → 0.2 confidence (somewhat regular)
                           # CV ≥ 0.70 → no signal (human-like irregularity)

  long_window:
    enabled: true
    window_seconds: 86400    # 24-hour window for slow-burn APT beacons
    min_observations: 5      # Lower threshold (daily beacons are sparse)
    score: 20                # Lower score cap (less certainty for slow beacons)

  # Phase 14d: cap on the beacon:suspects leaderboard.  When this is exceeded,
  # the lowest-confidence entries are trimmed (ZREMRANGEBYRANK).  Prevents
  # unbounded memory growth under a sustained attack with many unique source IPs.
  # Hot-reloadable.
  max_suspects: 10000

# ── Phase 10: AbuseIPDB Integration ──────────────────────────────────────────

abuseipdb:
  enabled: false                    # Default: false. Set api_key before enabling.
                                    # Toggle false→true via hot reload logs WARN; restart required to start workers.
  api_key: ""                       # Set via ABUSEIPDB_API_KEY env var. Never commit a real key.
  max_requests_per_day: 1000        # Free tier limit; shared across all proxy instances via Redis INCR.
  cache_ttl_seconds: 14400          # 4 hours; controls abuseipdb:score:{ip} Redis key TTL.
  lookup_timeout_seconds: 10        # aiohttp request timeout per API call (seconds).
  shared_ip_threshold: 50           # Confidence below this → contribution capped at 15 (shared IP protection).
  queue_size: 500                   # Max pending IPs; new items dropped silently if queue is full. Requires restart to change.
  worker_count: 3                   # Background worker coroutines draining the lookup queue. Requires restart to change.
  score_cap: 40                     # Maximum contribution to composite score (confidence 100 → 40 pts; never a hard block).
  delegate_to_analytics: false      # Set true when Phase 12 analytics node is deployed; local workers idle.

# ── Phase 11: RDAP Enrichment & Block Expansion ──────────────────────────────

rdap_enrichment:
  enabled: true                     # Master switch. Disable to skip all RDAP lookups.
  queue_size: 500                   # Max pending IPs; new items dropped silently if queue is full. Requires restart to change.
  worker_count: 3                   # Background worker coroutines. Requires restart to change.
  min_enqueue_score: 20             # Only enqueue IPs whose current composite score >= this value.
                                    # Conserves RDAP quota; low-score IPs are not worth enriching.
  lookup_timeout_seconds: 15        # aiohttp request timeout per RDAP API call (seconds).
  delegate_to_analytics: false      # Set true when Phase 12 analytics node is deployed; local workers idle.

  org_reputation:
    enabled: true
    score: 45                       # Risk contribution for known-bad org match.
                                    # 45 + new_netblock(20) = 65 < block_threshold(70) — no false hard-blocks.

  new_netblock_flagging:
    enabled: true
    max_age_days: 90                # Netblocks registered within this many days are flagged.
                                    # Attack infrastructure is often registered shortly before use.
    score: 20                       # Risk contribution for new netblock signal.

  block_expansion:
    enabled: false                  # Default: false. Read docs/phases/PHASE_11.md before enabling.
                                    # Automatically blocks /24 (IPv4) or /48 (IPv6) containing attacker IP.
    min_trigger_score: 75           # Composite score the trigger IP must have reached for expansion.
    max_prefix_length_v4: 24        # Only expand if discovered netblock is /24 or smaller (prefixlen >= 24).
                                    # A /16 (prefixlen=16 < 24) is too broad — skipped.
    max_prefix_length_v6: 48        # Only expand if discovered netblock is /48 or smaller.
    require_no_browser_traffic: true  # Guard 3: abort expansion if browser h2/h1 traffic seen in subnet.
    require_known_bad_org: true       # Guard 4: abort expansion if org not in known_bad_orgs.yml.
    expansion_ban_duration: 3600      # TTL (seconds) for ban_cidr:{cidr} key written on expansion (default 1h).
    max_expansions_per_hour: 10       # Cross-instance safety cap; enforced via Redis atomic counter.

# ── Phase 16: Extended Fingerprinting (JA4X) ─────────────────────────────────

fingerprinting:
  ja4x:
    enabled: true                 # Default: true. Populate ja4x from mTLS client cert chain.
                                  # When disabled, ctx.ja4x is always None; no Redis lookups performed.
    blacklist_score: 80           # Risk score contribution when ctx.ja4x matches the JA4X blacklist.
                                  # 80 > block_threshold(70) at dial=100 → blocked if dial is high enough.
                                  # Uses the same Redis SET structure as the JA4 blacklist.
    emit_in_logs: true            # Include ja4x in structured JSON log output per connection.

# ── Phase 16: OpenTelemetry Distributed Tracing ──────────────────────────────

telemetry:
  tracing:
    enabled: false                # Default: false. Zero-cost noop when disabled.
                                  # Set true only when an OTLP-compatible collector is running.
    endpoint: ""                  # OTLP gRPC endpoint (e.g. http://jaeger:4317).
                                  # Leave empty to keep tracing disabled even if enabled: true.
    service_name: ja4proxy        # Service name recorded in all spans.
    sample_rate: 0.01             # Fraction of connections traced (default 1%).
                                  # At 1000 conn/s → ~10 traces/s sent to collector.
