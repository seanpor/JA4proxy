# Proxy configuration
proxy:
  # Operational mode: "passthrough" (default) or "tap"
  #   passthrough — active inline proxy (forward/block/tarpit connections)
  #   tap         — passive SPAN/TAP capture; never modifies traffic (Phase 20)
  mode: passthrough
  # POC: Bind to all interfaces for Docker networking
  bind_host: "0.0.0.0"
  bind_port: "${PROXY_PORT:-8080}"
  # Backend server — set BACKEND_HOST / BACKEND_PORT in .env to point to your real server.
  # POC default: "backend" (Docker container name). Production: your server IP or hostname.
  # Supports ${VAR:-default} syntax: falls back to "backend":443 if env vars are not set.
  backend_host: "${BACKEND_HOST:-backend}"
  backend_port: "${BACKEND_PORT:-443}"
  # Tarpit container for redirecting blocked connections
  tarpit_host: "tarpit"
  tarpit_port: 8888
  max_connections: 1000
  # Graceful shutdown: max seconds to wait for in-flight connections to complete
  # after SIGTERM before forcing close.  Hot-reloadable.
  drain_timeout_seconds: 30
  # SECURITY FIX: Configurable timeouts to prevent resource exhaustion
  connection_timeout: 30
  read_timeout: 30
  write_timeout: 30
  keepalive_timeout: 60
  # JA4PROXY-2026-0028 — bound the backend TCP connect. Without this, a
  # slow or unresponsive backend would let handler coroutines block for
  # the default OS TCP timeout (~2 minutes), exhausting the event loop.
  # Default matches the tarpit redirect bound (5s). Hot-reloadable.
  backend_connect_timeout_seconds: 5
  buffer_size: 8192
  # Maximum event stream depth to prevent memory exhaustion.
  # Capped at 100k entries via approximate trim (MAXLEN ~ 100000).
  stream_max_len: 100000
  # Enable PROXY protocol v2 support (for HAProxy)
  proxy_protocol: true
  # phase-231a: write a PROXY protocol header to the BACKEND so a TLS-passthrough
  # deployment preserves the real client IP/port without decrypting (e.g. nginx
  # `proxy_protocol` / Apache `RemoteIPProxyProtocol`). Off by default; a config
  # missing these keys loads with the safe defaults. Hot-reloadable.
  write_proxy_protocol: false
  # 1 = human-readable v1 header, 2 = binary v2 header. Any other value = v1.
  write_proxy_protocol_version: 1

# Redis configuration
redis:
  host: "${REDIS_HOST:-redis}"
  port: "${REDIS_PORT:-6379}"
  # Phase 28b: Redis Unix domain socket support
  # Set via REDIS_UNIX_SOCKET_PATH environment variable (e.g. /var/run/redis/redis.sock)
  unix_socket_path: "${REDIS_UNIX_SOCKET_PATH}"
  db: 0
  # SECURITY: Password MUST be set via environment variable REDIS_PASSWORD
  # Never commit actual passwords to version control
  password: "${REDIS_PASSWORD}"
  username: ""   # phase-201a: Redis 6+ ACL username (leave "" for default user)
  timeout: "${REDIS_TIMEOUT:-5}"
  # Enable TLS for Redis connections in production
  ssl: false
  ssl_cert_reqs: "required"
  acl_users:
    # Per-service ACL users. Requires Redis 6+ with ACL support.
    # Create these users in Redis with:
    #   ACL SETUSER proxy on >$REDIS_PASSWORD ~ratelimit:* ~ban:* ~beacon:* ~dns:* ~abuseipdb:* ~rdap:* ~ja4:* ~config:* +GET +SET +DEL +EXPIRE +TTL +ZADD +ZRANGE +ZRANGEBYSCORE +ZREMRANGEBYSCORE +ZCARD +ZINCRBY +SADD +SREM +SISMEMBER +SMEMBERS +HSET +HGET +HINCRBY +HGETALL +PFADD +PFCOUNT +XADD
    #   ACL SETUSER analytics on >$REDIS_PASSWORD ~ja4proxy:events +XADD +XREAD +XREADGROUP
    #   ACL SETUSER admin on >$REDIS_PASSWORD ~* +@all
    # Run scripts/redis-acl-setup.sh to apply these users automatically.
    enabled: false  # Default off — requires Redis ACL setup
    proxy_user: "proxy"
    analytics_user: "analytics"

# Security settings
security:
  whitelist_enabled: true
  blacklist_enabled: true
  rate_limiting: true
  max_requests_per_minute: 100
  # Phase 209 (F-2): policy for connections with unparsable TLS ClientHellos.
  # "forward" — pass through unexamined (fail-open, backwards-compatible default).
  # "block"   — TCP RST the connection (fail-closed for unknown TLS stacks).
  # "tarpit"  — redirect to tarpit container (slow-drain, forensic capture).
  on_unknown_ja4: "forward"
  block_unknown_ja4: false
  tarpit_enabled: true
  tarpit_duration: 10
  block_action: "tarpit"
  ban_duration: 604800
  permanent_ban: false
  max_ban_duration: 2592000

  # Multi-strategy policy: any, all, majority
  # "majority" requires 2 of 3 strategies to agree before blocking — eliminates
  # single-strategy false positives (e.g. BY_IP_JA4_PAIR alone triggering on burst).
  multi_strategy_policy: "majority"

  # Threat thresholds (connections per 1-second window)
  thresholds:
    suspicious: 20
    block: 50
    ban: 100

  # Rate limit strategies
  rate_limit_strategies:
    by_ip:
      enabled: true
      thresholds:
        suspicious: 50
        block: 200
        ban: 500
      action: "tarpit"
      ban_duration: 300
    by_ja4:
      enabled: true
      thresholds:
        suspicious: 20
        block: 100
        ban: 200
      action: "block"
      ban_duration: 300
    by_ip_ja4_pair:
      enabled: true
      thresholds:
        suspicious: 20
        block: 50
        ban: 100
      action: "tarpit"
      ban_duration: 300

  # Adaptive rate limiting (Phase 16h)
  # Requires the analytics node to be running (it computes per-subnet EWMA thresholds).
  # When enabled, the proxy reads rate:adaptive:{subnet} from Redis and uses the
  # analytics-computed threshold instead of the static values above — but only when
  # confidence >= confidence_minimum. Falls back to static config otherwise.
  # Default: disabled. Enable only once analytics node is deployed.
  rate_limiter:
    adaptive:
      enabled: false              # Default: false. Enable only with analytics node running.
      min_threshold_rps: 5        # Never adapt below 5 req/s regardless of EWMA
      max_threshold_rps: 1000     # Never adapt above 1000 req/s
      confidence_minimum: 0.7     # Use adaptive threshold only if analytics confidence >= 0.7
      fallback_to_static: true    # Default: true. Fall back to static if no adaptive data.

  # Known good JA4 fingerprints (whitelisted)
  whitelist:
    - "t13d1412h2_66f623bb91a0_d41ae481755e"  # Benchmark Good
    - "t13d101100_61a7ad8aa9b6_d41ae481755e"  # Benchmark Alt
    - "t13d1516h2_8daaf6152771_02713d6af862"  # Chrome/Chromium
    - "t13d1517h2_8daaf6152771_b0da82dd1658"  # Chrome (pre-shared key)
    - "t13d1517h2_8daaf6152771_b1ff8ab2d16f"  # Chrome (no key)
    - "t13d1715h2_5b57614c22b0_7121afd63204"  # Firefox
    - "t13d2014h2_a09f3c656075_14788d8d241b"  # Safari
    - "t13i1515h2_8daaf6152771_02713d6af862"  # Chrome (IP destination)

  # Pattern-based whitelist: match JA4 prefix patterns (survives OpenSSL version changes)
  # Whitelisted connections skip ALL rate limiting — they are never blocked.
  whitelist_patterns:
    # # - "h2"   # DISABLED per UAT Phase 129: too broad = modern browser (Chrome, Firefox, Safari, Edge)
    # # - "h1"   # DISABLED per UAT Phase 129: too broad = older browser or browser in fallback mode

  # Known bad JA4 fingerprints (blacklisted)
  blacklist:
    - "t13d190900_9dc949149365_97f8aa674fd9"  # Sliver C2 Agent
    - "t13d201100_2b729b4bf6f3_9e7b989ebec8"  # IcedID Banking Trojan
    - "t12d190800_d83cc789557e_16bbda4055b2"  # Cobalt Strike Beacon (wininet)
    - "t12d210800_76e208dd3e22_16bbda4055b2"  # Cobalt Strike Beacon (winhttp)
    - "t12i190700_d83cc789557e_16bbda4055b2"  # Cobalt Strike Beacon (wininet, IP)
    - "t13d191000_9dc949149365_e7c285222651"  # Evilginx Phishing / GoLang net
    - "t13d880900_fcb5b95cb75a_b0d3b4ac2a14"  # SoftEther VPN Client

  # Human-readable names for known JA4 fingerprints (used in metrics labels)
  fingerprint_labels:
    # Known good (browsers)
    "t13d1516h2_8daaf6152771_02713d6af862": "Chrome"
    "t13d1517h2_8daaf6152771_b0da82dd1658": "Chrome (PSK)"
    "t13d1517h2_8daaf6152771_b1ff8ab2d16f": "Chrome (alt)"
    "t13d1715h2_5b57614c22b0_7121afd63204": "Firefox"
    "t13d2014h2_a09f3c656075_14788d8d241b": "Safari"
    "t13i1515h2_8daaf6152771_02713d6af862": "Chrome (IP)"
    # Known bad (malware/tools)
    "t13d190900_9dc949149365_97f8aa674fd9": "Sliver C2"
    "t13d201100_2b729b4bf6f3_9e7b989ebec8": "IcedID Trojan"
    "t12d190800_d83cc789557e_16bbda4055b2": "CobaltStrike (wininet)"
    "t12d210800_76e208dd3e22_16bbda4055b2": "CobaltStrike (winhttp)"
    "t12i190700_d83cc789557e_16bbda4055b2": "CobaltStrike (IP)"
    "t13d191000_9dc949149365_e7c285222651": "Evilginx/GoLang"
    "t13d880900_fcb5b95cb75a_b0d3b4ac2a14": "SoftEther VPN"
    # Suspicious (libraries)
    "t13d181000_85036bcba153_d41ae481755e": "Python stdlib"

# GeoIP country filtering
geoip:
  # Path to IP2Location LITE database (bundled in container)
  database_path: "/app/geoip/IP2LOCATION-LITE-DB1.BIN"

  # Country whitelist: only allow traffic from these countries
  # When enabled, ALL traffic from countries NOT in this list is blocked
  country_whitelist_enabled: false
  country_whitelist:
    - "IE"  # Ireland
    - "GB"  # United Kingdom
    - "IM"  # Isle of Man
    - "JE"  # Jersey
    - "GG"  # Guernsey
    - "US"  # United States
    - "CA"  # Canada
    - "AU"  # Australia
    - "NZ"  # New Zealand
    - "DE"  # Germany
    - "FR"  # France
    - "NL"  # Netherlands

  # Country blacklist: block traffic from these countries
  # Applied before all other checks
  country_blacklist_enabled: false
  country_blacklist:
    - "KP"  # North Korea
    - "RU"  # Russia
    - "CN"  # China
    - "IR"  # Iran

  # Safe countries: NEVER auto-blocked by geoip-monitor even under heavy attack.
  # These are loaded into Redis geoip:safe_countries on startup.
  # Note: this protects against AUTOMATIC blocking only.
  # A manual 'ja4-admin block-country' will be refused for countries in this list.
  safe_countries:
    - "IE"  # Ireland
    - "GB"  # United Kingdom
    - "IM"  # Isle of Man
    - "JE"  # Jersey
    - "GG"  # Guernsey
    - "US"  # United States
    - "CA"  # Canada
    - "AU"  # Australia
    - "NZ"  # New Zealand
    - "DE"  # Germany
    - "FR"  # France
    - "NL"  # Netherlands

# Metrics configuration
metrics:
  enabled: true
  port: "${METRICS_PORT:-9090}"
  # JA4PROXY-2026-0008 — /metrics and /health/deep leak dial setting, ban
  # rates, cert expiry and active-connection counts. Default bind is
  # loopback so same-host Prometheus sidecars still work; any non-loopback
  # bind REQUIRES auth_token and startup will fail-closed otherwise.
  bind_host: "${METRICS_BIND_HOST:-127.0.0.1}"
  auth_token: "${METRICS_AUTH_TOKEN:-}"
  # JA4PROXY-2026-0026 — per-remote-IP token bucket for /metrics, /health,
  # /health/deep, /metrics/summary. 0 disables. Loopback is always exempt
  # so co-located Prometheus sidecars are never throttled. Prometheus
  # default scrape is ~0.067 rps per endpoint, so 20/40 leaves large headroom.
  rate_limit_rps: 20            # phase-118bb
  rate_limit_burst: 40          # phase-118bb

# Backup configuration (Phase 19)
# Backups write Redis state to local filesystem as deterministic, versioned artifacts.
# Each run produces a .bin data file + .manifest.json sidecar with SHA-256 checksum.
# Restore is non-destructive by default; --force wipes Redis first.
backup:
  enabled: false                # Set true to activate scheduled backups
  destination: "/app/backups"   # Directory for backup artifacts; must be mode 0700
  retention_days: 30            # Delete artifacts older than N days (0 = disabled)
  retain_count: 10              # Keep at most N most-recent artifacts (0 = disabled)
  schedule: "0 2 * * *"         # Cron expression for scheduled backups (default: 02:00 daily)
  schedule_enabled: true        # Set false to disable automatic scheduled runs without removing the cron expression
  max_keys_per_run: 5000000     # Hard cap on keys per backup run; prevents disk-exhaustion attack
  max_size_bytes: 10737418240   # Hard cap on total artifact size in bytes (default: 10 GB)
  include_audit_log: false      # Include management:audit_log in backup (adds up to ~1 MB)
  restore_error_threshold: 0.05 # Raise RestoreError if more than this fraction of keys fail during restore (0.05 = 5%)
  cloud_storage:
    enabled: false          # phase-57b: set true to enable cloud upload after backup
    provider: "s3"          # phase-57b: s3 | gcs
    s3:
      bucket: "${BACKUP_S3_BUCKET}"             # phase-57b: S3 bucket name
      region: "${BACKUP_S3_REGION:-us-east-1}"  # phase-57b: AWS region
      prefix: "backups/"                        # phase-57b: key prefix in bucket
      storage_class: "STANDARD"                 # phase-57b: STANDARD | GLACIER
      retention_days: 90                        # phase-57b: delete objects older than N days
    gcs:
      bucket: "${BACKUP_GCS_BUCKET}"            # phase-57c: GCS bucket name
      project_id: "${BACKUP_GCS_PROJECT_ID}"    # phase-57c: Google Cloud project ID
      credentials_path: "${BACKUP_GCS_CREDENTIALS_PATH}"  # phase-57c: path to service account JSON (optional; uses ADC when unset)
      prefix: "backups/"                        # phase-57c: object name prefix in bucket
      storage_class: "STANDARD"                 # phase-57c: STANDARD | NEARLINE | COLDLINE | ARCHIVE
      retention_days: 90                        # phase-57c: delete objects older than N days
# Logging configuration
logging:
  level: "INFO"
  # format: controls the log output format. Options:
  #   "legacy" — JSON with timestamp/level/message at top level (default).
  #   "ecs"    — ECS 8.x-compliant JSON for Splunk, QRadar, Elastic SIEM.
  # Change to "ecs" after dashboard migration is complete.  # phase-80
  format: legacy
  # dual_output: when true and format=ecs, emit both legacy and ECS JSON lines per
  # log entry — useful during SIEM dashboard migration.  Python-only; Go logs ECS-only.
  dual_output: false  # phase-80
  # json_enabled: emit all log lines as JSON objects (one per line).
  # Enabled automatically when ENVIRONMENT=production; set true here to
  # enable in development too.  Structured JSON is required for SIEM ingest.
  json_enabled: false

# Phase 14c: Tarpit self-protection.  Controls how many connections the proxy
# will simultaneously hold in the tarpit container.  When either cap is hit the
# overflow_action is taken instead of tarpitting.
#
# Phase 26d: Multi-process scaling adjustments
# When running N workers, set max_per_ip to ceil(3 / N) to preserve the global
# semantic of "max 3 concurrent tarpit connections per IP across all workers".
# Examples: 2 workers → max_per_ip=2, 4 workers → max_per_ip=1
tarpit:
  max_concurrent_connections: 500  # Hard global cap on simultaneous tarpit slots
  max_per_ip: 3                    # Max concurrent tarpit connections from one source IP (per worker)
  overflow_action: "block"         # When cap reached: block | rst | allow (allow = fail open to backend)
  overflow_log: true               # Log overflow events (always true; field reserved for future rate-limiting)
  # Multi-process scaling (Phase 26d)
  worker_count: 1                  # Number of worker processes (1 = single process mode)

# ── Phase 0: Infrastructure ───────────────────────────────────────────────

# Upstream proxy / CDN trust for PROXY protocol v2 client IP extraction.
# Enable only when the proxy sits behind a CDN or load balancer.
upstream_trust:
  enabled: false            # Default: false. Enable only when behind a trusted upstream.
                            # CAUTION: enabling without setting trusted_cidrs accepts
                            # spoofed client IPs from any source.
  trusted_cidrs:
    - "10.0.0.0/8"          # Internal HAProxy instances — adjust to your network.

# Trusted upstream CIDR sources — dynamic providers merged with static_cidrs.
# phase-94i2
trusted_upstream_sources:                    # phase-94i2
  netbox:                                    # phase-94i2
    enabled: false                           # phase-94i2: opt-in; default off
    url: "https://netbox.corp.internal"      # phase-94i2
    token: "${NETBOX_API_TOKEN}"             # phase-94i2
    tag: "ja4proxy-trusted"                  # phase-94i2
    refresh_on_sighup: true                  # phase-94i2
  static_cidrs:                              # phase-94i2
    - "10.0.0.0/8"                           # phase-94i2: always trusted regardless of NetBox

# In-process LRU cache sizes and per-type TTLs.
# TTLs are tuned for the false-positive asymmetry: allow decisions are
# cached longer than block decisions (a stale allow is less harmful than
# a stale block on a real user).
local_cache:
  whitelist_decisions:
    max_size: 50000          # Default: 50000.
    ttl_seconds: 1800        # Default: 1800s (30 min). Long — stale allow lets traffic through.
  block_decisions:
    max_size: 100000         # Default: 100000.
    ttl_seconds: 30          # Default: 30s. Short — stale block hurts real users.
  abuseipdb_scores:
    max_size: 50000          # Default: 50000.
    ttl_seconds: 14400       # Default: 14400s (4 h). Scores change slowly.
  asn_class:
    max_size: 100000         # Default: 100000.
    ttl_seconds: 3600        # Default: 3600s (1 h).

# Per-bypass security policy. Each bypass is independently toggleable.
# Disabling an ALLOW bypass routes those connections through the scorer.
# Disabling a BLOCK bypass routes matches through the scorer instead.
# The proxy emits a startup WARN for every high-risk bypass that is disabled.
security_policy:
  # ── ALLOW BYPASSES ────────────────────────────────────────────────────
  alpn_browser_bypass:
    enabled: false          # Default: false (JA4PROXY-2026-0004).
                            # ALPN is an attacker-controlled field in the
                            # ClientHello — any bot can set ALPN=h2 and
                            # bypass the entire pipeline. Re-enable ONLY if
                            # your deployment also whitelists browser JA4s
                            # and accepts the residual risk.
  ja4_whitelist_bypass:
    enabled: true           # Default: true. JA4 in whitelist → ALLOW without scoring.
  mtls_bypass:
    enabled: true           # Default: true. Valid mTLS client cert → ALLOW without scoring.
  static_ip_allowlist:
    enabled: true           # Default: true. IP in static allowlist → ALLOW without scoring.

  # ── BLOCK BYPASSES ────────────────────────────────────────────────────
  ja4_blacklist_bypass:
    enabled: true           # Default: true. JA4 in blacklist → immediate RST.
  country_blacklist_bypass:
    enabled: true           # Default: true. Country in GeoIP blocklist → immediate block.
  spamhaus_bypass:
    enabled: true           # Default: true. Spamhaus DROP/EDROP match → immediate block.
  tls_version_bypass:
    enabled: true           # Default: true. TLS 1.0/1.1 → immediate RST (Phase 3+).

# Static IP allowlist. IPs and CIDRs listed here bypass the entire pipeline.
# Both IPv4 and IPv6 supported. CIDR ranges supported.
# UI-added entries are stored in Redis (static:allowlist SET) and propagated
# via pub/sub. Config-file entries are authoritative.
static_allowlist:
  enabled: true             # Default: true. Set to false to disable all static allowlist checks.
  ips: []                   # Add entries as: {ip: "x.x.x.x", comment: "...", added_by: "..."}

# Config reload behaviour.
config:
  hot_reload_enabled: true  # Default: true. SIGHUP and pub/sub config_reload both trigger reload.

# ── Phase 1: Risk Scorer ──────────────────────────────────────────────────

# Composite risk scorer thresholds and action durations.
risk_scorer:
  enabled: true             # Default: true. Set to false to disable scoring (monitor mode forced).
  thresholds:
    flag: 20          # Default: 20. Connection allowed; elevated logging.
    rate_limit: 35    # Default: 35. Connection rate-limited.
    tarpit: 55        # Default: 55. Connection slow-drained.
    block: 70         # Default: 70. Connection rejected with RST.
    ban: 85           # Default: 85. Rejected; IP banned for ban_duration_seconds.
  ban_duration_seconds: 300 # Default: 300 (5 min). Duration of IP bans triggered by scorer.

# ── Phase 2: Monitor Mode & Progressive Blocking Dial ─────────────────────

monitor_mode:
  # 0 = monitor only (log scores, never block). 100 = full blocking.
  # Deploy at 0. Observe risk score distribution. Raise gradually.
  dial: 0
  # Phase 209 (F-4): when Redis is unreachable and this is true, the proxy
  # fails CLOSED — connections that require a Redis check are dropped.
  # When false (default), the proxy fails OPEN (logs WARNING, forwards the
  # connection without the signal). Hot-reloadable.
  dial_fail_closed: false
  # Safety gate: proxy resets dial to 0 at startup until explicitly set to true.
  # Set to true only after reviewing score distribution at dial=0.
  blocking_acknowledged: false
  # Include "would=action@dial" in MONITOR log lines and counterfactuals in JSON.
  log_counterfactuals: true
  # Which dial values to include in counterfactual reporting.
  counterfactual_thresholds: [25, 50, 75, 100]
  # Max dial value changes allowed per hour (prevents accidental 0→100 jump).
  max_dial_change_per_hour: 25
  # Emit structured log on every dial change.
  alert_on_dial_change: true

# ── Phase 3: TLS Version & Cipher Enforcement ─────────────────────────────

tls_enforcer:
  enabled: true             # Default: true. Set false to disable all TLS enforcement.
  block_ssl3: true          # Default: true. Block SSLv3 — protocol is broken by design; no bypass option.
  block_tls_10: true        # Default: true. Block TLS 1.0 connections (hard block via tls_version_bypass).
  block_tls_11: true        # Default: true. Block TLS 1.1 connections (hard block via tls_version_bypass).
  flag_tls_12: false        # Default: false. Set true to add a scored signal for TLS 1.2 connections.
  score: 10                 # Score contribution when flag_tls_12 is true. Default: 10.
  block_weak_ciphers: false # Default: false. Hard-block connections offering weak cipher suites.
  weak_cipher_score: 20     # Score contribution when block_weak_ciphers is false. Default: 20.
  weak_ciphers:
    - 0x0004  # TLS_RSA_WITH_RC4_128_MD5
    - 0x0005  # TLS_RSA_WITH_RC4_128_SHA
    - 0x000A  # TLS_RSA_WITH_3DES_EDE_CBC_SHA
    - 0x0035  # TLS_RSA_WITH_AES_256_CBC_SHA (no PFS)
    - 0x002F  # TLS_RSA_WITH_AES_128_CBC_SHA (no PFS)

  # ── Phase 5: TCP & Connection Behaviour + mTLS ────────────────────────────

  tcp_analyzer:
    enabled: true
    tcp_fingerprinting:
      enabled: true
      score: 30
    session_resumption:
      enabled: true
      min_connections: 10
      score: 15
    connection_lifespan:
      enabled: true
      threshold_ms: 500
      min_connections: 5
      score: 20
    concurrent_connections:
      enabled: true
      thresholds: { moderate: 20, high: 50, severe: 100 }
      risk_scores: { moderate: 10, high: 25, severe: 40 }
    return_visitor:
      enabled: true
      trusted_days: 7
      trusted_allow_rate: 0.90
      score_reduction_pct: 20
    tls_alerts:
      enabled: true
      rate_threshold: 5
      score: 20

  mtls:
    enabled: false
    ca_cert_path: "config/trusted_cas.pem"
    require_client_cert: false
    cert_cn_allowlist: []

  # ── Phase 6: ASN & Datacenter Classification ─────────────────────────────

  asn_classifier:
    enabled: true
    datacenter_list_path: "config/asn_datacenter_list.yml"
    maxmind_db_path: "config/GeoLite2-ASN.mmdb"
    tor_exit_list:
      enabled: true
      refresh_interval_seconds: 3600
      download_url: "https://check.torproject.org/tor-exit-consensus"
    risk_contributions:
      tor: 40
      datacenter: 20
      vpn: 10
      unknown: 5
      residential: 0
      mobile: 0

# ── Phase 7: FCrDNS & Passive DNS Enrichment ─────────────────────────────

dns_enrichment:
  enabled: true
  queue_size: 1000          # Max IPs queued for background enrichment.
  worker_count: 5           # Concurrent DNS lookup workers. DNS is fast — more workers than RDAP.
  resolver_timeout_seconds: 5
  resolver_nameservers: []  # Empty = system default. Set to override (e.g. ["8.8.8.8"]).
  fcrdns:
    enabled: true
    cache_ttl_seconds: 21600   # Default: 21600s (6h). DNS can change but usually doesn't.
    no_ptr_score: 15            # Score added when IP has no PTR record.
    fcrdns_failed_score: 20     # Score added when PTR exists but forward-confirm fails.
    residential_score_reduction: 10  # Score removed for confirmed residential PTRs.
  passive_dns:
    enabled: false          # Default: false. Requires external feed API key.
    feed: ""                # Options: circl | dnsdb | custom
    api_key: ""
    cache_ttl_seconds: 3600
    new_domain_days: 7
    score: 20

# ── Phase 8: Spamhaus DROP/EDROP & Blocklist Feed Framework ──────────────
#
# phase-309 WP-6: the Go proxy now DOWNLOADS each feed with a `url` on its own
# timer (ETag/304-aware, fail-safe: a failed fetch keeps the last-good data) and
# atomically swaps the parsed CIDR trie into the live matcher. The downloaded
# body is cached to `path` for warm-start at boot. If `path` is omitted it
# defaults to /var/lib/ja4proxy/blocklists/<name>.txt — ensure that directory is
# writable. To use an externally-managed file instead of downloading, set `path`
# and leave `url` empty. No leader election: every instance fetches its own copy
# (see docs/decisions/ADR-204.md). refresh_interval_seconds is clamped to a 60s
# minimum.
blocklists:
  feeds:
    - name: spamhaus_drop
      url: "https://www.spamhaus.org/drop/drop.txt"
      format: spamhaus         # Options: spamhaus | cidr | ipset
      is_bypass: true          # Default: true. Hard-block matches before scorer.
                               # Set false to route through scorer as RiskSignal instead.
      action: block            # Options: block | tarpit | flag. Default: block.
      score: 80                # Score contribution when is_bypass: false. Default: 80.
      refresh_interval_seconds: 43200   # Default: 43200 (12h). Min 60s.
      # path: /var/lib/ja4proxy/blocklists/spamhaus_drop.txt  # phase-309: warm-start cache (default derived from name)
      enabled: true

    - name: spamhaus_edrop
      url: "https://www.spamhaus.org/drop/edrop.txt"
      format: spamhaus
      is_bypass: true
      action: block
      score: 80
      refresh_interval_seconds: 43200
      enabled: true

    # Example custom scored feed (disabled by default)
    # - name: custom_blocklist
    #   url: "https://example.com/threats.txt"
    #   format: cidr             # Options: cidr | ipset | spamhaus
    #   is_bypass: false         # Produces RiskSignal instead of hard block.
    #   action: block
    #   score: 60                # Risk score contribution when is_bypass: false.
    #   refresh_interval_seconds: 3600
    #   enabled: false

# ── Phase 9: Beaconing Detection ─────────────────────────────────────────────

beaconing_detector:
  enabled: true
  min_observations: 8              # Timestamps required before scoring (prevents FP from coincidental timing)
  window_size: 20                  # Max timestamps to keep per key (memory cap)
  observation_window_seconds: 3600 # Short-window duration (1 hour)
  score: 35                        # Max risk score contribution (multiplied by beacon_score 0–1)

  cv_thresholds:
    strong_beacon: 0.15    # CV < 0.15 → 0.9 confidence (very regular — strong beacon)
    moderate_beacon: 0.40  # CV < 0.40 → 0.5 confidence (moderately regular)
    weak_signal: 0.70      # CV < 0.70 → 0.2 confidence (somewhat regular)
                           # CV ≥ 0.70 → no signal (human-like irregularity)

  long_window:
    enabled: true
    window_seconds: 86400    # 24-hour window for slow-burn APT beacons
    min_observations: 5      # Lower threshold (daily beacons are sparse)
    score: 20                # Lower score cap (less certainty for slow beacons)

  # Phase 14d: cap on the beacon:suspects leaderboard.  When this is exceeded,
  # the lowest-confidence entries are trimmed (ZREMRANGEBYRANK).  Prevents
  # unbounded memory growth under a sustained attack with many unique source IPs.
  # Hot-reloadable.
  max_suspects: 10000

# ── Phase 10: AbuseIPDB Integration ──────────────────────────────────────────

abuseipdb:
  enabled: false                    # Default: false. Set api_key before enabling.
                                    # Toggle false→true via hot reload logs WARN; restart required to start workers.
  api_key: ""                       # Set via ABUSEIPDB_API_KEY env var. Never commit a real key.
  max_requests_per_day: 1000        # Free tier limit; shared across all proxy instances via Redis INCR.
  cache_ttl_seconds: 14400          # 4 hours; controls abuseipdb:score:{ip} Redis key TTL.
  lookup_timeout_seconds: 10        # aiohttp request timeout per API call (seconds).
  shared_ip_threshold: 50           # Confidence below this → contribution capped at 15 (shared IP protection).
  queue_size: 500                   # Max pending IPs; new items dropped silently if queue is full. Requires restart to change.
  worker_count: 3                   # Background worker coroutines draining the lookup queue. Requires restart to change.
  score_cap: 40                     # Maximum contribution to composite score (confidence 100 → 40 pts; never a hard block).
  delegate_to_analytics: false      # Set true when Phase 12 analytics node is deployed; local workers idle.

# ── Phase 203a: TAP-consumed JA4T-OS-mismatch signal (Go proxy) ──────────────
# The Go inline proxy cannot compute JA4T from an accept()'d socket (the kernel
# has already consumed the SYN). Instead, the Phase 20 TAP node writes JA4T /
# OS-class fingerprints to Redis (`fp:os:ip:{ip}`), and the Go proxy reads them
# on the hot path to emit `tap_os_mismatch` when the JA4-claimed OS class
# disagrees with the TAP-observed OS class. See ADR-203a.
#
# Set enabled: true ONLY if the Phase 20 TAP node is deployed and writing to
# the same Redis instance. With TAP absent, every lookup misses and no signal
# is emitted — safe default is therefore `enabled: false` (fail-open).

tap_consumer:                 # phase-203a
  enabled: false              # default OFF — requires Phase 20 TAP node deployed
  signal_score: 30            # score added to RiskScorer when mismatch detected
  redis_timeout_ms: 50        # short to keep hot path fast; fail open on timeout
  cache_ttl_seconds: 60       # LocalCache TTL for per-IP lookup result
  max_age_seconds: 300        # ignore TAP fingerprints older than this

# ── Phase 32: Attacker Attribution ───────────────────────────────────────────

attribution:
  enabled: true                     # Enable cross-IP attribution logic.
  escalation_multiplier: 1.5        # Multiplier applied to total score if actor is known malicious.
  malicious_threshold: 80           # Score at which a profile is auto-tagged as malicious.
  min_ips_for_suspicious: 3         # Number of unique IPs sharing a fingerprint to trigger 'suspicious'.

# ── Phase 54: Behavioral Attribution ─────────────────────────────────────────

behavioral:
  enabled: true                     # Enable behavioral pattern detection.
  probing_unique_sni_threshold: 5   # Num unique SNIs per fingerprint to flag probing.
  burst_window_ms: 100              # Window for coordinated burst detection.
  burst_count_threshold: 10         # Num unique IPs in window to flag burst.

# ── Phase 23: GreyNoise Integration ──────────────────────────────────────────

greynoise:
  enabled: false                    # Default: false. Set api_key before enabling.
  api_key: ""                       # Set via GREYNOISE_API_KEY env var.
  cache_ttl_seconds: 21600          # 6 hours.
  lookup_timeout_seconds: 5         # aiohttp request timeout per API call.
  score_cap: 30                     # Max risk score contribution.
  noise_score: 25                   # Score if IP is classified as 'noise'.
  riot_score_reduction: 15          # Score reduction for known benign (RIOT) IPs.
  queue_size: 500                   # Max pending IPs.
  worker_count: 2                   # Background workers.

# ── Phase 23: AlienVault OTX Integration ──────────────────────────────────────

alienvault:
  enabled: false                    # Default: false. Set api_key before enabling.
  api_key: ""                       # Set via OTX_API_KEY env var.
  cache_ttl_seconds: 3600           # 1 hour (threat data changes faster).
  lookup_timeout_seconds: 5         # aiohttp request timeout per API call.
  score_cap: 45                     # Max risk score contribution.
  pulse_score: 15                   # Score per pulse association.
  queue_size: 500                   # Max pending IPs.
  worker_count: 2                   # Background workers.

# ── Phase 46: MISP Threat Intelligence ───────────────────────────────────────

misp:
  enabled: false                    # Default: false. Requires a reachable MISP instance.
  api_key: ""                       # Set via MISP_API_KEY env var.
  base_url: ""                      # e.g. https://misp.internal  No trailing slash.
  cache_ttl_seconds: 3600           # 1 hour.
  lookup_timeout_seconds: 10        # aiohttp request timeout per API call.
  score_cap: 50                     # Max risk score contribution.
  attribute_score: 20               # Score per matched MISP attribute.
  queue_size: 500                   # Max pending IPs.
  worker_count: 2                   # Background workers.

# ── Phase 46: ThreatFox Integration ──────────────────────────────────────────

threatfox:
  enabled: false                    # Default: false. Free API; no key required.
  api_key: ""                       # Optional. Increases rate limits if provided.
  cache_ttl_seconds: 3600           # 1 hour.
  lookup_timeout_seconds: 10        # aiohttp request timeout per API call.
  score_cap: 45                     # Max risk score contribution.
  ioc_score: 20                     # Score per matched IOC.
  queue_size: 500                   # Max pending IPs.
  worker_count: 2                   # Background workers.

# ── Phase 46: VirusTotal Integration ─────────────────────────────────────────

virustotal:
  enabled: false                    # Default: false. Requires paid API key for production use.
  api_key: ""                       # Set via VT_API_KEY env var. Required.
  cache_ttl_seconds: 86400          # 24 hours (VT data changes slowly).
  lookup_timeout_seconds: 15        # aiohttp request timeout per API call.
  score_cap: 50                     # Max risk score contribution.
  malicious_threshold: 3            # Min malicious detections to trigger a score.
  malicious_score: 30               # Score contribution per malicious detection batch.
  daily_quota: 500                  # Daily API request quota. 0 = unlimited.
  queue_size: 500                   # Max pending IPs.
  worker_count: 2                   # Background workers.

# ── Phase 59: TI Feed Health & Circuit Breakers ──────────────────────────────
# Shared settings for all TI provider circuit breakers and health probing.
# Not hot-reloadable — restart required for threshold changes.

threat_intelligence:
  circuit_breaker_failure_threshold: 5       # Consecutive failures before a feed's circuit opens.
                                              # Lower = more sensitive; increase for flaky feeds.
  circuit_breaker_recovery_probe_interval: 60.0  # Seconds before probing a tripped circuit (OPEN→HALF_OPEN).
  health_probe_interval_seconds: 30.0        # How often to ping each enabled feed for reachability.
                                              # Set 0 to disable probing (rely on real-request failures only).

# ── Phase 11: RDAP Enrichment & Block Expansion ──────────────────────────────

rdap_enrichment:
  enabled: true                     # Master switch. Disable to skip all RDAP lookups.
  queue_size: 500                   # Max pending IPs; new items dropped silently if queue is full. Requires restart to change.
  worker_count: 3                   # Background worker coroutines. Requires restart to change.
  min_enqueue_score: 20             # Only enqueue IPs whose current composite score >= this value.
                                    # Conserves RDAP quota; low-score IPs are not worth enriching.
  lookup_timeout_seconds: 15        # aiohttp request timeout per RDAP API call (seconds).
  delegate_to_analytics: false      # Set true when Phase 12 analytics node is deployed; local workers idle.

  org_reputation:
    enabled: true
    score: 45                       # Risk contribution for known-bad org match.
                                    # 45 + new_netblock(20) = 65 < block_threshold(70) — no false hard-blocks.

  new_netblock_flagging:
    enabled: true
    max_age_days: 90                # Netblocks registered within this many days are flagged.
                                    # Attack infrastructure is often registered shortly before use.
    score: 20                       # Risk contribution for new netblock signal.

  block_expansion:
    enabled: false                  # Default: false. Read docs/phases/complete/PHASE_11.md before enabling.
                                    # Automatically blocks /24 (IPv4) or /48 (IPv6) containing attacker IP.
    min_trigger_score: 75           # Composite score the trigger IP must have reached for expansion.
    max_prefix_length_v4: 24        # Only expand if discovered netblock is /24 or smaller (prefixlen >= 24).
                                    # A /16 (prefixlen=16 < 24) is too broad — skipped.
    max_prefix_length_v6: 48        # Only expand if discovered netblock is /48 or smaller.
    require_no_browser_traffic: true  # Guard 3: abort expansion if browser h2/h1 traffic seen in subnet.
    require_known_bad_org: true       # Guard 4: abort expansion if org not in known_bad_orgs.yml.
    expansion_ban_duration: 3600      # TTL (seconds) for ban_cidr:{cidr} key written on expansion (default 1h).
    max_expansions_per_hour: 10       # Cross-instance safety cap; enforced via Redis atomic counter.

# ── Phase 16: Extended Fingerprinting (JA4X) ─────────────────────────────────

fingerprinting:
  ja4x:
    enabled: true                 # Default: true. Populate ja4x from mTLS client cert chain.
                                  # When disabled, ctx.ja4x is always None; no Redis lookups performed.
    blacklist_score: 80           # Risk score contribution when ctx.ja4x matches the JA4X blacklist.
                                  # 80 > block_threshold(70) at dial=100 → blocked if dial is high enough.
                                  # Uses the same Redis SET structure as the JA4 blacklist.
    emit_in_logs: true            # Include ja4x in structured JSON log output per connection.

# ── Phase 16: OpenTelemetry Distributed Tracing ──────────────────────────────

telemetry:
  tracing:
    enabled: false                # Default: false. Zero-cost noop when disabled.
                                  # Set true only when an OTLP-compatible collector is running.
    endpoint: ""                  # OTLP gRPC endpoint (e.g. http://jaeger:4317).
                                  # Leave empty to keep tracing disabled even if enabled: true.
    service_name: ja4proxy        # Service name recorded in all spans.
    sample_rate: 0.01             # Fraction of connections traced (default 1%).
                                  # At 1000 conn/s → ~10 traces/s sent to collector.

# ── Phase 56: Honey-Fingerprint & Honey-SNI Deception Detection ───────────────
# Full asset lists live in config/deception.yml (loaded at startup; hot-reloadable).
# This section controls the master switch only.  All other deception settings
# must be edited in deception.yml to avoid accidentally committing honey asset
# details into the primary config file.

deception:
  enabled: false          # Master switch — mirrors deception.enabled in deception.yml.
                          # Set true only after reviewing deception.yml and populating
                          # at least one honey asset list.
  config_path: "config/deception.yml"  # Path to the full deception asset config.
                          # Relative to the proxy working directory.

  # Phase 56b: Dead-Man's Switch — self-terminates proxy if integrity monitor goes silent.
  dead_man_switch:
    enabled: false          # Default: off. Set true when integrity monitor is active.
                            # Self-terminates proxy if integrity check goes silent > timeout.
    timeout_seconds: 300    # How long integrity monitor can be silent before triggering.
    grace_period_seconds: 30 # Startup grace period before switch arms.

  # Phase 56b: Runtime seccomp profile transition.
  # After startup completes, applies a stricter seccomp filter (removes execve/fork/vfork).
  # Requires python3-seccomp (libseccomp-dev); fails open if library is absent.
  seccomp_transition:
    enabled: true           # Default: on. Set false to skip the runtime profile application.
    runtime_profile: "config/seccomp/proxy_runtime.json"  # Path to the strict runtime profile.

# ── Phase 68: Runtime Performance Options ─────────────────────────────────────

runtime:
  event_loop: "uvloop"          # uvloop | default  # phase-68
  # uvloop: libuv-backed asyncio event loop; 2-4x I/O throughput on Linux.
  # Requires uvloop>=0.21. Falls back to asyncio default if not installed.
  # Informational only — the proxy auto-detects uvloop availability at startup.
  # Restart required to apply changes (event loop policy is set once at startup).

  tls_parser_workers: 4         # Thread count for TLS parsing fallback (ThreadPoolExecutor).  # phase-69
  # Number of background threads available for Scapy-based TLS parsing fallback.
  # Bounded to min(tls_parser_workers, os.cpu_count()). Restart required.

# ── Phase 35: Supply-Chain Integrity Monitoring ───────────────────────────────

integrity:                              # phase-35
  verify_on_startup: false              # Set true in production after signing config with config-signer.py.
                                        # When true, proxy exits (code 1) if config/proxy.yml.sig is absent
                                        # or the Ed25519 signature does not match.
                                        # CAUTION: requires a valid signature to be present before enabling.
  pubkey_path: "config/keys/integrity.pub"  # Ed25519 public key path. Generated by config-signer.py genkey.
  audit_log_path: "/var/log/ja4proxy/integrity.log"  # Append-only hash-chained audit log.
                                        # Each entry contains SHA-256 of the previous line (chain).
  monitor_interval_s: 60                # Seconds between background integrity checks.
                                        # Lower values increase detection speed but add I/O overhead.
  monitor_paths:                        # Files and directories hashed by the background monitor.
    - "proxy.py"                        # Main proxy entry point.
    - "src/"                            # All Python security modules.
  shutdown_on_violation: false          # If true, proxy performs a graceful exit when file tampering
                                        # is detected. Default false (alert-only mode).
                                        # Enable only after validating alert routing and runbook.

# ── Webhook event delivery ────────────────────────────────────────────────────
# phase-80: HMAC-signed ECS event delivery to SIEM endpoints
webhooks:
  enabled: false      # Set true to enable webhook delivery
  stream_key: "events:connection"  # Redis stream the dispatcher reads from
  dlq_key: "webhooks:dlq"         # Dead-letter stream for failed deliveries
  endpoints: []
  # JA4PROXY-2026-0031 — bounded XADD queue parameters. Replace the previous
  # fire-and-forget goroutine-per-event pattern with a bounded channel drained
  # by a fixed worker pool. When Redis is slow and the queue fills, events are
  # dropped (ja4proxy_stream_event_drops_total) — connections are still
  # handled, only the telemetry event is shed. Each worker writes with a
  # per-call timeout so a stuck Redis never pins a worker forever.
  stream_queue_capacity: 4096       # phase-118cc
  stream_workers: 4                 # phase-118cc
  stream_write_timeout_seconds: 2.0 # phase-118cc
  # Example endpoint:
  # endpoints:
  #   - id: splunk-hec
  #     url: "${SPLUNK_HEC_URL}"
  #     secret: "${WEBHOOK_SECRET_SPLUNK}"
  #     events: ["block", "ban", "campaign", "dial_change"]
  #     retry_attempts: 3
  #     retry_backoff_seconds: 5
  #     timeout_seconds: 10


# ── Phase 84: Compliance Reporting & Evidence Pack ───────────────────────────

gdpr:                                   # phase-84
  # Number of days to retain raw connection events in the Redis Stream.
  # Events older than this are purged by `ja4proxy-cli compliance purge-expired`
  # or by the POST /api/v1/compliance/purge-expired API endpoint.
  # Adjust to match your jurisdiction's data minimisation obligation.
  retention_days: 90

  # Number of days to retain beaconing data (beacon:* SortedSets).
  beaconing_retention_days: 30

  # Number of days to retain return-visitor data (rv:* Hashes).
  rv_retention_days: 90

  # Number of months to retain monthly aggregate hashes (reporting:monthly:*).
  # These are pseudonymous; longer retention is acceptable for trend analysis.
  monthly_aggs_retention_months: 24

reporting:                              # phase-84
  # Signal-to-category mapping used by the compliance classifier.
  # Keys are RiskSignal names; values are category name and weight.
  # The entry with the highest weight wins. Ties broken alphabetically by category.
  # These override the built-in defaults from DefaultSignalCategories.
  # To add a new signal, add an entry here; to change a category, override the key.
  signal_categories: {}
  # Example override:
  # signal_categories:
  #   custom_feed_hit:
  #     category: "custom_threat_intel"
  #     weight: 95
  #   sni_missing:
  #     category: "automation_tool"
  #     weight: 60    # increase weight relative to default 55

# ── Phase 85: Threat Intelligence Ingestion ───────────────────────────────────
# Inbound threat-intel feed runner. Polls external feeds (TAXII 2.1, Recorded
# Future, CrowdStrike Falcon Intel, generic REST) and turns STIX indicators
# into JA4proxy rules through the Phase 79 Management API.
#
# Architecture: lives in the analytics container (src/analytics/ti_feeds/).
# Never writes directly to proxy rule sets — all mutations go through
# /api/v1/blocklist and /api/v1/bans/{ip:path}.
#
# See docs/phases/complete/PHASE_85.md for the full spec.
threat_intel:
  # phase-85.1 (C4 — security review): defaults are now OFF on a fresh
  # install. Both the runner and the seed file have to be consciously
  # enabled. Rationale: the seed file pushes JA4 entries into the
  # canonical blocklist, which is a HARD block in the proxy bypass
  # chain — i.e. it bypasses the dial. Defaulting it on would violate
  # the project's "never block on first deploy" invariant. An operator
  # who flips `enabled: true` here is acknowledging that vetted-bad
  # JA4s should be blocked unconditionally.
  enabled: false                   # phase-85: master switch for the feed runner
  # The analytics container polls on the intervals declared per feed below.
  # When disabled, existing rules are retained; no new indicators are fetched.

  # Seed file — bundled vetted JA4 fingerprints loaded once at startup.
  seed_file:                       # phase-85
    enabled: false                 # phase-85.1 (C4): off by default — see comment above
    path: "config/known_bad_fingerprints.yml"  # phase-85
    min_entries: 10                # phase-85: WARN if fewer entries loaded

  # Circuit breaker applied per-feed. Distinct from the Phase 14e/59 hot-path
  # breaker (`threat_intelligence.circuit_breaker_*`) because batch-poller
  # semantics differ — see PHASE_85.md §5.4.
  circuit_breaker:                 # phase-85
    failure_threshold: 3           # phase-85: consecutive poll failures before opening
    open_timeout_s: 600            # phase-85: 10-minute quiet window before HALF-OPEN probe
    backoff_max_s: 3600            # phase-85: max backoff on repeated opens (1 hour)

  # Opt-in community feed contribution client (disabled; endpoint not live).
  feed_contribution:               # phase-85
    enabled: false                 # phase-85: never default — customer opts in
    submit_threshold: 90           # phase-85: confidence threshold for submission
    submit_min_occurrences: 100    # phase-85: minimum sightings before submitting
    anonymise: true                # phase-85: GDPR gate is also enforced in code
    endpoint: "https://feed.ja4proxy.io/api/v1/contribute"   # phase-85: future hosted service
    api_key: "${JA4PROXY_FEED_API_KEY}"  # phase-85

  # Outbound feed definitions. All commercial feeds default to enabled=false.
  feeds:                           # phase-85
    - id: taxii-isac               # phase-85
      type: taxii2
      enabled: false               # phase-85: opt-in — configure url/collection/credentials first
      url: "https://taxii.example-isac.org/taxii2/"
      collection_id: "enterprise-attack"
      username: "${TAXII_ISAC_USERNAME}"
      password: "${TAXII_ISAC_PASSWORD}"
      poll_interval_minutes: 60
      min_confidence: 70
      ban_ttl_hours: 168           # 7 days
      consume: [indicator]

    - id: recorded-future          # phase-85
      type: recorded_future
      enabled: false               # phase-85: opt-in
      api_token: "${RF_API_TOKEN}"
      # phase-101e (H9): regional TAXII root. Omit `url` for the default US
      # endpoint (api.recordedfuture.com/taxii2). EU and APAC tenants must
      # set `url` explicitly to avoid cross-region data residency issues:
      #   url: "https://api.eu.recordedfuture.com/taxii2/"
      #   url: "https://api.apac.recordedfuture.com/taxii2/"
      feeds:
        - ip_threat_intel
        - c2_server_tracking
      min_rf_risk_score: 75
      ban_ttl_hours: 72
      poll_interval_minutes: 60

    - id: crowdstrike-falcon       # phase-85
      type: crowdstrike
      enabled: false               # phase-85: opt-in
      client_id: "${CS_CLIENT_ID}"
      client_secret: "${CS_CLIENT_SECRET}"
      # phase-101e (H10): regional Falcon API base. Omit `url` for default
      # US-1 (api.crowdstrike.com). Set explicitly per Falcon tenant region:
      #   url: "https://api.us-2.crowdstrike.com"
      #   url: "https://api.eu-1.crowdstrike.com"
      #   url: "https://api.laggar.gcw.crowdstrike.com"   # GovCloud
      indicator_types: [ip_address]
      min_malicious_confidence: high   # low|medium|high
      poll_interval_minutes: 30
      ban_ttl_hours: 48

    - id: internal-ti              # phase-85
      type: rest
      enabled: false               # phase-85: opt-in
      url: "https://threatintel.corp.internal/api/v1/indicators"
      auth:
        type: bearer
        token: "${INTERNAL_TI_TOKEN}"
      ip_jsonpath: "$.indicators[*].value"
      ttl_jsonpath: "$.indicators[*].expires_in"
      ban_ttl_hours: 24
      poll_interval_minutes: 15

# SNI Analysis (JA4PROXY-2026-0042)
sni_analyzer:
  missing_sni:
    enabled: true
    score: 30
  ip_literal_sni:
    enabled: true
    score: 25
  dga_detection:
    enabled: true
    score_cap: 40
  unexpected_sni:
    enabled: true
    score: 15
  malicious_sni:
    enabled: true
    score: 100
  expected_hostnames:
    - "backend"
    - "localhost"
sync:
  integrity_key_file: "config/integrity.key"
