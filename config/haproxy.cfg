# HAProxy configuration for JA4Proxy
#
# POC architecture:
#   Internet → HAProxy:443 → proxy:8080 (single worker)
#                            ↓
#                         Redis:6379 (shared state)
#
# Production / blue-green (Phase 43): mount config/haproxy.prod.cfg instead.

global
    log stdout format raw local0 info
    maxconn 10000
    # stats socket disabled in POC — /var/run is read-only in the container image
    # stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    retries 3
    maxconn 5000

# Health check / stats endpoint (HTTP)
# JA4PROXY-2026-0015 — use `:?` so HAProxy fails fast if HAPROXY_STATS_USER or
# HAPROXY_STATS_PASSWORD is not set at startup. The previous `:-admin`/`:-admin123`
# defaults silently shipped the container with well-known default credentials,
# exposing backend server topology, IPs, and health status on :8404.
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth ${HAPROXY_STATS_USER:?HAPROXY_STATS_USER must be set}:${HAPROXY_STATS_PASSWORD:?HAPROXY_STATS_PASSWORD must be set}

# Main TLS passthrough frontend
# In POC: no upstream PROXY protocol — bind plain TCP.
# In production behind a CDN/LB that sends PROXY protocol v2, add: accept-proxy
frontend tls_in
    bind *:443
    mode tcp
    option tcplog
    default_backend ja4proxy_workers
    # Fall back to emergency if all workers are down
    use_backend emergency if { nbsrv(ja4proxy_workers) lt 1 }

# Worker backend — POC uses single proxy container.
# Phase 43 production config uses proxy-worker-blue-{1..4} across ports 8080/8083/8084/8085.
backend ja4proxy_workers
    mode tcp
    balance roundrobin
    # Phase 41: deep health check via /health endpoint (port 9090)
    option tcp-check
    tcp-check connect port 9090
    tcp-check send GET\ /health\ HTTP/1.0\r\n
    tcp-check send Host:\ localhost\r\n
    tcp-check send \r\n
    tcp-check expect string \"status\":\ \"healthy\"
    server worker1 proxy:8080 check inter 5000 rise 2 fall 3

# Emergency fallback — used when all workers fail health checks
backend emergency
    mode tcp
    server emergency-fallback proxy:8080
