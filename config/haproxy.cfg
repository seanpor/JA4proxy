# HAProxy configuration for JA4Proxy multi-process scaling (Phase 26d)
#
# Architecture:
# Internet → HAProxy:443 → [proxy-worker-1:8080, proxy-worker-2:8083, ...]
#                          ↓
#                       Redis:6379 (shared state)

global
    log stdout format raw local0 info
    maxconn 10000
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    retries 3
    maxconn 5000

# Health check endpoint (HTTP for compatibility)
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    # Phase 29b: Use environment variable for stats authentication
    stats auth ${HAPROXY_STATS_USER:-admin}:${HAPROXY_STATS_PASSWORD:-admin123}

# Main TLS frontend - accepts PROXY protocol from upstream
frontend tls_in
    bind *:443
    mode tcp
    option tcplog
    # Accept PROXY protocol v2 from upstream load balancers/CDNs
    accept-proxy
    
    # Distribute connections across all workers using round-robin
    default_backend ja4proxy_workers

# Worker backend - TCP load balancing
backend ja4proxy_workers
    mode tcp
    balance roundrobin
    
    # Phase 41: Deep health checks using /health endpoint (9090)
    # This ensures Redis and GeoIP are functional, not just the TCP stack.
    option tcp-check
    tcp-check connect port 9090
    tcp-check send GET\ /health\ HTTP/1.0\r\n
    tcp-check send Host:\ localhost\r\n
    tcp-check send \r\n
    tcp-check expect string \"status\":\ \"healthy\"
    
    # Worker servers
    server worker1 proxy-worker-1:8080 check inter 5000 rise 2 fall 3
    server worker2 proxy-worker-2:8083 check inter 2000 rise 2 fall 3
    server worker3 proxy-worker-3:8084 check inter 2000 rise 2 fall 3
    server worker4 proxy-worker-4:8085 check inter 2000 rise 2 fall 3

# Health check - simple TCP connect test
# Workers must respond within 2s, 2 successes to mark up, 3 failures to mark down

# Emergency backend - direct to single worker if all others fail
backend emergency
    mode tcp
    server emergency-fallback proxy-worker-1:8080

# Use emergency backend if all workers are down
frontend tls_in
    errorfile 503 /etc/haproxy/errors/503.http
    use_backend emergency if { nbsrv(ja4proxy_workers) lt 1 }
