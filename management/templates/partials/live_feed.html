<!--
  HTMX Partial: live_feed.html
  Uses hx-ext="sse" to stream events from /api/v1/events
  Each SSE event message is a <tr> fragment to be prepended into the tbody.
  Template vars: none (SSE streams directly into tbody)
-->

<div id="live-feed"
     hx-ext="sse"
     sse-connect="/api/v1/events"
     sse-swap="message"
     hx-swap="afterbegin"
     hx-target="#live-feed-body"
     class="overflow-hidden">

  <div class="overflow-x-auto">
    <table class="custom-table" aria-label="Live connection feed">
      <thead>
        <tr>
          <th class="w-[120px]">Time (UTC)</th>
          <th>Client IP</th>
          <th class="hidden sm:table-cell">JA4 Fingerprint</th>
          {# phase-828b: who owns the address, and whether an explicit rule or
             the scorer made the call. Both were already in every event. #}
          <th class="hidden lg:table-cell w-[180px]">Origin</th>
          <th class="w-[110px]">Action</th>
          <th class="text-right w-[70px]">Score</th>
          <th class="text-right w-[110px]"></th>
        </tr>
      </thead>
      <tbody id="live-feed-body"
             x-data="liveFeed()"
             x-init="startMaxRows()"
             class="divide-y divide-[#1e293b]/40">
        <!-- phase-828: placeholder rows shown ONLY until the stream's first
             paint. They used to be permanent: the feed started at "$" (live
             only), so with no traffic in flight these five pulsing bars were
             the entire live feed, forever. They are now removed on the
             backfill-complete event, which also carries the row count so an
             empty stream can say so in words. -->
        {% for _ in range(5) %}
        <tr class="animate-pulse" data-skeleton>
          <td><div class="h-2.5 w-16 bg-[#1e293b]/55 rounded"></div></td>
          <td><div class="h-2.5 w-24 bg-[#1e293b]/55 rounded"></div></td>
          <td class="hidden sm:table-cell"><div class="h-2.5 w-40 bg-[#1e293b]/55 rounded"></div></td>
          <td class="hidden lg:table-cell"><div class="h-2.5 w-24 bg-[#1e293b]/55 rounded"></div></td>
          <td><div class="h-2.5 w-14 bg-[#1e293b]/55 rounded"></div></td>
          <td class="text-right"><div class="h-2.5 w-8 bg-[#1e293b]/55 rounded ml-auto"></div></td>
          <td></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <!-- SSE connection status bar -->
  <div class="flex items-center gap-2 px-3 py-2.5 border-t border-[#1e293b]/55 bg-[#0b0f19]/20">
    <span id="sse-indicator" class="w-1.5 h-1.5 rounded-full bg-[#f59e0b] shadow-[0_0_6px_rgba(245,158,11,0.5)] transition-all duration-350"></span>
    <span id="sse-status" class="text-[10px] text-[#475569] font-medium">Connecting…</span>
  </div>

</div>

<script>
(function() {
  // Update SSE connection indicator
  var indicator = document.getElementById('sse-indicator');
  var status = document.getElementById('sse-status');

  // phase-828: clear the placeholders once the server says the first paint is
  // done, and replace them with a plain statement when there is genuinely
  // nothing to show. Previously nothing ever removed them, so "no traffic yet"
  // and "the feed is broken" looked identical -- and both looked broken.
  function clearSkeletons(count) {
    var tbody = document.getElementById('live-feed-body');
    if (!tbody) return;
    tbody.querySelectorAll('tr[data-skeleton]').forEach(function(el) { el.remove(); });
    var existing = tbody.querySelector('tr[data-empty]');
    if (existing) existing.remove();
    if (tbody.querySelectorAll('tr').length === 0) {
      var tr = document.createElement('tr');
      tr.setAttribute('data-empty', '');
      tr.innerHTML = '<td colspan="7" class="py-6 text-center text-xs text-[#64748b]">'
        + 'No connections recorded yet. New connections appear here as they arrive.</td>';
      tbody.appendChild(tr);
    }
  }

  document.body.addEventListener('htmx:sseMessage', function(e) {
    if (e.detail && e.detail.type === 'backfill-complete') {
      clearSkeletons(parseInt(e.detail.data, 10) || 0);
    }
  });

  // Belt and braces: if the named event never arrives (an old server, or a
  // proxy that strips unknown event types), do not leave fake rows up.
  document.addEventListener('htmx:sseOpen', function() {
    setTimeout(function() {
      var tbody = document.getElementById('live-feed-body');
      if (tbody && tbody.querySelector('tr[data-skeleton]')) clearSkeletons(0);
    }, 3000);
  });

  document.addEventListener('htmx:sseOpen', function() {
    if (indicator) { indicator.className = 'w-1.5 h-1.5 rounded-full bg-[#10b981] shadow-[0_0_8px_rgba(16,185,129,0.6)] transition-all duration-350'; }
    if (status) { status.textContent = 'Live'; }
  });
  document.addEventListener('htmx:sseError', function() {
    if (indicator) { indicator.className = 'w-1.5 h-1.5 rounded-full bg-[#ef4444] shadow-[0_0_8px_rgba(239,68,68,0.6)] transition-all duration-350'; }
    if (status) { status.textContent = 'Disconnected — reconnecting…'; }
  });
  document.addEventListener('htmx:sseClose', function() {
    if (indicator) { indicator.className = 'w-1.5 h-1.5 rounded-full bg-[#f59e0b] shadow-[0_0_6px_rgba(245,158,11,0.5)] transition-all duration-350'; }
    if (status) { status.textContent = 'Closed'; }
  });
})();

function liveFeed() {
  return {
    maxRows: 50,
    startMaxRows() {
      // Trim tbody to maxRows whenever HTMX inserts a new row
      var observer = new MutationObserver(function() {
        var tbody = document.getElementById('live-feed-body');
        if (!tbody) return;
        var empty = tbody.querySelector('tr[data-empty]');
        if (empty && tbody.querySelectorAll('tr').length > 1) empty.remove();
        while (tbody.children.length > 50) {
          tbody.removeChild(tbody.lastElementChild);
        }
      });
      var tbody = document.getElementById('live-feed-body');
      if (tbody) {
        observer.observe(tbody, { childList: true });
      }
    }
  }
}
</script>
