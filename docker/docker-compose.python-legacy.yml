# docker-compose.python-legacy.yml — overlay that adds the Python proxy alongside the Go stack.
# Use for cross-language parity validation and legacy feature prototyping only.
# The Go proxy is the production default (runs as the 'proxy' service in docker-compose.poc.yml).
#
# Usage: docker compose -f docker-compose.poc.yml -f docker-compose.python-legacy.yml --env-file .env.<agent> up -d
#   or:  make go-start  (starts Python legacy proxy for parity comparison)
#
# Python proxy listens on :8083 (host) / :8080 (container)
# Python metrics listen on :9093 (host) / :9090 (container)
# Go proxy (primary) remains on :8081 / :9090.
# Both proxies share the same Redis instance (data_net).

services:
  python-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:8083:8080"
      - "${AGENT_BIND_IP:-127.0.0.1}:9093:9090"
    environment:
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      BACKEND_HOST: "${BACKEND_HOST:-backend}"
      BACKEND_PORT: "${BACKEND_PORT:-443}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      - redis
    networks:
      - dmz_net
      - data_net
      - origin_net
      - mgmt_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3

# Networks are declared in docker-compose.poc.yml (dmz_net, data_net, origin_net, mgmt_net).
# No network declarations needed here — the overlay inherits them from the base file.
