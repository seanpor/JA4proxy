[mypy]
# Phase 16f baseline — --ignore-missing-imports --no-strict-optional
# Goal: zero errors in new code; suppress known legacy patterns.
# Phase 16g will tighten to --strict once Redis typing is resolved.
python_version = 3.14
ignore_missing_imports = True
no_strict_optional = True
warn_return_any = False
warn_unused_ignores = False
# Suppress "Library stubs not installed" (import-untyped) raised by mypy ≥1.19
# when third-party stub packages (e.g. types-PyYAML) are absent in CI Docker.
disable_error_code = import-untyped

# ── New code (Phase 16+) — no suppressions ──────────────────────────────────
# src/analytics/aggregation.py  (fixed in Phase 16f)
# scripts/ja4proxy_admin.py     (clean from Phase 16k)

# ── Legacy / non-src code ─────────────────────────────────────────────────────
# Root cause: self.redis initialised as Optional[redis.Redis] without
# type annotation, so mypy infers `object`. Fix in Phase 16g (strict pass).
[mypy-proxy]
ignore_errors = True

# security/validation.py pre-dates Phase 16 strict baseline; legacy module.
[mypy-security.validation]
ignore_errors = True

