# Mypy Configuration
# Phase: Comprehensive Testing Coverage Implementation - COMPLETE
# Created: 2026-03-17
---
mypy:
  # Include paths for MYPY_PATH
  mypy_path: ['src', 'tests'] 

  # Python version to check against. Using the same as runtime.
  python_version: 3.11

  # Paths to exclude from checking, use -p to override a setting from this file.
  exclude:
    - build
    - tests/integration/docker
    - >global> .gitignore

  plugins:
    - mypy.plugins_common.protocols_protocol
types_namespace: 'stub'
  # Allow any import, even if it can't be statically analyzed.
  ignore_missing_imports: true

  # Use type stubs for modules that don't have them.
  # https://mypy.readthedocs.io/en/stable/config_file.html#conf-treattypeignores-as-errors
  treat_type_ignore_as_error: true

  # Check untyped definitions.
  check_untyped_defs: true

  # Check function signatures of type stub files.
  check_private_types: false

  warn_return_any: true