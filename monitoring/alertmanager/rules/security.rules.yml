groups:
  - name: ja4proxy_security
    rules:
      - alert: AbuseIPDBQuotaExhausted
        expr: ja4proxy_abuseipdb_quota_exhausted == 1
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "AbuseIPDB daily quota exhausted; enrichment paused until midnight UTC"
          runbook: "docs/runbooks/external_api_failures.md"
          runbook_url: "https://docs.ja4proxy.example.com/runbooks/{{ $labels.alertname }}"

      - alert: SpamhausDownloadFailed
        expr: rate(ja4proxy_blocklist_download_errors_total[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Spamhaus DROP/EDROP download failing"
          runbook: "docs/runbooks/feed_management.md"
          runbook_url: "https://docs.ja4proxy.example.com/runbooks/{{ $labels.alertname }}"

      - alert: SpamhausListStale
        expr: time() - ja4proxy_blocklist_last_refresh_success_seconds > 7200
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Spamhaus list not refreshed for >2 hours"
          runbook_url: "https://docs.ja4proxy.example.com/runbooks/{{ $labels.alertname }}"

      - alert: PipelineInternalError
        expr: rate(ja4proxy_pipeline_unexpected_errors_total[1m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "Pipeline internal error ({{ $labels.phase }})"
          description: "An unexpected exception was re-raised in the pipeline. Check logs immediately."
          runbook: "docs/runbooks/security_incident_response.md#pipeline-internal-error"
          runbook_url: "https://docs.ja4proxy.example.com/runbooks/{{ $labels.alertname }}"

      - alert: ExceptionRateSpike
        expr: |
          rate(ja4proxy_exception_handled_total[5m]) > 2 *
          avg_over_time(rate(ja4proxy_exception_handled_total[5m])[1h:5m])
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Exception rate 2× above 1h baseline in {{ $labels.module }}"
          description: "Spike may indicate new failure mode. Current: {{ $value | humanize }}/s"
          runbook: "docs/runbooks/security_incident_response.md#exception-rate-spike"
          runbook_url: "https://docs.ja4proxy.example.com/runbooks/{{ $labels.alertname }}"
