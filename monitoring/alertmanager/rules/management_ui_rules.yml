groups:
  - name: management_ui
    rules:
      - alert: ManagementUIHighAuthFailures
        expr: rate(ja4proxy_mgmt_auth_failures_total[5m]) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Management UI: high authentication failure rate"
          description: "Auth failure rate {{ $value | humanize }}/s over 5 minutes. Possible brute-force attack."

      - alert: ManagementUIRedisErrors
        expr: rate(ja4proxy_mgmt_redis_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Management UI: Redis errors detected"
          description: "Redis error rate {{ $value | humanize }}/s. Check Redis connectivity and management server logs."

      - alert: ManagementUISSESubscribersCapped
        expr: ja4proxy_mgmt_sse_subscribers_active >= 45
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Management UI: SSE subscriber cap approaching"
          description: "{{ $value }} active SSE subscribers (cap: 50). Consider increasing MAX_SSE_SUBSCRIBERS if legitimate demand."

      - alert: ManagementUIDialAtMaximumBlocking
        expr: ja4proxy_dial_setting == 100
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Management UI: Blocking dial is at maximum (100)"
          description: "Dial has been at 100 for 30 minutes. Verify this is intentional and monitor for false positives."

      - alert: ManagementUIHighRequestLatency
        expr: histogram_quantile(0.99, rate(ja4proxy_mgmt_request_duration_ms_bucket[5m])) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Management UI: High request latency"
          description: "p99 request latency is {{ $value | humanize }}ms. Investigate Redis performance or backend issues."

      - alert: ManagementUIHighErrorRate
        expr: rate(ja4proxy_mgmt_requests_total{status="5xx"}[5m]) / rate(ja4proxy_mgmt_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Management UI: High error rate"
          description: "{{ $value | humanizePercentage }} of requests returning 5xx errors. Check server logs and Redis connectivity."

      - alert: ManagementUIConfigurationChange
        expr: increase(ja4proxy_mgmt_actions_total{action="thresholds_update"}[5m]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Management UI: Thresholds configuration changed"
          description: "Score thresholds were updated. Review changes in audit log and monitor for impact on blocking rates."

      - alert: ManagementUIPolicyChange
        expr: increase(ja4proxy_mgmt_actions_total{action="policy_change"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Management UI: Security policy changed"
          description: "A security bypass was enabled or disabled. Review policy audit log immediately as this may increase blocking aggressiveness."

      - alert: ManagementUIDialChange
        expr: increase(ja4proxy_mgmt_actions_total{action="dial_change"}[5m]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Management UI: Blocking dial changed"
          description: "Dial value changed to {{ $value }}. Monitor blocking rates and false positive alerts."

      - alert: ManagementUINoRecentEvents
        expr: time() - ja4proxy_analytics_last_event_timestamp > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Management UI: No recent connection events"
          description: "No events received in the last 5 minutes. Check proxy-to-Redis connectivity and stream configuration."
