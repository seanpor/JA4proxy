# Phase 63 dependency — ja4proxy_tls_cert_expiry_timestamp_seconds gauge.
# The gauge is set at proxy startup and updated on each SIGHUP hot-reload.
# No absent_over_time guard is needed because the gauge is always present
# when the proxy is running.

groups:
  - name: tls_certificate_expiry
    rules:
      - alert: JA4proxyTLSCertExpiringSoon
        expr: |
          (ja4proxy_tls_cert_expiry_timestamp_seconds - time()) / 86400 < 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires in {{ $value | humanize }} days"
          runbook_url: "docs/runbooks/tls_certificate_rotation.md"
          description: |
            The proxy's server-side TLS certificate expires in less than 30 days.
            Rotate using docs/runbooks/tls_certificate_rotation.md.

      - alert: JA4proxyTLSCertExpiryCritical
        expr: |
          (ja4proxy_tls_cert_expiry_timestamp_seconds - time()) / 86400 < 7
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate expires in {{ $value | humanize }} days — CRITICAL"
          runbook_url: "docs/runbooks/tls_certificate_rotation.md"
          description: |
            The proxy's server-side TLS certificate expires in less than 7 days.
            Rotate immediately using docs/runbooks/tls_certificate_rotation.md.

      - alert: JA4proxyTLSCertExporterDown
        expr: |
          absent_over_time(ja4proxy_tls_cert_expiry_timestamp_seconds[5m])
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TLS cert exporter is not reporting"
          runbook_url: "docs/runbooks/tls_certificate_rotation.md"
          description: |
            The ja4proxy_tls_cert_expiry_timestamp_seconds gauge has not been
            updated in 5 minutes. The proxy may be down or the metrics exporter
            is failing. If the proxy is down, the cert cannot be monitored.
