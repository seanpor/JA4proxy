# Prometheus Alert Rules for JA4proxy
# Phase 14e: Rewritten to use real ja4proxy_* metric names.
# All previous expressions referenced non-existent pre-Phase-1 metrics.
#
# Load path: referenced from monitoring/prometheus/prometheus.yml under rule_files.

groups:
  # ── Proxy core ─────────────────────────────────────────────────────────────
  - name: ja4proxy_proxy
    interval: 30s
    rules:
      - alert: ProxyHighBlockRate
        expr: rate(ja4proxy_connections_total{action=~"block|ban"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
          component: ja4proxy
        annotations:
          summary: "High block/ban rate ({{ $value | humanize }}/s)"
          description: "JA4proxy is blocking or banning more than 10 connections/s. Possible attack in progress."
          runbook: "docs/runbooks/high_block_rate.md"

      - alert: ProxyHighTarpitRate
        expr: rate(ja4proxy_connections_total{action="tarpit"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
          component: ja4proxy
        annotations:
          summary: "High tarpit rate ({{ $value | humanize }}/s)"
          description: "More than 5 connections/s being tarpitted. Review dial and tarpit cap settings."

      - alert: ProxyTarpitConcurrentHigh
        expr: ja4proxy_tarpit_concurrent > 400
        for: 2m
        labels:
          severity: warning
          component: ja4proxy
        annotations:
          summary: "Tarpit concurrent connections near cap ({{ $value }}/500)"
          description: "Tarpit slots are {{ $value }}/500. When the cap is reached, overflow_action triggers."
          runbook: "docs/runbooks/tarpit_capacity.md"

      - alert: ProxyDialChanged
        expr: changes(ja4proxy_dial_current[5m]) > 0
        for: 0m
        labels:
          severity: info
          component: ja4proxy
        annotations:
          summary: "JA4proxy blocking dial changed"
          description: "The dial setting was changed. Current value: {{ $value }}. Monitor false-positive rates."

      - alert: ProxyInstanceDown
        expr: up{job="ja4proxy"} == 0
        for: 1m
        labels:
          severity: critical
          component: ja4proxy
        annotations:
          summary: "JA4proxy instance is unreachable"
          description: "JA4proxy is not responding to health checks. All traffic is unprotected."
          runbook: "docs/runbooks/proxy_down.md"

  # ── Redis ───────────────────────────────────────────────────────────────────
  - name: ja4proxy_redis
    interval: 60s
    rules:
      - alert: RedisDown
        expr: up{job="ja4proxy-redis"} == 0
        for: 1m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "Redis is unreachable — proxy scoring degraded"
          description: "JA4proxy Redis instance is down. All Redis-backed features (scoring, rate limiting, bans) are unavailable. Proxy fails open."
          runbook: "docs/runbooks/redis_down.md"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.80
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis memory at {{ $value | humanizePercentage }}"
          description: "Redis is using more than 80% of its configured maxmemory. Keys may be evicted under allkeys-lru policy."
          runbook: "docs/runbooks/redis_memory.md"

  # ── Security / enrichment ───────────────────────────────────────────────────
  - name: ja4proxy_security
    interval: 60s
    rules:
      - alert: AbuseIPDBQuotaExhausted
        expr: ja4proxy_abuseipdb_quota_exhausted == 1
        for: 0m
        labels:
          severity: warning
          component: abuseipdb
        annotations:
          summary: "AbuseIPDB daily quota exhausted — enrichment paused"
          description: "AbuseIPDB lookups are suspended until midnight UTC. Connections will be scored without AbuseIPDB signals."
          runbook: "docs/runbooks/external_api_failures.md"

      - alert: SpamhausDownloadFailed
        expr: rate(ja4proxy_blocklist_download_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: blocklist
        annotations:
          summary: "Spamhaus DROP/EDROP download failing"
          description: "Blocklist feed downloads are erroring. The DROP/EDROP lists will become stale."
          runbook: "docs/runbooks/feed_management.md"

      - alert: SpamhausListStale
        expr: time() - ja4proxy_blocklist_last_refresh_success_seconds > 7200
        for: 5m
        labels:
          severity: warning
          component: blocklist
        annotations:
          summary: "Spamhaus list not refreshed for >2 hours"
          description: "The blocklist was last successfully refreshed {{ $value | humanizeDuration }} ago. Hard-block coverage may be degraded."
          runbook: "docs/runbooks/feed_management.md"

      - alert: BeaconingDetected
        expr: ja4proxy_beaconing_suspects > 0
        for: 5m
        labels:
          severity: info
          component: beaconing
        annotations:
          summary: "{{ $value }} active beaconing suspects"
          description: "Beaconing detector has identified suspect connections. Review beacon:suspects leaderboard via Management UI."

  # ── Analytics ───────────────────────────────────────────────────────────────
  - name: ja4proxy_analytics
    interval: 60s
    rules:
      - alert: ScoreDriftDetected
        expr: ja4proxy_analytics_score_drift_detected == 1
        for: 5m
        labels:
          severity: warning
          component: analytics
        annotations:
          summary: "Risk score median has drifted from 7-day baseline"
          description: "The 1-hour risk score median has deviated more than 2 standard deviations from the 7-day baseline. Possible change in attack patterns or misconfiguration."
          runbook: "docs/runbooks/analytics_lag.md"

      - alert: AnalyticsStreamLagHigh
        expr: ja4proxy_analytics_stream_lag_seconds > 60
        for: 5m
        labels:
          severity: warning
          component: analytics
        annotations:
          summary: "Analytics node lagging ({{ $value | humanizeDuration }})"
          description: "The analytics consumer is behind the proxy event stream. Cross-instance signals (campaign, slow-scan) may be stale."
          runbook: "docs/runbooks/analytics_lag.md"
