  - id: CVE-2026-114603
    scope: third-party
    severity: MEDIUM
    source: pip-audit
    carriers: ["opentelemetry-api"]
    rationale: >-
      OpenTelemetry Python API 1.37.0. semgrep 1.181.0 hard-pins opentelemetry-api~=1.37.0
      (and related OTEL packages) and no semgrep release relaxes that pin to allow
      >=1.45.1; bumping opentelemetry-api independently breaks semgrep's resolution.
      The vulnerable path is TraceState.from_header quadratic parsing reached via
      the default W3C Trace Context propagator — a DoS vector on untrusted
      tracestate headers. opentelemetry-api is pulled in only by semgrep (a CLI
      scanner) and is imported by no first-party module; no OTEL propagators are
      used by JA4proxy's request handling. Dev/CI tooling only.
      SEVERITY NOTE: the advisory is MEDIUM (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/
      S:U/C:N/I:N/A:L = 5.3, availability only). pip-audit carries no severity, so
      scan_baseline.pypi_findings treats every pip finding as gating and the
      monitor files it as HIGH. Both are recorded here rather than reconciled:
      the advisory severity is what a reader needs, and the gate stays
      conservative regardless of this label.
    reachability: not-imported
    fix_available: false
    recheck_trigger: "semgrep relaxes its opentelemetry pins to allow opentelemetry-api>=1.45.1"
    created: 2026-10-23
    expires: 2027-01-21

  # ── Go crypto/x509 (CVE-2026-111943) in images with no fixed tag ──────────
  - id: CVE-2026-111943
    scope: third-party
    severity: HIGH
    source: trivy
    carriers: ["grafana/grafana:13.2.4-ubuntu", "prom/alertmanager:v0.34.1"]
    rationale: >-
      Go crypto/x509 can build a verified chain through an intermediate
      certificate the platform trust store no longer trusts (CVSS 6.8,
      AV:N/AC:H/PR:N/UI:R). Trivy reports it against the Go stdlib embedded in
      grafana 13.2.4-ubuntu (14 bundled binaries, Go <= 1.27.1) and
      alertmanager v0.34.1; the fix is a rebuild on Go 1.26.10 / 1.27.3, which
      only the publisher can do. Both are the newest published tags in their
      release line (checked 2026-10-23), so no upgrade we can take clears it.
      Phase 847g bumped every sibling monitoring image that DID ship a fixed
      rebuild (loki 3.7.9, alloy v1.21.2, prometheus v3.15.1, redis_exporter
      v1.95.0 — all now scan clean); these two are what remains. Exposure: both
      bind ${AGENT_BIND_IP:-127.0.0.1} only and are reached over the internal
      compose network. Reaching this bug needs the process to be a TLS *client*
      to a peer an attacker can intercept AND that peer to present a chain
      through a distrusted intermediate. Grafana's provisioned data sources are
      plain http://prometheus:9090 and http://loki:3100, and Alertmanager's
      receivers are a local logger webhook plus Slack/PagerDuty/email entries
      whose endpoints are placeholders in this repository — so the egress path
      is not active as shipped, and where an operator activates a real HTTPS
      receiver the preconditions above still have to be met. Not claimed: that
      neither process ever speaks TLS outbound (Grafana's own update/analytics
      calls are TLS); claimed: the exploit path needs an interception position
      we do not concede, and the fix is the publisher's to ship.
    reachability: internal-monitoring-only
    fix_available: false
    recheck_trigger: >-
      grafana/grafana or prom/alertmanager publish a tag rebuilt with Go >= 1.26.10
    created: 2026-10-23
    expires: 2027-01-21

