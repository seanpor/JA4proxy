# =============================================================================
# security/waivers.yaml — THE single source of truth for CVE waivers.
# (Phase 847a)
# =============================================================================
#
# This file is the ONLY place a CVE waiver is authored. Everything else is
# generated from it by `scripts/render_waivers.py`:
#
#   .trivyignore.third-party   <- generated (Trivy, scope: third-party)
#   .trivyignore.first-party   <- generated (Trivy, scope: first-party)
#   .pip-audit-ignores         <- generated (pip-audit --ignore-vuln args)
#
# DO NOT hand-edit the generated files. `tests/unit/test_waivers_registry.py`
# fails if a generated file does not match what the renderer produces from this
# registry. Edit here, then run `python3 scripts/render_waivers.py`.
#
# WHY (Phase 847): before this, waivers lived in two hand-maintained places
# (the Makefile and ci.yml for pip-audit; .trivyignore.* for Trivy) and had
# already diverged (6 pip-audit ignores in the Makefile vs 2 in ci.yml). One
# registry makes that class of drift structurally impossible.
#
# SCHEMA (enforced by scripts/render_waivers.py)
#   id              required  CVE-YYYY-NNNNN | GHSA-xxxx-xxxx-xxxx | PYSEC-...
#   scope           required  third-party | first-party   (selects the file)
#   severity        required  HIGH | CRITICAL | MEDIUM
#   source          required  trivy | pip-audit
#   carriers        required  images/packages that carry the finding (>=1)
#   rationale       required  why not exploitable here + why no fix we can apply
#   created         required  YYYY-MM-DD  (start of the current waiver window)
#   expires         required  YYYY-MM-DD; must be <= created + max_window_days
#   owner           optional  defaults to policy.default_owner
#   reachability    optional  a short tag, e.g. internal-monitoring-only
#   fix_available   optional  bool, default true. If false, recheck_trigger is
#                             required — it forces the author to state the
#                             concrete upstream change that would obsolete this.
#   recheck_trigger optional  required when fix_available: false
# =============================================================================

version: 1

policy:
  max_window_days: 90
  default_owner: security-oncall

waivers:
