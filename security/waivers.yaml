  # ── kin-openapi family (added 2026-10-17, Phase 847a) ────────────────────
  # These appeared in the Trivy DB on 2026-10-16 and blocked every open PR.
  # Verified that NO grafana tag fixes them: 13.1.6 and 13.2.4 both bundle
  # kin-openapi v0.144.0 (grafana upstream has not bumped it). A waiver is
  # therefore the only option until grafana ships kin-openapi >= 0.149.0.
  - id: CVE-2026-100349
    scope: third-party
    severity: HIGH
    source: trivy
    carriers: ["grafana/grafana:13.2.4-ubuntu"]
    rationale: >-
      kin-openapi nil-pointer dereference in openapi3filter.ValidateResponse: an
      OpenAPI document declaring a response header with `content` instead of
      `schema` passes validation, but every response validation for that
      operation then dereferences the nil schema and panics. No grafana tag fixes
      it (13.1.6 and 13.2.4 both ship kin-openapi v0.144.0; fix is 0.146.0).
      Grafana runs on the internal monitoring network and never validates
      untrusted OpenAPI specifications, so the vulnerable path is unreachable.
    reachability: internal-monitoring-only
    fix_available: false
    recheck_trigger: "grafana ships kin-openapi >= 0.149.0"
    created: 2026-10-19
    expires: 2027-01-17

  - id: CVE-2026-100351
    scope: third-party
    severity: HIGH
    source: trivy
    carriers: ["grafana/grafana:13.2.4-ubuntu"]
    rationale: >-
      kin-openapi ValidationHandler security-requirement bypass via encoded-path
      operation confusion. No grafana tag fixes it (13.1.6 and 13.2.4 both ship
      kin-openapi v0.144.0; fix is 0.147.0). Grafana runs on the internal
      monitoring network and never validates untrusted OpenAPI specifications, so
      the ValidationHandler path is unreachable.
    reachability: internal-monitoring-only
    fix_available: false
    recheck_trigger: "grafana ships kin-openapi >= 0.149.0"
    created: 2026-10-17
    expires: 2027-01-15

  - id: CVE-2026-100352
    scope: third-party
    severity: HIGH
    source: trivy
    carriers: ["grafana/grafana:13.2.4-ubuntu"]
    rationale: >-
      kin-openapi YAML NaN/Inf values bypass built-in guards and panic via OAS 3.1.
      No grafana tag fixes it (13.2.4 still ships v0.144.0; fix is 0.148.0).
      Requires parsing untrusted OAS 3.1 documents, which Grafana on the internal
      monitoring network does not do.
    reachability: internal-monitoring-only
    fix_available: false
    recheck_trigger: "grafana ships kin-openapi >= 0.149.0"
    created: 2026-10-17
    expires: 2027-01-15

  - id: CVE-2026-100353
    scope: third-party
    severity: HIGH
    source: trivy
    carriers: ["grafana/grafana:13.2.4-ubuntu"]
    rationale: >-
      kin-openapi incomplete fix for GHSA-p6wj-qrr4-pgh5: nil-Items panic paths in
      openapi3filter. No grafana tag fixes it (fix is 0.149.0). Requires untrusted
      OpenAPI filter input, which is not reachable in our internal-only Grafana
      deployment.
    reachability: internal-monitoring-only
    fix_available: false
    recheck_trigger: "grafana ships kin-openapi >= 0.149.0"
    created: 2026-10-17
    expires: 2027-01-15

  - id: CVE-2026-100354
    scope: third-party
    severity: HIGH
    source: trivy
    carriers: ["grafana/grafana:13.2.4-ubuntu"]
    rationale: >-
      kin-openapi uncontrolled recursion on circular allOf/anyOf/oneOf schemas
      causes fatal process crash. No grafana tag fixes it (fix is 0.149.0).
      Requires attacker-supplied circular schemas; our Grafana never validates
      untrusted OpenAPI schemas.
    reachability: internal-monitoring-only
    fix_available: false
    recheck_trigger: "grafana ships kin-openapi >= 0.149.0"
    created: 2026-10-17
    expires: 2027-01-15

