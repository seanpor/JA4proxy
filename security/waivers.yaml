  - id: CVE-2026-103111
    scope: third-party
    severity: HIGH
    source: trivy
    carriers: ["haproxy:2.8.28-alpine", "tecnativa/docker-socket-proxy:v0.5.0"]
    rationale: >-
      pcre2 vulnerability in Alpine 3.19/3.24; pinned upstream official images we
      cannot rebuild until publishers ship new tags. The socket proxy only
      communicates over a local Unix socket and never parses untrusted regex;
      haproxy uses pcre2 only for its own static config patterns.
    reachability: input-path-unreachable
    reachability_evidence: >-
      pcre2 is never reached with untrusted input. The socket proxy never
      parses a regex from any source; haproxy compiles only the patterns
      written into config/haproxy.cfg, which is a bind-mounted static file
      and not attacker-reachable. haproxy is published on 443/80, so the
      exposure of this carrier is network-wide — the premise that holds is
      the input path, not the network path.
    fix_available: false
    recheck_trigger: "the carrier images ship a rebuilt Alpine base with patched pcre2"
    created: 2026-10-07
    expires: 2027-01-05

