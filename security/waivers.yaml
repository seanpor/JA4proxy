  # can no longer diverge.
  - id: CVE-2026-59951
    scope: third-party
    severity: HIGH
    source: pip-audit
    carriers: ["mcp"]
    rationale: >-
      mcp 1.29.0. semgrep hard-pins mcp==1.29.0 and its latest release (1.182.1)
      still does, so raising the floor breaks semgrep's resolution. The CVE is
      unbounded session accumulation in MCP's StreamableHTTP SERVER transport;
      JA4proxy never runs an MCP server. mcp is pulled in only by semgrep (a CLI
      scanner) and is imported by no first-party module.
    reachability: not-imported
    fix_available: false
    recheck_trigger: "semgrep relaxes its mcp pin to allow >= 1.30.0"
    created: 2026-10-17
    expires: 2027-01-14

