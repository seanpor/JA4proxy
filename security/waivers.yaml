  # ── musl (CVE-2026-107891) in Alpine base images ─────────────────────────
  - id: CVE-2026-107891
    scope: third-party
    severity: HIGH
    source: trivy
    carriers: ["redis:7.4.11-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7", "tecnativa/docker-socket-proxy:v0.5.0"]
    rationale: >-
      musl libc vulnerability in Alpine base packages (fixed in 1.2.5-r12 / 1.2.6-r3).
      The carriers run pinned Alpine images. Redis runs strictly on internal docker
      networks (ja4proxy-data) with no published host ports; docker-socket-proxy only
      communicates over local /var/run/docker.sock with no published network ports.
      HAProxy terminates TLS and performs L4 TCP proxying without parsing untrusted
      input into musl-vulnerable libc subsystems. Upstream publishers must rebuild
      against updated Alpine base images.
    reachability: input-path-unreachable
    reachability_evidence: >-
      musl libc memory safety bugs in dynamic linking/internal allocator paths are
      unreachable from untrusted TCP payloads processed by HAProxy's event loop,
      and Redis/docker-socket-proxy have no exposed network ingress.
    fix_available: false
    recheck_trigger: "upstream official images rebuild on patched Alpine base"
    created: 2026-11-07
    expires: 2027-02-05

