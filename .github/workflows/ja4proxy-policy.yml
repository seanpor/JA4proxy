---
# JA4proxy Policy-as-Code — GitHub Actions workflow
#
# Triggered on any push or pull request that modifies a ja4proxy-policy.yaml
# file anywhere in the repository.
#
# Jobs:
#   validate  — offline schema + TTL + dial-increase check (all branches)
#   apply     — apply to production (main branch only, after validate)
#
# Required repository configuration:
#   vars.JA4PROXY_URL             — Management API base URL
#   secrets.JA4PROXY_OPERATOR_TOKEN — API bearer token with operator role
#
# Phase 83 migration note:
#   When the compiled Go CLI binary ships, replace:
#     python scripts/ja4proxy-policy.py ...
#   with:
#     ja4proxy-cli policy ...
#   No other changes to this file are required.

name: JA4proxy Policy

# Minimum scope: this workflow only reads source and calls the Management API
# over the network (via a secret token, not GITHUB_TOKEN). Phase 61 added the
# explicit permissions block.
permissions:
  contents: read

on:
  push:
    paths:
      - '**/ja4proxy-policy.yaml'
  pull_request:
    paths:
      - '**/ja4proxy-policy.yaml'

jobs:
  validate:
    name: Validate policy YAML
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install validation dependencies
        run: pip install pyyaml cerberus

      - name: Validate policy YAML
        run: python scripts/ja4proxy-policy.py validate --file ja4proxy-policy.yaml

  apply:
    name: Apply policy to production
    needs: validate
    # Only run on pushes to main (not on pull requests)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install apply dependencies
        run: pip install pyyaml cerberus aiohttp

      - name: Apply policy
        # JA4PROXY-2026-0018 — pass the operator token via env, not on
        # the command line. ja4proxy-policy.py reads JA4PROXY_TOKEN from
        # the environment when --token is absent. Putting it on the
        # command line leaks the secret into /proc/<pid>/cmdline and
        # into any GitHub Actions log that echoes the `run:` block
        # (e.g. `set -x` or a failed step summary).
        env:
          JA4PROXY_TOKEN: ${{ secrets.JA4PROXY_OPERATOR_TOKEN }}
        run: |
          python scripts/ja4proxy-policy.py apply \
            --file ja4proxy-policy.yaml \
            --url "${{ vars.JA4PROXY_URL }}"
