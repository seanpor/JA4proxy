---
# Phase 824f — Customer journeys CI tiering.
#
# Runs customer journey checks (T2) against a live stack.
# Scheduled nightly and triggers manually on demand via workflow_dispatch.
# Marked with continue-on-error so environment flakiness or transient runner
# timing jitter does not block merges or produce false positive alerts.
#
# All third-party actions are SHA-pinned; see .github/workflows/ci.yml's
# header comment for the pinning procedure.

name: Customer Journeys

on:
  schedule:
    - cron: "23 4 * * *"  # 04:23 UTC daily — off-peak
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journeys-t2:
    name: Customer journeys (Tier 2)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Build ja4p CLI
        run: make cli-build

      - name: Start PoC stack
        run: ./scripts/start-poc.sh

      - name: Run Tier 2 Customer Journeys
        run: make test-journeys TIER=2

      - name: Tear down stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -f deploy/docker/docker-compose.poc.yml --env-file .env down -v --remove-orphans || true
          fi
