---
# Phase 812 (812-B) — proactive .trivyignore re-affirmation; reworked in 847d.
#
# .trivyignore exceptions used to be renewed reactively, whenever someone
# happened to touch the file, so they clustered on one calendar day and caused a
# same-day cliff: Security Scan went red on main AND on every open PR
# simultaneously, for reasons unrelated to any of those PRs' actual diffs
# (observed directly: 42 entries expired on the same day the 812 investigation
# started).
#
# Phase 812 ran this DAILY and bumped anything expiring within 5 days to
# today+7d. Phase 847d REMOVED the bump. The date moved but the *premise* was
# never re-checked, so an entry that had been fixable for months could be
# renewed indefinitely — the "auto-renewed expiry" the 847 CVE-zero programme
# exists to eliminate. This workflow now classifies each expiring entry:
#
#   DEAD       no longer carried by any deployed image -> the waiver is DELETED
#              (a stale waiver is a standing exemption nobody is watching)
#   FIXABLE    a newer upstream tag clears it -> dates UNTOUCHED; the fix is
#              proposed as a reviewable branch by the fix-forward bot
#   ESCALATE   otherwise -> dates UNTOUCHED, next step printed for a human
#
# It still does NOT silently decide on a human's behalf, and never auto-merges.
# The branch it pushes carries only DEAD deletions (removals); re-affirming a
# live waiver stays a human edit that records WHY.
#
# WHY DAILY: Trivy suppresses a finding only while `today < exp`. Running daily
# keeps the Phase 226 window cap while leaving slack before any lapse.
#   The 7-day maximum window is Phase 226 security policy and is NOT changed
#   here; running daily keeps that cap while giving the re-affirmation 5 days
#   of slack to land, so a lapse needs 5 consecutive failures rather than one.
#
# Third-party actions are SHA-pinned per the convention in
# .github/workflows/release-cli.yml.

name: Trivyignore Re-affirmation

on:
  schedule:
    - cron: '0 5 * * *'  # 05:00 UTC daily — see "WHY DAILY" above
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without opening a PR"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reaffirm:
    name: Re-affirm soon-to-expire .trivyignore exceptions
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: List what's expiring soon (dry-run preview, always runs)
        run: python3 scripts/scan_exceptions.py --within-days 5 || true

      # ── phase-829a: MEASURE, don't just re-date ──────────────────────────
      #
      # On 2026-08-19 `make scan-images` was FAILING on grafana/alloy:v1.18.1
      # with two unwaived HIGHs. Nobody had changed that image -- the CVEs
      # entered the vulnerability database after the previous day's renewal
      # review, and the ignorefile went stale underneath a deployment that had
      # not moved. Nothing detected it, because every step above this one only
      # re-dates entries that are ALREADY WRITTEN DOWN. A date-only renewal
      # structurally cannot see a CVE that did not exist last week.
      #
      # This scans every deployed third-party image with NO ignorefile and
      # diffs measured findings against waived ones in both directions.
      - name: Scan deployed images (no ignorefile) and diff against the waivers
        id: drift
        continue-on-error: true          # report in the PR body; see the gate below
        run: |
          set -uo pipefail
          mkdir -p /tmp/trivy-scans
          images="$(python3 scripts/check_image_versions.py --list-third-party)"
          for img in $images; do
            slug="$(printf '%s' "$img" | tr '/:@' '___')"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp/trivy-cache:/root/.cache/trivy \
              aquasec/trivy:0.71.0 image \
                --severity HIGH,CRITICAL --scanners vuln \
                --format json --quiet --timeout 10m \
                "$img" > "/tmp/trivy-scans/${slug}.json" || \
              echo "::warning::scan failed for $img"
          done
          python3 scripts/check_trivyignore_drift.py \
            --scan-dir /tmp/trivy-scans | tee drift_report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

          # phase-829b: regenerate the machine-checkable half of each
          # justification from the same scan data. 18 of 56 entries had claimed
          # to cover images deleted from the deployment, which defeats the point
          # of a JUSTIFIED exception. Only the carrier claim is generated; the
          # "why not exploitable here" reasoning is a human judgement about our
          # deployment and is never machine-written.
          python3 scripts/refresh_trivyignore_justifications.py \
            --scan-dir /tmp/trivy-scans || true

      # Phase 847d: this no longer renews. It CLASSIFIES each expiring entry —
      # DEAD (delete), FIXABLE (propose the bump; dates untouched) or ESCALATE
      # (dates untouched, with the next step printed). Exit 1 means "something
      # needs a human" and is expected, not a failure, hence `|| true`; the
      # branch-vs-no-branch decision below is driven by `git diff`, not the code.
      #
      # `--scan-dir /tmp/trivy-scans` is what makes DEAD trustworthy: the drift
      # step above scanned EVERY third-party image, so an entry whose declared
      # carriers are all present there and yet carry nothing is genuinely gone.
      # Without the scan dir, every entry escalates — a missing report is not
      # evidence of absence.
      - name: Re-affirm entries expiring within 5 days
        id: reaffirm
        run: |
          python3 scripts/renew_trivyignore.py \
            --within-days 5 --scan-dir /tmp/trivy-scans | tee renewal_summary.txt || true
          if git diff --quiet security/waivers.yaml .trivyignore.first-party .trivyignore.third-party .pip-audit-ignores; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Phase 818 (#396): this step used to `gh pr create`, which fails with
      # exit 1 because this repo has "Allow GitHub Actions to create and approve
      # pull requests" DISABLED (a deliberate security default — it also gates
      # self-approval). Every renewal therefore pushed a branch, failed to open
      # the PR, filed a false-alarm issue, and left an orphan branch behind.
      #
      # Fix: push the branch (that always worked) and open an INFORMATIONAL
      # tracking issue carrying a one-click compare link that pre-fills the PR.
      # A human opens the PR — which preserves the "NO blanket ignores" human
      # review this workflow deliberately requires — and the job never fails on
      # a repo policy it cannot change. No repo-settings change, no self-approval
      # surface.
      - name: Push branch and request review if changed
        if: steps.reaffirm.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/trivyignore-reaffirm-$(date +%Y-%m-%d)"
          git checkout -b "$branch"
          # Phase 847a: security/waivers.yaml is the source of truth; the
          # .trivyignore.* / .pip-audit-ignores files are generated from it, so
          # the registry must travel with them in the same commit.
          git add security/waivers.yaml .trivyignore.first-party .trivyignore.third-party .pip-audit-ignores
          git commit -m "chore: re-affirm soon-to-expire .trivyignore exceptions ($(date +%Y-%m-%d))"

          # Rebase onto the CURRENT tip before pushing. The checkout above is of
          # main as it stood when the job started; anything merged since would
          # leave this branch behind, and a branch that is behind cannot
          # auto-merge and shows as BEHIND/DIRTY needing manual intervention.
          #
          # NOTE ON A CLAIM THAT WAS MADE AND IS WRONG: a stale branch does NOT
          # "revert" work merged after it. Git merges the branch's changes
          # relative to the merge base, not a snapshot — verified by simulating
          # the merge. The symptom that looked like a revert was `git diff main
          # branch` (two-dot), which renders main's own progress as deletions.
          # `git diff main...branch` (three-dot) is what a PR shows, and it
          # showed only the ignorefile lines. So this rebase is about keeping
          # the branch mergeable, not about preventing data loss.
          #
          # It cannot prevent a conflict that arises AFTER the push (if a later
          # PR edits the same ignorefile, this branch still needs a rebase or a
          # regeneration) — it only closes the window between checkout and push.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::warning::re-affirmation branch conflicts with current main; " \
                 "regenerate it on the current tip instead of merging this one"
          fi

          # --force-with-lease: a prior same-day run may have left this branch.
          git push --force-with-lease -u origin "$branch"

          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          {
            echo "The daily .trivyignore re-affirmation pushed branch \`${branch}\`."
            echo ""
            echo "**Open the PR here (one click, pre-filled):** ${compare_url}"
            echo ""
            echo "Since Phase 847d this is NOT a renewal: an expiring waiver is"
            echo "**deleted** if no scan sees its CVE any more, and otherwise left"
            echo "**untouched** and escalated. No window is ever extended."
            echo ""
            echo "A human must still decide what to do with the escalated entries"
            echo "listed below — re-affirm, fix, or remove. See"
            echo "docs/runbooks/security_scan_exceptions.md."
            echo ""
            echo '```'
            cat renewal_summary.txt
            echo '```'
            echo ""
            # phase-829a: the measured state, so the reviewer is not asked to
            # take a date-only rewrite on trust. GAPS break `make scan-images`
            # and are the failure mode that went undetected on 2026-08-19; DEAD
            # entries are the only ones that ever shrink this file.
            if [ -s drift_report.txt ]; then
              echo "### Measured against the deployed images (no ignorefile)"
              echo ""
              echo '```'
              cat drift_report.txt
              echo '```'
            else
              echo "> ⚠ The image scan step produced no report — the measured"
              echo "> check did NOT run, so every entry was escalated rather than"
              echo "> classified. Do not merge on this branch's word alone."
            fi
          } > issue_body.txt

          # Reuse a single rolling tracking issue rather than opening a new one
          # each week. Never fails the job — a notifier must not be a blocker.
          existing=$(gh issue list --label trivyignore-renewal --state open \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          title="Action needed: open the daily .trivyignore re-affirmation PR ($(date +%Y-%m-%d))"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body-file issue_body.txt || true
            gh issue comment "$existing" --body "Branch \`${branch}\` refreshed — ${compare_url}" || true
          else
            gh issue create --title "$title" --label trivyignore-renewal \
              --body-file issue_body.txt || true
          fi

      # Phase 812: a broken renewal workflow must not become a fifth silent
      # failure mode alongside the four this phase set out to fix. Same
      # tracking-issue pattern as ci.yml's notify-scheduled-failure, since
      # this workflow can't share that job directly (separate workflow file).
      - name: Open or update a tracking issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled .trivyignore re-affirmation workflow (daily 05:00 UTC) failed.',
              '',
              `Run: ${runUrl}`,
              '',
              'This does not itself mean Security Scan is broken -- check',
              '`scripts/scan_exceptions.py` separately -- but it does mean the',
              'proactive re-affirmation safety net (Phase 812, 812-B; reworked in',
              '847d) is not running, so an expiring waiver will not be classified',
              'as dead, fixable, or escalated before it lapses.',
              'Common causes: a script bug in scripts/renew_trivyignore.py, or',
              'Docker Hub/GCR rate limiting an upstream tag check done manually',
              'during PR review.',
            ].join('\n');
            const label = 'scheduled-ci-failure';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Still failing as of this run.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Trivyignore Re-affirmation workflow failed',
                body,
                labels: [label],
              });
            }
