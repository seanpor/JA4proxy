---
# Phase 106 — Monthly engineering-process metrics regeneration (5.2).
#
# Runs scripts/process_metrics.py on the 1st of each month at 06:00 UTC.
# If docs/engineering-method/retrospectives/latest-metrics.md changes, the
# regenerated file is committed back to main by github-actions[bot].
# Manual trigger via workflow_dispatch is supported for testing.
#
# Third-party actions are SHA-pinned per the convention in
# .github/workflows/release-cli.yml.

name: Process Metrics

on:
  schedule:
    - cron: '0 6 1 * *'  # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-metrics:
    permissions:
      contents: write
      pull-requests: write
    name: Regenerate process metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      - name: Install Python deps
        run: pip install pyyaml requests

      - name: Regenerate metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/process_metrics.py

      # main is branch-protected (12 required status checks, no direct push
      # even for admins/bots) -- a direct `git push` here always fails with
      # GH006. Open a PR and let it auto-merge once checks pass instead.
      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/engineering-method/retrospectives/latest-metrics.md; then
            echo "No changes"
            exit 0
          fi
          branch="chore/process-metrics-$(date +%Y-%m)"
          git checkout -b "$branch"
          git add docs/engineering-method/retrospectives/latest-metrics.md
          git commit -m "chore: regenerate process metrics ($(date +%Y-%m))"
          git push -u origin "$branch"
          gh pr create --title "chore: regenerate process metrics ($(date +%Y-%m))" \
            --body "Automated monthly regeneration of docs/engineering-method/retrospectives/latest-metrics.md via scripts/process_metrics.py." \
            --base main --head "$branch"
          gh pr merge --auto --squash --delete-branch "$branch"
