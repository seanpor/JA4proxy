name: Go Proxy Image

# Build, scan, SBOM, sign, and push the Go proxy container image.
# See docs/decisions/ADR-202d.md for the signing backend decision (keyless cosign).
# All `uses:` references are SHA-pinned per docs/phases/complete/PHASE_202.md sub-phase 202a.

on:
  push:
    paths:
      - 'deploy/docker/Dockerfile.go-proxy'
      - 'cmd/ja4pd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
    tags:
      - 'v*-go-proxy'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ja4proxy-go

jobs:

  test:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test
        run: go test -race ./...

  build-scan-sign-push:
    name: Build, scan, SBOM, sign, push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # GHCR push
      id-token: write      # keyless cosign OIDC (ADR-202d)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag

      # Build locally first so we can scan before pushing.
      - name: Build image (local)
        id: build_local
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile.go-proxy
          push: false
          load: true
          tags: ja4proxy-go:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ja4proxy-go:ci
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ja4proxy-go:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false

      # Push the image now that it has passed scan. Capture the digest so
      # cosign signs the exact content that was pushed.
      - name: Push image to GHCR
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile.go-proxy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image (keyless, Fulcio OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Sign every produced tag, identified by the pushed digest.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Signing ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Attach SBOM to image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Attaching SBOM to ${tag}@${DIGEST}"
            cosign attach sbom --sbom sbom.cdx.json --type cyclonedx "${tag}@${DIGEST}"
          done <<< "$TAGS"
