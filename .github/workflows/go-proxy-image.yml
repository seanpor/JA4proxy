name: Go Proxy Image

# Build, scan, SBOM, sign, and push the Go proxy container image.
# See docs/decisions/ADR-202d.md for the signing backend decision (keyless cosign).
# All `uses:` references are SHA-pinned per docs/phases/PHASE_202.md sub-phase 202a.

on:
  push:
    paths:
      - 'deploy/docker/Dockerfile.go-proxy'
      - 'cmd/proxy/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
    tags:
      - 'v*-go-proxy'
  workflow_dispatch:

permissions:
  contents: read
  packages: write      # GHCR push
  id-token: write      # keyless cosign OIDC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ja4proxy-go

jobs:

  test:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test
        run: go test -race ./...

  build-scan-sign-push:
    name: Build, scan, SBOM, sign, push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag

      # Build locally first so we can scan before pushing.
      - name: Build image (local)
        id: build_local
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: deploy/docker/Dockerfile.go-proxy
          push: false
          load: true
          tags: ja4proxy-go:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (CRITICAL only)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0  # v0.29.0
        with:
          image-ref: ja4proxy-go:ci
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@55dc4ee22412511ee8c3142cbea40418e6cec693  # v0.17.8
        with:
          image: ja4proxy-go:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false

      # Push the image now that it has passed scan. Capture the digest so
      # cosign signs the exact content that was pushed.
      - name: Push image to GHCR
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: deploy/docker/Dockerfile.go-proxy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da  # v3.7.0

      - name: Sign image (keyless, Fulcio OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Sign every produced tag, identified by the pushed digest.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Signing ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Attach SBOM to image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Attaching SBOM to ${tag}@${DIGEST}"
            cosign attach sbom --sbom sbom.cdx.json --type cyclonedx "${tag}@${DIGEST}"
          done <<< "$TAGS"
