---
# Phase 61 — CI test pipeline + supply-chain hygiene.
#
# Three fast-feedback jobs (test-go, test-python, lint) run on every PR and
# every push to main. Five security jobs (secrets-scan, sast,
# dependency-audit-python, dependency-audit-go, dependency-review) run on the
# same triggers AND weekly on Monday 06:00 UTC so newly-disclosed CVEs that
# affect already-merged dependencies are caught.
#
# All third-party actions are SHA-pinned. The canonical template for pin format
# is .github/workflows/release-cli.yml. If you add a new action:
#
#     git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>
#
# and copy the 40-char SHA, leaving the tag as a trailing comment. The test
# tests/test_workflow_pinning.py enforces this.

name: CI

on:
  pull_request:
    branches: [main, 'claude/**', 'phase-*']
  push:
    branches: [main]
  # Phase 332: the GitHub merge queue dispatches `merge_group` events. Every
  # REQUIRED status check must report on this event or the queue stalls forever.
  # merge_group is currently dormant (no merge queue — personal-account-owned
  # repos can't enable one, see docs/phases/complete/PHASE_332.md) so this never fires in
  # practice today. `smoke-docker` stays non-required/skipped-on-merge_group
  # (continue-on-error). Full Lint and Security Scan were a time-boxed Phase 332
  # trial as non-required (2026-06-15 to 2026-06-29); the trial expired without
  # a lint/scan regression reaching main, so both were restored to required on
  # 2026-07-01. Phase 847c then moved the *required* CVE gate to `scan-regression`
  # (diff-scoped, see its comment) and made `scan` conditional — so `scan` is now
  # guarded like `smoke-docker` rather than running unguarded on every PR.
  merge_group:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC — weekly CVE sweep
  # Phase 800: without this, a scheduled-run failure could only be reproduced by
  # waiting up to a week for the next Monday. Issue #405 sat open precisely
  # because its secrets-scan failure could not be re-triggered on demand.
  workflow_dispatch:

# Default token scope is intentionally minimal. Jobs that need more (e.g.
# security-events: write for SARIF upload) override at the job level.
permissions:
  contents: read

jobs:

  meta:
    name: Meta-Validation (Doctor + Meta-Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: make doctor
        run: make doctor
      - name: make lint-meta
        run: make lint-meta
      # Phase 814a: the findings register had integrity rules that nothing
      # enforced — `make verify-findings` existed as a Makefile target but no
      # workflow ran it, so "regression_test required once status >= FIXED",
      # referential integrity, and the SLA-date arithmetic were only checked
      # when somebody remembered. An integrity gate nobody runs is not a gate.
      #
      # `verify-findings` runs on the HOST python (`$(PYTHON)`), not in the
      # tools container like `lint-meta` does, and this job installs no
      # dependencies — so it needs PyYAML explicitly. (Found the honest way:
      # the first version of this step went red on exactly this.)
      - name: Install verify-findings dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: make verify-findings
        run: make verify-findings
      # Phase 332: TODO.md / PROJECT_STATUS.md are generated build artifacts, not
      # committed. Regenerate them here (this also gates that manifest.yaml
      # generates cleanly — sync-roadmap.py exits non-zero on a malformed
      # manifest) and publish them as a downloadable artifact so they remain
      # accessible even though they no longer live in the repo tree.
      - name: Generate roadmap docs (TODO.md / PROJECT_STATUS.md)
        run: |
          pip install pyyaml
          python scripts/sync-roadmap.py
      # Phase 815: Generated reference docs drift gate
      - name: Verify reference docs in sync (Phase 815)
        run: python3 scripts/sync_reference_docs.py --check
      - name: Publish roadmap docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: roadmap-docs
          path: |
            docs/phases/TODO.md
            docs/reference/PROJECT_STATUS.md
          if-no-files-found: error

  lint:
    name: Full Lint (make lint)
    # Required check (restored 2026-07-01 — see the merge_group comment above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          # pip-audit is required by `make lint` (lint-static's CVE gate);
          # without it lint-static fails with exit 127 (command not found).
          # golangci-lint itself is NOT installed here — `make lint` runs it via
          # the pinned `golangci/golangci-lint` Docker image (see Makefile
          # lint-go-full), so a `go install` of the binary here would just be
          # unused dead weight (this step used to install v1.64.5 and nothing
          # ever invoked it — phase-514).
          pip install ruff mypy bandit pytest-cov pip-audit
      - name: make lint
        run: make lint

  build:
    name: Go Build + Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Build Go binaries
        run: make go-build cli-build
      - name: Validate compose env vars (no image build)
        # docker compose config interpolates the env file and exits non-zero if
        # any :?-required variable is missing — catches broken agents before merge.
        run: |
          cp template.env .env
          make compose-validate

  # phase-518: run the Go suite under the race detector on every PR. This is the
  # enforcement arm for the concurrency regression tests — the config hot-reload
  # snapshot (JA4PROXY-2026-0088), forward() config capture (0068), and worker
  # lifecycle (0090) tests only *detect* a regression under -race, and the
  # `Full Test` job does not pass -race. Kept as a separate job so a race
  # regression is attributable at a glance and does not slow the plain test run.
  race:
    name: Go race tests (make test-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Go tests under race detector
        # -race requires cgo; ubuntu runners ship a C toolchain (CGO_ENABLED=1
        # is the default on linux/amd64).
        run: make test-race

  # Phase 847c: does this PR move the *waiver set*? That is an input to the
  # verdict for every surface, so it is the one case where the full scan must
  # still run on a PR (see the `scan` job's condition). Plumbing job, not a gate
  # in its own right — continue-on-error keeps it out of the required-check set.
  scan-scope:
    name: Detect waiver-set changes
    continue-on-error: true
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    outputs:
      waivers: ${{ steps.filter.outputs.waivers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch origin/main (the revision the waiver set is compared against)
        run: git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
      # PyYAML, explicitly: `scripts/check_image_versions.py` (imported by the
      # gate) imports it at module level and exits 2 without it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Python deps
        run: pip install pyyaml
      # The question is "did the waiver SET move?", not "did a waiver FILE
      # change?". A generated ignorefile carries a documentation header above
      # its entries; rewording that header waives nothing and un-waives
      # nothing, yet treating it as a waiver change put EVERY surface in
      # scope — which then failed on an upstream CVE disclosed overnight, on a
      # PR that had nothing to do with it. That is the failure the split
      # between the full scan and the regression gate exists to prevent.
      #
      # The comparison is the gate's own (`scripts/scan_regression.py
      # --waiver-set-changed`), so the trigger here and the trigger in the
      # gate can never drift apart.
      #
      # Exit codes: 0 = changed, 1 = unchanged, 2 = could not tell. "Could not
      # tell" is reported as "changed": the full scan is the safe answer, and
      # the alternative is a trigger that silently stops firing.
      - name: Did the waiver set change?
        id: filter
        run: |
          set +e
          python3 scripts/scan_regression.py --base origin/main --waiver-set-changed
          rc=$?
          set -e
          case "$rc" in
            0) echo "waivers=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "waivers=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::could not determine whether the waiver set changed (exit $rc) — assuming it did"
              echo "waivers=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  scan:
    name: Security Scan (make scan)
    needs: scan-scope
    # Phase 847c — de-required on the PR path. The full scan still runs on
    # push/schedule (so main keeps a complete record and the scheduled-failure
    # notifier still has something to report on), and on a PR only when the
    # waiver set moved, because a waiver change moves the gate's own inputs for
    # every surface. An unrelated PR is no longer reddened by an upstream CVE
    # disclosed overnight — `scan-regression` judges it against the baseline.
    #
    # The condition is `!= 'false'`, not `== 'true'`: if the detection job
    # cannot answer — it failed, it was skipped, its output was never set —
    # the full scan RUNS. A trigger that silently stops firing is the one
    # failure mode a safety trigger must not have.
    if: >
      always() &&
      (github.event_name != 'pull_request' ||
       needs.scan-scope.outputs.waivers != 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # JS dependency CVE scan (retire.js) for the vendored Management-UI front-end
      # libraries. Uses the runner's pre-installed Node (no setup-node action needed)
      # and runs early so a known-vulnerable JS lib fails fast before the image build.
      - name: JS dependency CVE scan (retire.js)
        run: make scan-js
      # Phase 227: persist the Trivy vulnerability DB across runs. Within a run
      # the shared cache mount (Makefile TRIVY_CACHE) already downloads it once;
      # this restores it across runs so the first scan doesn't re-fetch it.
      # Rolling key (run_id) + restore-keys = "save each run, restore latest".
      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-
      - name: Prepare .env for build
        run: cp template.env .env
      - name: Generate backend cert for build
        run: bash scripts/generate-backend-cert.sh
      - name: Build images for scan
        run: make build
      - name: make scan
        run: make scan

  # Phase 847c: the required PR gate. Scans ONLY the surfaces this PR touches
  # (compose-pinned images, Dockerfiles, dependency files) and fails only on
  # findings absent from security/baseline.json — which is the recording of what
  # main already carries. A PR touching nothing security-relevant therefore
  # passes without scanning anything, no matter what the vulnerability DB has
  # learned overnight, while a PR that bumps an image or a dependency still has
  # that surface scanned and still fails on a new unwaived finding.
  scan-regression:
    name: Scan Regression (surfaces touched)
    runs-on: ubuntu-latest
    steps:
      # Full history: the gate diffs against the merge-base with main and reads
      # the touched files *at that revision* (`git show <base>:<path>`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch origin/main (the gate's baseline revision)
        run: git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
      # Phase 227's DB cache, same rolling key: the first scan of a run does not
      # re-download the vulnerability DB.
      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-
      # Decide BEFORE building anything. Most PRs touch no security-relevant
      # surface, and their cost should be seconds, not an image build.
      - name: Which surfaces does this PR touch?
        id: plan
        run: |
          make scan-regression-plan > plan.json
          cat plan.json
          echo "surfaces=$(python3 -c "import json; print(' '.join(json.load(open('plan.json'))['surfaces']))")" >> "$GITHUB_OUTPUT"
      # The dependency surface is audited by pip-audit *inside the pinned tools
      # image* (`lint-static`'s pattern), not by a host install — a runner has no
      # pip-audit, and an unpinned one would drift from the container's. Same
      # rationale as the image build below: pay for it only when it is in scope.
      - name: Build the tools image (dependency surface in scope)
        if: contains(steps.plan.outputs.surfaces, 'pypi')
        run: make tools-image
      - name: Prepare .env for build
        if: contains(steps.plan.outputs.surfaces, 'image:ja4proxy')
        run: cp template.env .env
      - name: Generate backend cert for build
        if: contains(steps.plan.outputs.surfaces, 'image:ja4proxy')
        run: bash scripts/generate-backend-cert.sh
      # Only when a first-party surface is in scope. `make build-first-party-images`
      # also builds the profile-gated test/trafficgen/tap images that `make build`
      # skips — without them the gate would fail closed on an image CI never built.
      - name: Build first-party images (in scope only)
        if: contains(steps.plan.outputs.surfaces, 'image:ja4proxy')
        run: make build-first-party-images
      - name: Regression gate
        run: make scan-regression

  test:
    name: Full Test Suite (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.2"
      # Python tests run inside the pinned 3.14 tools image (built by the
      # `tools-image` prereq of `make test`); Go tests run natively. No host
      # Python setup is required.
      - name: make test
        run: make test
      - name: Go Coverage Summary
        run: |
          echo "### Go Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|" >> $GITHUB_STEP_SUMMARY
          # Re-run cover tool against the txt generated by make test
          go tool cover -func=coverage.txt | awk '{print "| " $1 " | " $3 " |"}' >> $GITHUB_STEP_SUMMARY
  secrets-scan:
    name: Secrets scan (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history required for TruffleHog to diff commits on PRs.
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85  # v3.97.9
        with:
          path: ./
          # phase-61 review-fix #2 (B3): on a `push` to main, base=default_branch
          # and head=HEAD resolve to the same commit, producing an empty diff —
          # TruffleHog scans nothing and the job silently passes. Branch by
          # event type so PRs diff against the PR base and pushes diff against
          # the previous tip (`github.event.before`).
          #
          # Phase 800 correction: the original comment claimed schedule "falls
          # through to a full HEAD scan". It does not. `github.event.before` is
          # only populated for `push`, so on `schedule` (and `workflow_dispatch`)
          # base resolved to the empty string while head was set — an
          # unintended, undocumented scan scope rather than the deliberate full
          # scan the comment described. Both are now set explicitly to '' so the
          # full-history scan is what the config actually says it is.
          base: ${{ github.event_name == 'schedule' && '' || github.event_name == 'workflow_dispatch' && '' || github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'schedule' && '' || github.event_name == 'workflow_dispatch' && '' || github.event.pull_request.head.sha || github.sha }}
          # --exclude-detectors=Lob (phase-800, issue #405): Lob API *test* keys
          # begin with "test_", so TruffleHog's Lob detector matches every pytest
          # function name in the repo — and its verifier reports them as
          # VERIFIED. Measured on tests/unit alone: 2670 verified "secrets",
          # zero real. That is what exited 183 and failed every scheduled run;
          # GitHub caps annotations at ~10, which hid the scale.
          #
          # Safe to exclude: this project has no Lob integration whatsoever
          # (no lob.com, no LOB_KEY, no client library — verified by grep).
          # Remove this exclusion if a Lob dependency is ever introduced.
          extra_args: --only-verified --exclude-detectors=Lob

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Semgrep scan
        run: |
          pip install semgrep==1.76.0
          semgrep --config p/ci --config p/security-audit --config p/secrets --error .

  dependency-audit-python:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: pip-audit
        run: |
          # phase-61 review-fix #2 (B2): pin pip-audit. An audit tool whose
          # version drifts is itself a supply-chain risk.
          pip install pip-audit==2.10.0
          # --strict makes any parse error fail; default severity gate only
          # flags HIGH/CRITICAL via the exit code when used without --ignore-vuln.
          # phase-311: wrapped so a transient PyPI/OSV outage retries + soft-passes
          # (warning) instead of reddening the gate; a real vuln still fails.
          # phase-847a: the ignore list is now GENERATED from security/waivers.yaml
          # by scripts/render_waivers.py, so this job and the Makefile lint-static
          # gate cannot drift apart (they had: 2 entries here vs 6 in the Makefile).
          # Each entry's justification and removal condition live in the registry.
          bash scripts/pip-audit-resilient.sh -r requirements.txt --strict \
            $(grep -v '^[[:space:]]*#' .pip-audit-ignores)

  dependency-audit-go:
    name: Go dependency audit (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.2"
      - name: govulncheck
        run: |
          # phase-61 review-fix #2 (B2): pin govulncheck. @latest defeats the
          # whole point of the SHA-pinning policy for actions — a CVE-scanner
          # binary that auto-upgrades on every CI run is itself unverified
          # third-party code.
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  dependency-review:
    name: Dependency review (PR gate)
    # dependency-review-action only operates on pull_request events.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true  # Requires GHAS on private repos; don't block CI if unavailable
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        continue-on-error: true  # The action hard-errors when GitHub Dependency Graph is not enabled on the repo. Job-level continue-on-error already prevents PR-block; this also keeps the step display green.
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0

  # Phase 106 — Traceability matrix check (5.1).
  # Runs scripts/traceability.py --check on every PR and push to main.
  # Non-blocking until 2026-05-08 (14-day grace period); after the cutoff the
  # step exits non-zero and fails the build. The date gate lives inside the
  # step itself because GitHub Actions does not support event-timestamp
  # expressions in `continue-on-error` cleanly.
  traceability:
    name: Traceability matrix check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Python deps
        run: pip install pyyaml
      - name: Check traceability matrix
        run: |
          if python scripts/traceability.py --check; then
            echo "Traceability check passed"
          else
            CUTOFF="2026-05-08T00:00:00Z"
            NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if [[ "$NOW" < "$CUTOFF" ]]; then
              echo "::warning::Traceability check failed but is non-blocking until $CUTOFF"
              exit 0
            else
              echo "::error::Traceability check failed (now blocking after $CUTOFF)"
              exit 1
            fi
          fi

  # Phase 800: the weekly scheduled run (line 36) is the trip-wire for CVEs
  # newly disclosed against already-merged dependencies — but a scheduled
  # workflow failure doesn't page anyone by default, and nothing else in this
  # repo watches it. Observed cost: it failed silently for two consecutive
  # Mondays (2026-07-13, 2026-07-20) before anyone noticed. This job opens (or
  # comments on) a tracking issue when that happens, so "found by scheduled CI"
  # doesn't quietly become "found three weeks later by someone else."
  # continue-on-error keeps it OUT of the required-check set enforced by
  # test_branch_protection_contexts_match_ci_job_names — a notifier must never
  # itself block a merge.
  notify-scheduled-failure:
    name: Notify on scheduled-run failure
    continue-on-error: true
    if: always() && github.event_name == 'schedule'
    needs: [meta, lint, build, race, scan, test, secrets-scan, sast, dependency-audit-python, dependency-audit-go, traceability]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a tracking issue if any job failed
        if: contains(needs.*.result, 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = Object.entries(${{ toJson(needs) }})
              .filter(([, job]) => job.result === 'failure')
              .map(([id]) => id);
            const body = [
              'The weekly scheduled CI run (Monday 06:00 UTC) failed.',
              '',
              `Run: ${runUrl}`,
              `Failed jobs: ${failed.join(', ')}`,
              '',
              'Nothing in the repo changed to trigger this — it usually means a',
              'previously-passing gate (lint, scan, or a dependency audit) has',
              'regressed against a newly-published CVE or an upstream change.',
              'See docs/phases/PHASE_800.md and docs/phases/PHASE_800_notes.md for',
              'the last time this class of drift was triaged.',
            ].join('\n');
            const label = 'scheduled-ci-failure';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Still failing as of this run.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Scheduled CI run failed',
                body,
                labels: [label],
              });
            }

  # Phase 64a — Docker Compose lifecycle smoke test.
  # Non-blocking by default (continue-on-error). After a stability window the
  # team may set smoke_required: true in the repository variables to promote
  # this to a required check.
  smoke-docker:
    name: Smoke test (Docker Compose)
    # Phase 332: not a required check; skip it in the merge queue (runs on PRs).
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Smoke test
        run: |
          # docker-compose.yml (root quick-start) uses sensible defaults for
          # everything except REDIS_PASSWORD. BACKEND_HOST defaults to a dummy
          # value so the proxy starts in monitor mode without a real backend.
          [ -f .env ] || echo "REDIS_PASSWORD=smoketest" >> .env
          bash scripts/smoke/test_docker_compose.sh

  # Phase 812 (812-A): scripts/start-poc.sh + docker-compose.poc.yml is only
  # ever exercised end-to-end by nightly-benchmark.yml, on a schedule, after
  # the fact -- three sequential bootstrap bugs (missing .env vars, missing
  # deploy/secrets/redis_password.txt, AGENT_CPU_SET assuming 16 cores) and a
  # fourth, deeper Redis ACL auth bug (Phase 813) were each only discovered
  # overnight, one at a time. smoke-docker above doesn't catch any of them --
  # it's continue-on-error and tests a different file (root docker-compose.yml).
  # This is a REQUIRED check (not continue-on-error) covering the real path.
  poc-cold-start-changes:
    name: Detect PoC cold-start path changes
    # Plumbing job, not a gate in its own right -- continue-on-error keeps it
    # OUT of the required-check set (test_branch_protection_contexts_match_ci_job_names),
    # matching the same reasoning already documented for notify-scheduled-failure
    # below: a helper must never itself become a required, blockable check.
    continue-on-error: true
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'scripts/start-poc.sh'
              - 'scripts/lane-env.sh'
              - 'scripts/generate-backend-cert.sh'
              - 'deploy/docker/docker-compose.poc.yml'
              - 'deploy/docker/Dockerfile.*'
              - 'config/redis_acl.conf.template'
              - 'deploy/docker/redis-entrypoint.sh'

  poc-cold-start:
    name: Cold-start smoke test (start-poc.sh)
    needs: poc-cold-start-changes
    # Path-filtered per job (not a workflow-level `paths:` filter, which
    # would stop the whole workflow from triggering on unrelated PRs and
    # leave this required check permanently unreported -- see
    # tests/test_workflow_pinning.py's
    # test_branch_protection_contexts_match_ci_job_names). Always runs on
    # push/schedule (weekly sweep, and the merge to main itself) regardless
    # of the path filter, as a second line of defense.
    if: >
      github.event_name != 'merge_group' &&
      (needs.poc-cold-start-changes.outputs.relevant == 'true' ||
       github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Assert a clean checkout (no stale .env/secrets)
        run: |
          # A future change to actions/checkout's defaults (or a cache step
          # added later in this job) must not silently reintroduce the exact
          # state the three Phase-809 bugs were masked by. Fail loudly if
          # either already exists before start-poc.sh runs.
          #
          # deploy/secrets/ itself is expected to exist and be non-empty on
          # every checkout -- .gitkeep and README.md are tracked (this
          # actually broke the job's first-ever live run: `[ -d
          # deploy/secrets ]` alone is always true). Check for the *.txt
          # secret files start-poc.sh generates instead.
          if [ -f .env ] || ls deploy/secrets/*.txt >/dev/null 2>&1; then
            echo "::error::Expected a clean checkout with no .env or deploy/secrets/*.txt -- found one. This job exists to prove start-poc.sh bootstraps from nothing; pre-existing state would hide a regression."
            exit 1
          fi
      - name: Run start-poc.sh
        run: ./scripts/start-poc.sh
      - name: Verify the proxy's own /health reports Redis OK
        run: |
          set -a; source .env; set +a
          P_FLAG=""
          [ -n "${COMPOSE_PROJECT_NAME:-}" ] && P_FLAG="-p $COMPOSE_PROJECT_NAME"
          # start-poc.sh's own "Checking Proxy..." loop already proved /health
          # is reachable; this asserts its Redis-backed content specifically,
          # so a future regression that leaves the endpoint reachable but
          # Redis silently unauthenticated (Phase 813's exact failure mode)
          # still fails this job.
          health=$(docker compose $P_FLAG -f deploy/docker/docker-compose.poc.yml --env-file .env exec -T proxy curl -sf http://localhost:9090/health)
          echo "$health"
          echo "$health" | grep -q '"redis":"ok"'
      - name: Tear down
        if: always()
        run: |
          set -a; source .env 2>/dev/null; set +a
          P_FLAG=""
          [ -n "${COMPOSE_PROJECT_NAME:-}" ] && P_FLAG="-p $COMPOSE_PROJECT_NAME"
          docker compose $P_FLAG -f deploy/docker/docker-compose.poc.yml --env-file .env down -v --remove-orphans || true
