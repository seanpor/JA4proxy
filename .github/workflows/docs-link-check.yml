# Documentation link check (Phase 107w.3)
#
# Walks markdown docs in compliance / security / audience-scoped directories
# with `lychee` and fails the build on broken INTERNAL links (relative paths
# to non-existent files). External 4xx/5xx are tolerated (vendor sites flake).
#
# Trigger: pull_request on docs/** changes + workflow_dispatch.
# Promote to push:main after the workflow proves stable in PR runs.
# All `uses:` SHA-pinned per repo convention (see tests/test_workflow_pinning.py).

name: Docs link check

on:
  # Runs on EVERY pull request (no path filter): this check is a required status
  # check in branch protection, and a path-filtered required check would never
  # report on non-docs PRs, blocking them forever. The job is ~seconds, so the
  # cost of re-checking links on every PR is negligible.
  pull_request:
  # Phase 332: also report on merge_group events — as a REQUIRED check it must
  # post a result in the merge queue or the queue would stall forever.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: lychee on conformance + audience-scoped docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Run lychee
        # lychee-action v2.8.0 — SHA verified via
        # https://api.github.com/repos/lycheeverse/lychee-action/git/refs/tags/v2.8.0
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.8.0
        with:
          # Walk only the new conformance/audience-scoped tree to keep the
          # workflow fast and to avoid noise from pre-existing rot in older docs.
          # Promote scope to all of docs/ once the existing link landscape is clean.
          args: >-
            --no-progress
            --accept 200,204,301,302,403,429
            --max-concurrency 4
            --exclude SLSA_VERIFICATION
            --exclude https://eur-lex.europa.eu
            --exclude https://edpb.europa.eu
            'docs/compliance/**/*.md'
            'docs/for-architects/**/*.md'
            'docs/for-compliance/**/*.md'
            'docs/for-website-owners/**/*.md'
            'docs/security/CVD_POLICY.md'
            'docs/decisions/ADR-107*.md'
            'SECURITY.md'
          fail: true
