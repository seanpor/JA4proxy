name: Management Image

# Build and push the management API container image to GHCR.
#
# Triggers only when management service source actually changes — path filtering
# means PRs touching docs, Go code, or tests never trigger an image rebuild.
# Restricted to pushes to main (merges) and explicit version tags; feature
# branch pushes do not publish images.
#
# Published as: ghcr.io/seanpor/ja4proxy-management:main (always latest)
#               ghcr.io/seanpor/ja4proxy-management:sha-<commit>
#               ghcr.io/seanpor/ja4proxy-management:<tag> (on v* tags)
#
# Make the package public after first push:
#   GitHub → Packages → ja4proxy-management → Package settings → Change visibility → Public

on:
  push:
    branches: [main]
    paths:
      - 'management/**'
      - 'deploy/docker/Dockerfile.management'
      - 'management/requirements.txt'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ja4proxy-management

jobs:

  build-push:
    name: Build and push management image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile.management
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
