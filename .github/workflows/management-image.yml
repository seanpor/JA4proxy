name: Management Image

# Build and push the management API container image to GHCR.
#
# Triggers only when management service source actually changes — path filtering
# means PRs touching docs, Go code, or tests never trigger an image rebuild.
# Restricted to pushes to main (merges) and explicit version tags; feature
# branch pushes do not publish images.
#
# Published as: ghcr.io/seanpor/ja4proxy-management:main (always latest)
#               ghcr.io/seanpor/ja4proxy-management:sha-<commit>
#               ghcr.io/seanpor/ja4proxy-management:<tag> (on v* tags)
#
# Make the package public after first push:
#   GitHub → Packages → ja4proxy-management → Package settings → Change visibility → Public

on:
  push:
    branches: [main]
    paths:
      - 'management/**'
      - 'deploy/docker/Dockerfile.management'
      - 'management/requirements.txt'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ja4proxy-management

jobs:

  build-push:
    name: Build and push management image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile.management
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
