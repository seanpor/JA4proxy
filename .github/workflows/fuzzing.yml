---
# Phase 850 & Phase 851j — Continuous Automated Fuzzing.
#
# Runs Go native fuzz targets for parsers and security logic in parallel matrix jobs:
#   cmd/ja4pd, internal/tls, internal/quic, internal/webhook,
#   internal/config, internal/cache, internal/security, internal/redis.
# Scheduled daily off-peak and triggers manually on demand via workflow_dispatch.
#
# All third-party actions are SHA-pinned; see .github/workflows/ci.yml's
# header comment for the pinning procedure.

name: Continuous Fuzzing

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily — off-peak
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Duration to run each fuzz target (e.g., 30s, 1m, 5m)"
        required: false
        default: "30s"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: "cmd/ja4pd"
            targets: >-
              FuzzClientHello
              FuzzReadProxyProtocol
              FuzzReadProxyProtocolV2
              FuzzFragmentation
              FuzzProtocolSmuggling
          - pkg: "internal/tls"
            targets: >-
              FuzzParseClientHello
              FuzzDifferentialClientHello
          - pkg: "internal/quic"
            targets: >-
              FuzzParseClientHelloFeatures
              FuzzReadVarint
              FuzzParseCRYPTOFrames
              FuzzDecodeInitialHeader
          - pkg: "internal/webhook"
            targets: >-
              FuzzComputeHMAC
              FuzzWebhookEndpointRedaction
              FuzzIsPrivateIP
              FuzzWebhookEventDelivery
          - pkg: "internal/config"
            targets: >-
              FuzzLoadConfigYAML
              FuzzLoadYAML
              FuzzFlexInt
              FuzzExpandEnvVars
          - pkg: "internal/cache"
            targets: >-
              FuzzLRUOperations
              FuzzLRUKeyFormatting
          - pkg: "internal/security"
            targets: >-
              FuzzSNIAnalyzer
              FuzzBuildRanger
              FuzzEffectiveThresholdAndDecider
              FuzzRiskScorer
              FuzzPipelineBypassesAndHardBlocks
          - pkg: "internal/redis"
            targets: >-
              FuzzVerifyPubSubHMAC
              FuzzPubSubEnvelopeRoundtrip
              FuzzPubSubHandlerDispatch
          - pkg: "internal/tap"
            targets: >-
              FuzzPacketDecoder
              FuzzTCPReassembly
              FuzzParsePortList
              FuzzComputeJA4T
          - pkg: "internal/cli/engine"
            targets: >-
              FuzzCLIArgumentParsing
          - pkg: "internal/cli/output"
            targets: >-
              FuzzOutputFormatter

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Cache Fuzz Corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: go-fuzz-${{ runner.os }}-${{ matrix.pkg }}-${{ github.run_id }}
          restore-keys: |
            go-fuzz-${{ runner.os }}-${{ matrix.pkg }}-

      - name: Run Fuzz Targets (${{ matrix.pkg }})
        env:
          FUZZTIME: ${{ inputs.fuzztime || '30s' }}
        run: |
          for target in ${{ matrix.targets }}; do
            echo "=== Fuzzing $target in ./${{ matrix.pkg }} ($FUZZTIME) ==="
            go test -run='^$' -fuzz="^${target}$" -fuzztime="$FUZZTIME" "./${{ matrix.pkg }}/"
          done

      - name: Preserve Crasher Artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-crashers-${{ runner.os }}-${{ matrix.pkg }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
