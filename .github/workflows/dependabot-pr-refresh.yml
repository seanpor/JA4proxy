---
# Phase 812 (812-D) & Phase 830 — Automated cascading rebase and refresh for Dependabot PRs on main-branch changes.
#
# When a PR merges to main:
# 1. Open Dependabot PRs in state 'BEHIND' are cascade-rebased via GitHub API (one per push,
#    preventing thundering herds). Auto-merge squash-merges each upon green CI, which in
#    turn triggers this workflow for the next PR.
# 2. Conflicted PRs ('DIRTY') receive an @dependabot rebase comment.
# 3. Failing PRs are refreshed via close/reopen (at most ONCE per head SHA via dedup label).
#
# continue-on-error on the whole job: a notifier/nudger must never itself
# become a required, blockable check.

name: Dependabot PR Refresh

on:
  push:
    branches: [main]
  schedule:
    # Phase 832: Daily off-peak sweep at 03:00 UTC to rebase BEHIND Dependabot PRs
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be refreshed without acting"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh and rebase stale Dependabot PRs
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Process open Dependabot PRs (cascading rebase and stale refresh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --author "app/dependabot" --state open --json number,headRefOid,labels)
          echo "$prs" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" | \
            xargs -I{} echo "Found {} open Dependabot PR(s)"

          updated_one_branch=false

          echo "$prs" | python3 -c '
          import json, sys
          for pr in json.load(sys.stdin):
              print(pr["number"], pr["headRefOid"][:7], ",".join(l["name"] for l in pr["labels"]))
          ' | while read -r number head_sha labels; do
            echo "--- PR #$number (head $head_sha) ---"

            # Query mergeable_state from GitHub REST API (behind, clean, dirty, blocked, unknown)
            merge_state=$(gh api "repos/${{ github.repository }}/pulls/$number" --jq '.mergeable_state' 2>/dev/null || echo "unknown")

            # A required check still "pending" isn'\''t the same as "failing" --
            # don'\''t re-trigger PRs currently running CI
            conclusion=$(gh pr checks "$number" --json state -q '
              if any(.[] | .state == "FAILURE") then "failing"
              elif any(.[] | .state == "PENDING") then "pending"
              else "passing" end
            ' 2>/dev/null || echo "pending")
            if [ "$conclusion" = "pending" ]; then
              echo "SKIP still running (merge_state=$merge_state)"
              continue
            fi
            checks_passing="false"
            [ "$conclusion" = "passing" ] && checks_passing="true"

            decision=$(python3 scripts/dependabot_pr_refresh.py \
              --head-sha "$head_sha" --checks-passing "$checks_passing" --labels "$labels" --merge-state "$merge_state")
            echo "$decision (merge_state=$merge_state)"

            action=$(echo "$decision" | awk '{print $1}')

            if [ "$action" = "UPDATE_BRANCH" ]; then
              if [ "$updated_one_branch" = "true" ]; then
                echo "Deferring UPDATE_BRANCH on #$number (already triggered rebase on previous PR this run)"
                continue
              fi
              [ "$DRY_RUN" = "true" ] && { echo "(dry-run, not acting)"; continue; }
              remove_label=$(echo "$decision" | awk '{print $2}')
              [ "$remove_label" != "-" ] && gh pr edit "$number" --remove-label "$remove_label" >/dev/null 2>&1 || true

              echo "Triggering server-side branch update for PR #$number..."
              if gh api -X PUT "repos/${{ github.repository }}/pulls/$number/update-branch" >/dev/null 2>&1; then
                echo "Successfully requested update-branch for PR #$number"
                updated_one_branch=true
              else
                echo "Failed or rejected update-branch for PR #$number"
              fi

            elif [ "$action" = "CONFLICT_REBASE" ]; then
              [ "$DRY_RUN" = "true" ] && { echo "(dry-run, not acting)"; continue; }
              gh pr comment "$number" --body "@dependabot rebase" || true
              echo "Requested @dependabot rebase on conflicted PR #$number"

            elif [ "$action" = "REFRESH" ]; then
              [ "$DRY_RUN" = "true" ] && { echo "(dry-run, not acting)"; continue; }
              remove_label=$(echo "$decision" | awk '{print $2}')
              add_label=$(echo "$decision" | awk '{print $3}')

              gh label create "$add_label" --color BFD4F2 --force >/dev/null 2>&1 || true
              [ "$remove_label" != "-" ] && gh pr edit "$number" --remove-label "$remove_label" >/dev/null 2>&1 || true
              gh pr edit "$number" --add-label "$add_label"

              gh pr close "$number"
              gh pr reopen "$number"
              echo "Refreshed PR #$number"
            fi
          done
