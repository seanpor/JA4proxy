name: CVE baseline monitor

# Phase 847c. The scheduled half of the scan split.
#
# The PR gate (`scan-regression` in ci.yml) only judges what a PR touches, so it
# is deliberately blind to drift on surfaces nobody touched. This workflow is
# what watches those: a full scan of every image and dependency, diffed against
# `security/baseline.json`, filing one deduplicated issue per unwaived finding.
#
# It must never block a merge. It is not a required check and does not run on
# PRs at all — a monitor that can block becomes the friction Phase 847 removed.

on:
  schedule:
    # Daily, deliberately offset from the weekly CI sweep (Monday 06:00 UTC).
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "File issues (unset = dry run, report only)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  monitor:
    name: Baseline monitor (full scan + drift)
    runs-on: ubuntu-latest
    env:
      # `gh` reads GH_TOKEN; issues:write is scoped above.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Pinned Python for the scripts that run directly on the runner (the
      # monitor and the fix-forward bot). The version is pinned rather than
      # taken from the runner image, so the monitor does not change behaviour
      # when GitHub rotates the image.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      # PyYAML, explicitly. `setup-python` installs a CLEAN interpreter, so the
      # PyYAML the runner image happens to carry is not there any more — and
      # `scripts/check_image_versions.py` imports it at module level and exits
      # 2 without it, which would have taken the whole drift monitor down.
      # (ci.yml hit the identical trap and says so at its own install step.)
      - name: Install Python deps
        run: pip install pyyaml

      # Same rolling-key cache as ci.yml's scan job: the vulnerability DB is
      # downloaded once per run instead of once per image.
      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      # Phase 847d: the fix-forward bot rescans candidate upstream tags to prove
      # a bump clears a CVE. Those scans are the expensive part, so their results
      # are cached ACROSS runs, keyed on the ignorefile content (`cached_scanner`
      # in scripts/fix_forward.py). A CVE's status on a given image+ignorefile is
      # a slow-moving fact; the 7-day cap inside the script bounds staleness.
      - name: Cache fix-forward scan results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ja4proxy-fix-forward
          key: fix-forward-scans-${{ github.run_id }}
          restore-keys: |
            fix-forward-scans-

      - name: Prepare .env for build
        run: cp template.env .env
      - name: Generate backend cert for build
        run: bash scripts/generate-backend-cert.sh

      # The Python dependency surface is audited by pip-audit inside this image
      # (`make scan-baseline` uses the same one), so the results are the pinned
      # container's, not whatever a runner happens to have.
      - name: Build the tools image
        run: make tools-image

      # The first-party images are part of the monitored surface. This builds all
      # of them, including the profile-gated test/trafficgen/tap images that
      # `make build` skips — the monitor is the one place that must cover
      # everything, so it must not inherit that gap.
      - name: Build first-party images
        run: make build-first-party-images

      # `APPLY=1` on a schedule (the whole point); manual dispatches default to a
      # dry run so a human can see what would be filed before filing it.
      # STATE_OUT gives the fix-forward step below exactly the findings this run
      # measured, so the bot acts on one scan rather than re-scanning.
      - name: Full scan, drift report, and issues
        if: github.event_name == 'schedule' || inputs.apply
        run: make scan-monitor APPLY=1 STATE_OUT=/tmp/monitor-state.json

      - name: Full scan and drift report (dry run)
        if: github.event_name != 'schedule' && !inputs.apply
        run: make scan-monitor STATE_OUT=/tmp/monitor-state.json

      # ── Phase 847d: fix-forward ────────────────────────────────────────────
      #
      # "Zero fixable-but-waived findings" cannot be achieved by re-dating a
      # waiver, so the monitor now also asks, per waiver: does a newer upstream
      # tag clear this CVE? If yes it opens a reviewable bump branch — the fix
      # itself, not another 90 days of exposure. If no, it records WHY not
      # (`fix_available: false` + the concrete upstream change that would
      # unblock it) so the waiver carries an honest recheck trigger instead of a
      # silently-renewed date.
      #
      # A bot never creates a waiver and never merges: it proposes a branch and
      # an issue, and a human decides. `--bytes-out` records the HTTP response
      # sizes it saw, which is how the PyPI metadata cap is justified by evidence
      # rather than a guess.
      - name: Fix-forward proposals and recheck evidence
        if: github.event_name == 'schedule' || inputs.apply
        run: |
          # Exit 0 = ran clean; 1 = a proposal or comment failed; 2 = it could
          # not run at all. The monitor must not be blocked by the bot, but a
          # bot that silently did nothing is exactly the failure this
          # programme exists to remove — so each is announced distinctly.
          rc=0
          python3 scripts/fix_forward.py \
            --state /tmp/monitor-state.json \
            --scan-cache ~/.cache/ja4proxy-fix-forward/scan-cache.json \
            --bytes-out /tmp/fix-forward-bytes.json \
            --apply || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::fix-forward could not run (exit $rc) — no proposals or evidence were recorded"
          elif [ "$rc" -eq 1 ]; then
            echo "::warning::fix-forward reported a problem (exit 1) — see the log"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the fix-forward byte record
        if: always() && (github.event_name == 'schedule' || inputs.apply)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fix-forward-bytes
          path: /tmp/fix-forward-bytes.json
          if-no-files-found: ignore

      # A scheduled run that dies silently is indistinguishable from a clean one
      # for anyone not watching the Actions tab — and the monitor's own exit 1
      # (a surface it could not scan) is exactly the failure that must not be
      # mistaken for "no findings". Reuses ci.yml's scheduled-failure label so
      # both scheduled channels land in one triage queue.
      - name: Report a failed monitor run
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const label = 'scheduled-ci-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The daily CVE baseline monitor failed.',
              '',
              `Run: ${runUrl}`,
              '',
              'A non-zero exit here means a surface **could not be scanned**, not that',
              'a finding was found — findings are filed as `[cve-baseline] …` issues,',
              'not as a failed run. Treat this as an outage of the drift watch:',
              'findings on unscanned surfaces are unknown until it is fixed.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            // Any open tagged issue — including ci.yml's weekly-run tracker —
            // gets a comment rather than a duplicate issue.
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [label],
                title: 'Scheduled CI failure',
                body,
              });
            }
