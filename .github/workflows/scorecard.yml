name: Scorecard supply-chain security
on:
  # For Branch-Protection check. Only the default branch is supported. See
  # https://github.com/ossf/scorecard-action#workflow-restrictions
  schedule:
    - cron: '30 1 * * 6'
  push:
    branches: [ "main" ]

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write
      # phase-308: `security-events: write` removed together with the
      # "Upload to code-scanning" step below. Scorecard findings are
      # supply-chain *scores*, not code vulnerabilities; uploading all checks
      # into the code-scanning tab drowned real CodeQL findings under ~53
      # already-satisfied / required / self-clearing advisories. Scorecard still
      # runs (badge via publish_results + the results.sarif artifact); it just
      # no longer posts to the Security tab. To revert: restore
      # `security-events: write` and re-add the upload-sarif step.
      # Uncomment the permissions below if you are using SARIF_AUTH_TOKEN
      # contents: read
      # actions: read

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # (Optional) "vulnerability-method" with "osv" or "deps.dev"
          # vulnerability-method: osv
          
          # Public repositories:
          #   - Publish results to OpenSSF REST API for automated badge generation
          #   - Required for the "Branch-Protection" check
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # phase-308: the "Upload to code-scanning" step was removed on purpose.
      # Scorecard's per-check advisories are supply-chain scores, not code
      # vulnerabilities, and were drowning real CodeQL findings in the Security
      # tab. The score/badge (publish_results above) and the results.sarif
      # artifact above remain. Re-add github/codeql-action/upload-sarif with
      # sarif_file: results.sarif (and security-events: write) to restore.
