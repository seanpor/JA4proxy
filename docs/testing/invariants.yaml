invariants:
  - id: INV-TAP-001
    phase: "606-0"
    package: internal/tap
    test: TestInvariant_Tap_CircuitBreakerCooldownIsExact
    statement: >
      Circuit breaker transitions from OPEN to CLOSED at exact 10s cooldown boundary.
    mutation_check: "change Before() check to After() in Set -> test fails"

  # Phase 606a: Cryptographic, TLS & QUIC Parsing Invariants
  - id: INV-TLS-001
    phase: 606a
    package: internal/tls
    test: TestInvariant_TLS_GREASEIndependence
    statement: >
      Inserting any RFC 8701 GREASE value as a cipher, extension or group does not change the JA4 fingerprint.
    mutation_check: "remove GREASE filtering in parser.go -> test fails"
  - id: INV-TLS-002
    phase: 606a
    package: internal/tls
    test: TestInvariant_TLS_ExtensionPermutationInvariance
    statement: >
      Permuting wire order of ClientHello extensions does not mutate canonical JA4 fingerprint.
    mutation_check: "disable extension sorting in hello_info.go -> test fails"
  - id: INV-TLS-003
    phase: 606a
    package: internal/tls
    test: TestInvariant_TLS_GrammarAdherence
    statement: >
      All computed JA4 fingerprints strictly match canonical regex grammar.
    mutation_check: "hardcode separator as - in hello_info.go -> test fails"
  - id: INV-TLS-004
    phase: 606a
    package: internal/tls
    test: TestInvariant_TLS_ParserTotality
    statement: >
      ClientHello parser never panics or loops indefinitely over any truncated or malformed byte slice.
    mutation_check: "remove slice length check before reading extension length in parser.go -> test fails"

  # Phase 606b: Transport Splice, Buffer Replay & Packet Slicing Invariants
  - id: INV-SPLICE-001
    name: Buffer Replay Homomorphism
    description: Stream partitioning across chunk boundaries preserves exact payload bytes
    package: cmd/ja4pd
    test_func: TestInvariant_Splice_HomomorphicChunkSlicingAndReplay

  - id: INV-SPLICE-002
    name: Lossless ClientHello Replay
    description: Pre-read TLS ClientHello record is replayed losslessly to upstream server
    package: cmd/ja4pd
    test_func: TestInvariant_Splice_LosslessClientHelloReplay

  - id: INV-SPLICE-003
    name: Backpressure Buffer Bounding
    description: Stalled upstream servers trigger backpressure bounding
    package: cmd/ja4pd
    test_func: TestInvariant_Splice_BackpressureBufferBounding

  - id: INV-SPLICE-004
    name: Non-TLS Protocol Lockdown Fail-Closed
    description: Non-TLS protocol traffic under protocol lockdown is fail-closed terminated
    package: cmd/ja4pd
    test_func: TestInvariant_Splice_NonTLSProtocolLockdownFailClosed

  # Phase 606c: Resource Conservation & Concurrency Invariants
  - id: INV-RESOURCE-001
    name: Goroutine Conservation
    description: Connection worker goroutines return cleanly without memory or channel leaks
    package: cmd/ja4pd
    test_func: TestInvariant_Resource_GoroutineConservation

  - id: INV-RESOURCE-002
    name: FD Conservation Linux
    description: Socket file descriptors on Linux systems are closed cleanly
    package: cmd/ja4pd
    test_func: TestInvariant_Resource_FDConservationLinux

  - id: INV-RESOURCE-003
    name: Slowloris Read Timeout
    description: Slowloris attack connections trickling partial handshakes are forcibly terminated
    package: cmd/ja4pd
    test_func: TestInvariant_Resource_SlowlorisReadTimeout

  - id: INV-RESOURCE-004
    name: Abrupt TCP RST Resiliency
    description: Abrupt TCP RST client aborts do not cause unhandled runtime panics
    package: cmd/ja4pd
    test_func: TestInvariant_Resource_AbruptTCPRSTResiliency

  # Phase 606d: State Store & Distributed Rate-Limiting Invariants
  - id: INV-REDIS-001
    name: Atomic Sliding Window Count
    description: Exec(N concurrent at t) => Count == N
    package: internal/redis
    test_func: TestInvariant_Redis_AtomicSlidingWindowCount

  - id: INV-REDIS-002
    name: Timestamp Expiration
    description: forall t' >= t + W, Contribution(req_t, t') == 0
    package: internal/redis
    test_func: TestInvariant_Redis_TimestampExpiration

  - id: INV-REDIS-003
    name: GDPR TTL Enforcement
    description: forall K in KeysWritten, TTL(K) <= ARGV[3]
    package: internal/redis
    test_func: TestInvariant_Redis_GDPRTTLEnforcement

  - id: INV-REDIS-004
    name: Lua Script Embedded Parity
    description: Hash(scripts/) == Hash(internal/redis/scripts/)
    package: internal/redis
    test_func: TestInvariant_Redis_ScriptEmbeddedParity

  # Phase 606e: Passive TAP & Flow Reassembly Invariants
  - id: INV-TAP-001
    name: 16 KiB Per-Direction Buffer Cap
    description: BufferLen(dir) <= 16384 for all streams
    package: internal/tap
    test_func: TestInvariant_Tap_BufferCap16KiB

  - id: INV-TAP-002
    name: Single HandshakeEvent Emission
    description: Count(HandshakeEvent) <= 1 for all streams
    package: internal/tap
    test_func: TestInvariant_Tap_SingleHandshakeEvent

  - id: INV-TAP-003
    name: Active Stream Eviction
    description: ActiveStreams delta == 0 after ReassemblyComplete
    package: internal/tap
    test_func: TestInvariant_Tap_ActiveStreamEviction

  - id: INV-TAP-004
    name: Circuit Breaker Cooldown Exactness
    description: Failures >= N => Open && ResetsAt(t_cooldown)
    package: internal/tap
    test_func: TestInvariant_Tap_CircuitBreakerCooldownExactness

  # Phase 606f: Intelligence, Risk Scoring & Temporal Decay Invariants
  - id: INV-SCORE-001
    name: Risk Score Bounding
    description: forall signals, 0 <= TotalScore <= 100
    package: internal/security
    test_func: TestInvariant_Score_Bounding

  - id: INV-SCORE-002
    name: Risk Score Monotonicity
    description: S(x U {MaliciousSignal}) >= S(x), S(x U {TrustSignal}) <= S(x)
    package: internal/security
    test_func: TestInvariant_Score_Monotonicity

  - id: INV-SCORE-003
    name: Empty Signal List Zero Evaluation
    description: empty signals => score == 0, action == 'allow'
    package: internal/security
    test_func: TestInvariant_Score_EmptySignalsZero

  - id: INV-SCORE-004
    name: Individual Signal Clamping Sanitization
    description: forall s in signals, Clamped(s.Score) in [-100, 100]
    package: internal/security
    test_func: TestInvariant_Score_ClampedSignalSanitization

