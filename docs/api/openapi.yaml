components:
  schemas:
    BanCreateRequest:
      properties:
        ttl:
          type: integer
          minimum: 1.0
          title: Ttl
          description: TTL in seconds (default 3600)
          default: 3600
        reason:
          type: string
          maxLength: 256
          minLength: 1
          title: Reason
          default: manual
      type: object
      title: BanCreateRequest
      description: Body for POST /api/v1/bans/{ip}.
    BanCreateResponse:
      properties:
        message:
          type: string
          title: Message
        ip:
          type: string
          title: Ip
        ttl:
          type: integer
          title: Ttl
        reason:
          type: string
          title: Reason
      type: object
      required:
      - message
      - ip
      - ttl
      - reason
      title: BanCreateResponse
      description: Response from POST /api/v1/bans/{ip}.
    BanEntry:
      properties:
        ip:
          type: string
          title: Ip
        reason:
          type: string
          title: Reason
          default: manual
        ttl_remaining:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ttl Remaining
          description: Remaining TTL in seconds; None means persistent
      type: object
      required:
      - ip
      title: BanEntry
      description: A single active ban record.
    BanList:
      properties:
        bans:
          items:
            $ref: '#/components/schemas/BanEntry'
          type: array
          title: Bans
        count:
          type: integer
          minimum: 0.0
          title: Count
      type: object
      required:
      - count
      title: BanList
      description: Response from GET /api/v1/bans.
    BanRemoveResponse:
      properties:
        message:
          type: string
          title: Message
        ip:
          type: string
          title: Ip
      type: object
      required:
      - message
      - ip
      title: BanRemoveResponse
      description: Response from DELETE /api/v1/bans/{ip}.
    ConfigReloadResponse:
      properties:
        message:
          type: string
          title: Message
          default: Config reload signal published
        published_to:
          type: string
          title: Published To
          default: config:reload
      type: object
      title: ConfigReloadResponse
      description: Response from POST /api/v1/config/reload.
    DialUpdateRequest:
      properties:
        value:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Value
          description: New dial value (0-100, max ±10 change)
      type: object
      required:
      - value
      title: DialUpdateRequest
      description: Body for PUT /api/v1/dial.
    DialValue:
      properties:
        value:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Value
          description: Current dial setting (0-100)
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
          description: ISO8601 timestamp of last update
      type: object
      required:
      - value
      title: DialValue
      description: Response from GET /api/v1/dial.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: ok | degraded
        redis:
          type: string
          title: Redis
          description: ok | unavailable
        proxy_instances:
          type: integer
          minimum: 0.0
          title: Proxy Instances
          description: Number of live proxy instances detected
          default: 0
        geoip:
          type: string
          title: Geoip
          description: ok | unavailable
        uptime_seconds:
          type: number
          minimum: 0.0
          title: Uptime Seconds
      type: object
      required:
      - status
      - redis
      - geoip
      - uptime_seconds
      title: HealthResponse
      description: Response from GET /api/v1/health.
    ListAddResponse:
      properties:
        message:
          type: string
          title: Message
        entry:
          type: string
          title: Entry
      type: object
      required:
      - message
      - entry
      title: ListAddResponse
      description: Response from POST /api/v1/lists/{list_type}/{list_name}/{entry}.
    ListEntries:
      properties:
        entries:
          items:
            type: string
          type: array
          title: Entries
        count:
          type: integer
          minimum: 0.0
          title: Count
      type: object
      required:
      - count
      title: ListEntries
      description: Response from GET /api/v1/lists/{list_type}/{list_name}.
    ListRemoveResponse:
      properties:
        message:
          type: string
          title: Message
        entry:
          type: string
          title: Entry
      type: object
      required:
      - message
      - entry
      title: ListRemoveResponse
      description: Response from DELETE /api/v1/lists/{list_type}/{list_name}/{entry}.
    ManagedBy:
      type: string
      enum:
      - terraform
      - operator
      - api
      - analytics
      - legacy
      - migration
      title: ManagedBy
      description: Source of truth for a list entry.
    ResourceCreate:
      properties:
        entry:
          type: string
          maxLength: 512
          minLength: 1
          title: Entry
        managed_by:
          $ref: '#/components/schemas/ManagedBy'
          default: operator
        note:
          type: string
          title: Note
          default: ''
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
          description: ISO 8601 UTC timestamp; if in the past the entry is accepted
            but filtered on read
        list_type:
          anyOf:
          - type: string
          - type: 'null'
          title: List Type
          description: Used internally; inferred from route path if absent
      type: object
      required:
      - entry
      title: ResourceCreate
      description: Request body for POST /api/v1/{allowlist|blocklist|watchlist}.
    ResourceListResponse:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/ResourceResponse'
          type: array
          title: Entries
        count:
          type: integer
          title: Count
      type: object
      required:
      - entries
      - count
      title: ResourceListResponse
      description: Response from GET /api/v1/{allowlist|blocklist|watchlist}.
    ResourceResponse:
      properties:
        id:
          type: string
          title: Id
        entry:
          type: string
          title: Entry
        list_type:
          type: string
          title: List Type
        managed_by:
          type: string
          title: Managed By
        note:
          type: string
          title: Note
        created_at:
          type: string
          title: Created At
        created_by:
          type: string
