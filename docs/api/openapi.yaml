openapi: 3.1.0
info:
  title: JA4proxy Management UI
  description: Management interface for JA4proxy TLS security proxy
  version: 1.0.0
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: 'Validate credentials and set an httpOnly JWT cookie.


        On success: sets cookie and redirects to /.

        On failure: returns 401 JSON.'
      operationId: login_auth_login_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      description: Clear the auth cookie and redirect to /login.
      operationId: logout_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/mfa/totp/setup:
    get:
      tags:
      - mfa
      summary: Totp Setup
      description: "Enroll TOTP for the current user.\n\nGenerates a new TOTP secret,\
        \ encrypts it with Fernet, stores it in Redis,\ngenerates 8 backup codes (bcrypt-hashed\
        \ in Redis), and returns a QR code PNG\n(base64-encoded) plus the plaintext\
        \ backup codes (shown exactly once).\n\nCalling this endpoint again rotates\
        \ the secret and backup codes.\n\nReturns:\n    JSON with ``qr_code`` (base64\
        \ PNG) and ``backup_codes`` (list of 8 strings)."
      operationId: totp_setup_auth_mfa_totp_setup_get
      parameters:
      - name: token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/mfa/totp/verify:
    post:
      tags:
      - mfa
      summary: Totp Verify
      description: "Verify a 6-digit TOTP code or a backup code.\n\nOn success, marks\
        \ the current session as MFA-verified (sets\n``mgmt:mfa:session:{sha256(jwt)}``).\n\
        \nRequest body (JSON):\n    ``code``: the 6-digit TOTP code or a backup code\
        \ string.\n\nReturns:\n    200 ``{\"verified\": true}`` for TOTP codes.\n\
        \    200 ``{\"verified\": true, \"backup_code_used\": true}`` for backup codes.\n\
        \    401 for wrong codes or expired TOTP window.\n    404 if TOTP is not enrolled\
        \ for this user."
      operationId: totp_verify_auth_mfa_totp_verify_post
      parameters:
      - name: token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/mfa/webauthn/register/begin:
    post:
      tags:
      - mfa
      summary: Webauthn Register Begin
      description: 'Generate a WebAuthn registration challenge.


        Returns the PublicKeyCredentialCreationOptions JSON that the browser needs

        to call ``navigator.credentials.create()``. Excludes any already-registered

        credentials to prevent duplicate registration.


        The challenge is stored in Redis with a 5-minute TTL.'
      operationId: webauthn_register_begin_auth_mfa_webauthn_register_begin_post
      parameters:
      - name: token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/mfa/webauthn/register/complete:
    post:
      tags:
      - mfa
      summary: Webauthn Register Complete
      description: "Verify WebAuthn attestation and store the new credential.\n\n\
        Request body: the ``PublicKeyCredential`` JSON from ``navigator.credentials.create()``.\n\
        \nOn success stores:\n- ``mgmt:webauthn:credential:{credential_id}`` Hash\
        \ record\n- Adds credential ID to ``mgmt:webauthn:user:{user_id}:credentials``\
        \ SET\n\nReturns:\n    201 ``{\"registered\": true, \"credential_id\": \"\
        <base64url>\"}``\n    400 if no challenge found or attestation verification\
        \ fails."
      operationId: webauthn_register_complete_auth_mfa_webauthn_register_complete_post
      parameters:
      - name: token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/mfa/webauthn/auth/begin:
    post:
      tags:
      - mfa
      summary: Webauthn Auth Begin
      description: "Generate a WebAuthn authentication challenge.\n\nReturns the ``PublicKeyCredentialRequestOptions``\
        \ JSON the browser needs to\ncall ``navigator.credentials.get()``. The ``allowCredentials``\
        \ list is\npopulated with all credentials registered for this user.\n\nReturns:\n\
        \    200 with challenge options JSON.\n    404 if no credentials are enrolled."
      operationId: webauthn_auth_begin_auth_mfa_webauthn_auth_begin_post
      parameters:
      - name: token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/mfa/webauthn/auth/complete:
    post:
      tags:
      - mfa
      summary: Webauthn Auth Complete
      description: "Verify a WebAuthn assertion and mark the session as MFA-verified.\n\
        \nRequest body: the ``PublicKeyCredential`` JSON from ``navigator.credentials.get()``.\n\
        Must contain an ``id`` field (base64url credential ID).\n\nOn success sets\
        \ ``mgmt:mfa:session:{sha256(jwt)}`` → \"verified\" (8h TTL).\n\nReturns:\n\
        \    200 ``{\"verified\": true}``\n    400 if no authentication challenge\
        \ found.\n    404 if the credential ID is not registered.\n    401 if assertion\
        \ verification fails."
      operationId: webauthn_auth_complete_auth_mfa_webauthn_auth_complete_post
      parameters:
      - name: token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/sso/metadata:
    get:
      tags:
      - sso
      summary: Saml Metadata
      description: "Serve SAML SP metadata XML.\n\nThe IdP administrator fetches this\
        \ URL to configure the SP side of the\ntrust relationship.  No authentication\
        \ required.\n\nReturns:\n    200 ``application/xml`` SP metadata.\n    503\
        \ if SAML IdP is not configured (missing env vars)."
      operationId: saml_metadata_auth_sso_metadata_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/sso/saml/login:
    get:
      tags:
      - sso
      summary: Saml Login
      description: "Initiate SAML 2.0 login — redirect browser to the IdP SSO URL.\n\
        \nGenerates a random nonce, stores it in Redis (5-min TTL) for CSRF\nprotection,\
        \ and passes it as the RelayState.  The IdP will echo the\nRelayState back\
        \ in the ACS POST so we can verify it there.\n\nNo authentication required\
        \ (this is the start of the login flow).\n\nReturns:\n    302 redirect to\
        \ IdP SSO URL.\n    503 if SAML is not configured."
      operationId: saml_login_auth_sso_saml_login_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/sso/saml/acs:
    post:
      tags:
      - sso
      summary: Saml Acs
      description: "SAML Assertion Consumer Service — receive and process IdP response.\n\
        \nThe IdP POST-binds the base64-encoded SAMLResponse and the RelayState\n\
        (nonce) here.  On success, issues a JWT cookie and redirects to the\nstored\
        \ redirect URL.\n\nNo authentication required (this IS the authentication\
        \ step).\n\nReturns:\n    302 redirect to post-login URL with ``token`` cookie\
        \ set.\n    400 if relay state (nonce) is missing or expired.\n    401 if\
        \ the SAML assertion is invalid.\n    403 if the user's groups do not map\
        \ to any role.\n    503 if SAML is not configured."
      operationId: saml_acs_auth_sso_saml_acs_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/sso/oidc/login:
    get:
      tags:
      - sso
      summary: Oidc Login
      description: "Start the OIDC authorization code + PKCE flow.\n\nFetches the\
        \ discovery document, generates a PKCE pair and random state,\nstores them\
        \ in Redis (5-min TTL), then redirects the browser to the\nIdP authorization\
        \ endpoint.\n\nNo authentication required (this is the start of the login\
        \ flow).\n\nReturns:\n    302 redirect to IdP authorization URL.\n    503\
        \ if OIDC is not configured."
      operationId: oidc_login_auth_sso_oidc_login_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/sso/oidc/callback:
    get:
      tags:
      - sso
      summary: Oidc Callback
      description: "Handle the OIDC authorization code callback.\n\nValidates the\
        \ state (CSRF check), exchanges the code for tokens using\nPKCE, extracts\
        \ claims from the ID token, maps groups to a role, and\nissues a JWT cookie.\n\
        \nNo authentication required (this IS the authentication step).\n\nReturns:\n\
        \    302 redirect to post-login URL with ``token`` cookie set.\n    400 if\
        \ state is missing or expired.\n    401 if token exchange or claim extraction\
        \ fails.\n    403 if the user's groups have no mapped role.\n    503 if OIDC\
        \ is not configured."
      operationId: oidc_callback_auth_sso_oidc_callback_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/health:
    get:
      tags:
      - health
      summary: Health
      description: 'Return system health status.


        Never raises — all failures are caught and reflected in the response body.'
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/health/deep:
    get:
      tags:
      - health
      summary: Health Deep
      description: 'Deep health check — verifies Redis connectivity and returns latency.


        Returns HTTP 200 when Redis is healthy, 503 when degraded.

        Requires at minimum the Auditor role.'
      operationId: health_deep_api_v1_health_deep_get
      parameters:
      - name: token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ready:
    get:
      tags:
      - health
      summary: Ready
      description: 'Readiness probe — no authentication required.


        Returns 200 {"ready": True} when Redis is reachable and accessible.

        Returns 503 {"ready": False, "reason": ...} on any failure.


        Intended for load-balancer health checks that must not require auth.'
      operationId: ready_api_v1_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/dial:
    get:
      tags:
      - dial
      summary: Get Dial
      description: Return the current dial value.
      operationId: get_dial_api_v1_dial_get
      parameters:
      - name: token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialValue'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - dial
      summary: Update Dial
      description: "Update the dial value.\n\nEnforces a maximum change of ±10 per\
        \ request to prevent accidental\njumps in blocking aggression.\n\nArgs:\n\
        \    body: New dial value (0-100).\n\nRaises:\n    HTTPException(400): If\
        \ the requested change exceeds ±10."
      operationId: update_dial_api_v1_dial_put
      parameters:
      - name: token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialValue'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - dial
      summary: Update Dial
      description: "Update the dial value.\n\nEnforces a maximum change of ±10 per\
        \ request to prevent accidental\njumps in blocking aggression.\n\nArgs:\n\
        \    body: New dial value (0-100).\n\nRaises:\n    HTTPException(400): If\
        \ the requested change exceeds ±10."
      operationId: update_dial_api_v1_dial_patch
      parameters:
      - name: token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialValue'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
