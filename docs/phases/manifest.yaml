    dependencies: []
    size: MEDIUM
    summary: "COMPLETE. Focused security bug hunt over the remotely-reachable Go proxy surface
      (accept loop, ClientHello parser, reassembly, PROXY v1/v2 parser, JA4/JA4X) for
      crashes/RCE/memory-safety/data-integrity. All Go fuzz targets ran to convergence with
      zero crashers (ClientHello parser 10.7M execs, fragmentation, PROXY v1/v2, smuggling).
      Found and fixed JA4PROXY-2026-0092 (MEDIUM): tls.ParseClientHello returns SNI/ALPN as
      zero-copy strings aliasing the sync.Pool read buffer, and handleConn handed connCtx to
      the default async scorer via workChan before returning the buffer to the pool — a later
      connection reusing the buffer could corrupt the SNI/ALPN the scoring/beaconing workers
      read (cross-connection bleed: wrong scoring, SNI hostname leak into other logs, worst
      case a corrupted ALPN missing the h2/h1 browser bypass -> real browser blocked). Fixed
      by cloning SNI/ALPN at a single choke point (populateTLSFingerprints); regression test
      fails if reverted. No crash/RCE vector found on the remote surface."
  520:
    name: "Aggressive Bug Hunt — Go Proxy (Red-Team Pass)"
    status: COMPLETE
    action_plan: docs/phases/complete/PHASE_520.md
    dependencies: []
    size: MEDIUM
    summary: "Adversarial second pass over the remotely-reachable Go proxy, then fixed the one
      finding it produced: JA4PROXY-2026-0094 (MEDIUM, FIXED) — the operator manual ban (ban:{ip})
      and Spamhaus blocklist were hard blocks evaluated only on the async processInternal path, so
      when the scoring queue (workChan) saturated under flood, Process returned allow and
      handleConn forwarded a banned/blocklisted IP to the backend. Fix: both checks now run
      synchronously in Pipeline.Process, before the async enqueue; BlocklistManager.Check is still
      called exactly once per connection (result cached on ConnectionContext, reused by
      processInternal) to avoid reintroducing the JA4PROXY-2026-0037 TOCTOU. Fail-open for scoring
      preserved — non-hard-block traffic still returns allow under saturation. Regression tests
      (internal/security/pipeline_saturation_hardblock_test.go) fill workChan to force the
      saturation path; verified to fail on revert. Reviewed and decided (no code change, documented
      in PHASE_520.md): the auto-escalation ban and datacenter policy terminal-from-async paths stay
      async because they are outputs of signal collection itself (rate limiter, ASN classifier),
      not independent O(1) lookups like ban:{ip}/blocklist — making them synchronous would put
      blocking I/O on the hot path, a bigger change than this phase's scope. Byte parsers
      re-confirmed clean (fuzzed to convergence, zero crashers)."
