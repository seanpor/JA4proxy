epics:
  - name: "Epic: Core Performance"
    description: "Optimization for high-throughput and multi-core systems."
    phases: [0, 15, 17, 26]
    
  - name: "Epic: Security Hardening"
    description: "Deep security analysis, compliance, and audit remediation."
    phases: [1, 3, 4, 5, 8, 10, 11, 14, 16, 18, 25]
    
  - name: "Epic: Analytics & Intelligence"
    description: "Cross-instance behavior analysis and threat intelligence."
    phases: [6, 7, 9, 12, 23]
    
  - name: "Epic: Next-Gen Passive Capture"
    description: "Out-of-band monitoring and enforcement."
    phases: [20]
    
  - name: "Epic: User Interface & Experience"
    description: "Management dashboards and documentation quality."
    phases: [2, 13, 19, 21, 22]

