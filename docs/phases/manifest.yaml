    summary: 'Took over external PR #95 ("unleash Go performance") on a clean branch off main, keeping every legitimate win and fixing the regressions. KEPT: io.CopyBuffer-style pooled 32KB buffer reuse in forward() (sync.Pool, sync.WaitGroup, JA4PROXY-2026-0009 invariant preserved), Redis PoolSize 100/MinIdleConns 10, 32-goroutine async scoring pool + workChan 10000->20000, dev/POC/Perf backend port 443->8443 (Production stays 443), lazy %s tarpit logging, and honest hyperbole tone-downs (Elite->Verified/High) in existing docs. FIXED: restored the per-read SetReadDeadline/SetWriteDeadline idle-reaper PR #95 silently dropped — without it a slowloris/idle-hold pins a goroutine + pooled buffer forever and read_timeout/write_timeout become dead config; the pooled-buffer win and the deadlines coexist. Added Go regression test TestForward_IdleConnectionIsReaped (tears down an idle pair at read_timeout; hangs/fails if deadlines removed). REPAIRED docs/ATTACK_MAPPING.md, which was stale on main (Python prototypes src/security/*.py retired in v2.0.0): dropped the dead prototype rows, repointed the two genuine rate-tracker rows to internal/security/rate_limiter.go, and fixed the CI-gate test path (docs/for-architects -> docs/) — the gate (tests/test_attack_mapping.py) was failing on main and now passes. The unsubstantiated ">10,000 CPS/core" claim lived only in PR-new marketing docs (BENCHMARKING_GUIDE.md, PHASE_161.md), which were simply not imported. Left the connection-decision log at Info (no Debug demotion) to preserve the audit trail. Go build/vet/gofmt clean; touched-package tests green.'
