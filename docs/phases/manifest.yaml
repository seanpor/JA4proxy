  814j:
    name: "Pentest: resource exhaustion and availability"
    status: PROPOSED
    action_plan: docs/phases/PHASE_814.md
    dependencies: [814b]
    size: MEDIUM
    summary: "Stage 1, Green band only. Absorbs Phase 523 item 4 (tarpit resource
      bounds). Connection-slot and goroutine exhaustion attacked AROUND the
      existing regression tests; accept-loop semaphore; workChan saturation and
      its 0094 hard-block interaction; tarpit slots and per-IP caps; slowloris
      pre-handshake holds vs read timeouts; reassembly buffer memory under many
      partial handshakes; Redis backpressure and XADD with a dead consumer;
      unbounded growth in any Redis structure; log-volume amplification; and
      Prometheus metrics cardinality explosion via attacker-controlled label
