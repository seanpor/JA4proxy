  815:
    name: "Generated reference docs — stop hand-maintaining three drifted lists"
    status: PROPOSED
    action_plan: docs/phases/PHASE_815.md
    dependencies: []
    size: MEDIUM
    summary: "PROPOSED 2026-08-05, raised while adding make targets during
      Phase 814a: rather than hand-add rows to three reference lists, they were
      measured, and all three had already drifted. MAKEFILE_TARGETS.md documents
      167 of 187 targets AND lists 36 that no longer exist (go-parity, go-start,
      go-rollback etc, leftovers from the Phase 15 Go migration) — wrong in both
      directions. SCRIPTS.md covers 45 of 119 scripts (63% missing).
      DOCKER_IMAGES.md, described in docs/README.md as the canonical registry of
      all images, omits 4 Dockerfiles INCLUDING Dockerfile.go-proxy, which builds
      the production proxy. Nothing caught any of it because lint-meta's
      documentation-sync check is one-directional: it verifies commands
      mentioned in docs exist in the Makefile, not that Makefile targets are
      documented. Same failure mode as Phase 810 (TRIVY_IMAGES drift hid 113
      findings across 3 never-scanned images) and Phase 812 (KNOWN_ACTION_SHAS
      hand-maintained table). Fix follows the pattern Phase 332 already
      established for TODO.md/PROJECT_STATUS.md: derive each list from the
      artefact it describes (Makefile ## help comments, script header blocks,
      Dockerfiles + compose stanzas) via scripts/sync_reference_docs.py, with a
      --check drift gate in CI and hand-written prose preserved between explicit
      GENERATED markers. Recommends AGAINST gitignoring these three (unlike
      TODO.md) since they are read on GitHub by newcomers who have not run make
      sync. SEQUENCING: 815 runs BEFORE 814b — both need the same
      derive-doc-from-reality + --check drift-gate machinery, and building it
      twice would itself be a drift problem. 815 owns the generator; 814b
      consumes it for ATTACK_SURFACE.md."
  819a:
    name: "Benchmark truthfulness — the throughput and false-positive numbers are both constants"
    status: PROPOSED
    action_plan: docs/phases/PHASE_819a.md
    dependencies: []
    size: MEDIUM
    summary: "PROPOSED 2026-08-13, raised by rerunning make bench-all after the
      entrypoint shebang fix (#416); revised after three independent expert
      reviews. Two numbers this project publishes are constants, not
      measurements. (1) Throughput: ja4bench.go runProfile is a rate-limited
      closed loop (ratePerWorker = rate/workers, synchronous dial inside the
      tick handler, Go tickers drop rather than coalesce), and neither
      Makefile:1209 nor nightly-benchmark.yml:57 passes --workers or
      --good-rate, so it offers 8 x (100/8) = 96 conn/s. Proof: the CI artefact
      reports total_good 2873 against 8 workers x floor(30s/83.333ms) = 2880
      predicted, and Little's Law gives 1.2 connections in flight out of 8
      workers. An i9-9900K measures 95.73 and a GitHub runner 95.749 — agreeing
      to 0.02% while their mean latencies differ 2x (6.26ms vs 12.498ms). Blind
      zone is 13.3x on the i9, 6.7x in CI; it invalidates throughput only, the
      latency figures are real measurements of an unloaded path. (2) False
      positives: Record() returns early on err before the allowed/blocked
      branch, and the only allowed=false call site passes an error, so
      GoodBlocked is unreachable, FalsePositiveRate() is always 0.00%, and the
      Status() FP gate Phase 800 added can never fire — while ja4bench_test.go
      sets the field directly. Under CLAUDE.md's core asymmetry that is the
      worse constant. Phase 818 saw the paradox and blamed shared CI runners;
      its self-hosted-runner remedy would entrench the artefact, though the
      idea becomes right once the harness saturates. Design: the gate is a
      rate_limited boolean (achieved vs offered), NOT a plateau assertion — a
      plateau cannot distinguish the proxy from docker-proxy or from the
      generator itself. Saturating flags go in ja4bench.go defaults because the
      nightly workflow inlines the binary and never calls make bench-macro.
      Removes measure-mttr from bench-all on day one so verify-all stops
      carrying docker-volume-rm authority. Adds bench-hostnative, the only
      stage that measures the engine. Closes the Phase 524 D2 debt."
  819b:
    name: "Bench-all stage repair — bit-rot, lane-awareness, and safe MTTR isolation"
    status: PROPOSED
    action_plan: docs/phases/PHASE_819b.md
    dependencies: [819a, 814a]
    size: LARGE
    summary: "PROPOSED 2026-08-13, the second half of the bench-all
      restoration; 819a lands first. perf-test is dead four layers deep: locust
      2.17.0 cannot import on Python 3.14 (PEP 649/749), AND the events it
      fires at eight sites (request_success/request_failure) were removed in
      locust 2.0, AND its ClientHello is structurally corrupt (pack_into '>I'
      writes 4 bytes into the 3-byte handshake-length field; all extensions
      emitted with length 0), AND it points plain HTTP at the TLS passthrough
      port while driving 100 users at the live lane for 5 minutes — so the fix
      is retirement, not a version bump, which also drops the msgpack pin and a
      large CVE surface. test-go-perf defaults to port 18082 while lanes
      publish HOST_PORT_DIRECT, so 4/4 tests skip and exit 0; its 4264 conn/s
      is GIL-bound Python threads doing bare TCP connects and must not be
      promoted; its Python-ratio test defaults PYTHON_PROXY_PORT to 8081, the
      same as the compose HOST_PORT_DIRECT default, so after the port fix it
      compares the Go proxy against itself and fails rather than skips.
      load-test references four LOAD_TEST_* variables defined nowhere, and
      fixing that alone would make it silently green: it records no throughput,
      latency or error count, keeps only the last 2000 chars of stdout (which
      truncates the throughput line on a 4-profile mix), and has no non-zero
      exit for zero successful connections. measure-mttr expects a host
      redis-cli (forbidden by container-strict execution); behind that sit an
      invalid 'docker compose volume ls' (the plural 'volumes' exists and is
      project-scoped), a redis service publishing no host port, an NDJSON parse
      failure that makes scenario 2 stop docker-socket-proxy instead of the
      proxy, no trap so an interrupt leaves config:dial=100 published, and —
      critically — .env sets COMPOSE_PROJECT_NAME so bare 'docker compose'
      targets the LIVE LANE with the root 4-service file, recreating its Redis
      under an incompatible definition and breaking ACL auth fleet-wide. Also:
      bench-micro never runs internal/security's benchmarks, two stages run
      host Python 3.10 against AGENTS.md container-strict, and bench-all leaves
      an untracked MTTR_BASELINE.md that trips Phase 800's dirty-tree refusal."

  817:
    name: "Analytics node crash-loop fix — src/utils missing from image (JA4PROXY-2026-0097)"
    status: COMPLETE
    action_plan: docs/phases/complete/PHASE_817.md
    dependencies: []
    size: SMALL
    summary: "Remediation of JA4PROXY-2026-0097, found during the Phase 814
      pentest cycle while bringing up the range. The analytics container
      crash-looped on EVERY startup (RestartCount=152, exit 1) with
      ModuleNotFoundError: No module named 'src.utils' — src/analytics/main.py
      imports src.utils.logging_config but the Dockerfile COPYs only
      src/analytics, so src/utils (which exists in-repo) never reaches the
      image. Silent because no test exercised the analytics image's import
      closure. MEDIUM (rubric M-4: analytics node, not the proxy path); GitHub
      issue #398. Fix: add COPY src/utils to the Dockerfile (src/utils is
      self-contained, verified). Regression test tests/unit/
      test_analytics_image_imports.py is STATIC — parses every src.* import in
      the analytics package and every COPY src/<sub> in the Dockerfile and
      asserts the former is a subset of the latter, catching the whole class
      with no Docker. Two-state proof recorded: fails pre-fix ('missing src
      subtree(s): [utils]'), passes post-fix; container confirmed to start past
      import on the range. Fixing it revealed a separate previously-masked
      analytics->Redis NoPermissionError, traced to the range's own incomplete
      Redis ACL provisioning (also explains an earlier management->Redis
      AuthenticationError) — a range-quality issue tracked separately, NOT
      introduced by this fix. A genuine downstream question (can the
      analytics ~analytics:* ACL user read the proxy event stream it consumes?)
      is deferred to workstream 814k, needs a working range Redis to answer."
  818:
    name: "CI health — clear the CVE-exception cliff + fix two recurring scheduled-workflow false failures"
    status: COMPLETE
    action_plan: docs/phases/complete/PHASE_818.md
    dependencies: []
    size: MEDIUM
    summary: "Found while PR #399 surfaced red CI whose failures were NOT in its
      diff. Three connected pre-existing problems red-failing every PR and main:
      (1) a 31-CVE .trivyignore exception cliff — 31 dated exceptions all
      exp:2026-08-06, so make scan (required) went red everywhere at once; a
      time-triggered expiry is un-catchable by a local pre-push gate. (2) #396
      trivyignore-renewal workflow fails every real run: it pushes a branch then
      gh pr create, which fails exit 1 because the repo has 'Allow GitHub Actions
      to create and approve pull requests' disabled — so the cliff was never
      defused, and each run left an orphan branch + false-alarm issue. (3) #395
      nightly-benchmark fails every night: gate compares a HOST baseline (600 cps,
      290ms p95) to CI-runner numbers (~96 cps, ~17ms p95) — throughput 6x lower
      while latency 17x BETTER proves environment mismatch, not regression.
      Fixes: CVE cliff INVESTIGATED for real fixes not blanket-renewed (per
      maintainer instruction). Honest verified outcome: NONE of the 31 had an
      available fix. GHSA-6v7p-g79w-8964 (msgpack) + CVE-2025-47273 (setuptools)
      are pip's OWN vendored copies (pip/_vendor), unfixable by us even at
      current pip 26.2.1 — an initial 'the python base bump clears these' claim
      was WRONG, caught by reading the make scan log not its exit code; both stay
      exceptioned (build surfaces them non-deterministically). The other 29
      confirmed no better upstream tag (alertmanager/promtail latest, grafana
      13.1.x + cadvisor v0.55.1 carry larger CVE sets, ecdsa no upstream patch).
      All 31 renewed to today+7 (policy caps at 7d; the fixed weekly workflow is
      the recurrence guard). A base-image bump was tried and REVERTED — it cleared
      nothing (pip is upgraded at build time regardless of base patch) and tripped
      a deliberate base-pin guard test; no image base changed. #396:
      workflow no longer calls gh pr create — pushes the branch + opens a rolling
      tracking issue with a one-click compare link, human opens the PR (preserves
      required human review), never fails on the repo policy. #395: throughput/
      latency gate made advisory (warns, trends in Grafana, does not fail the job
      or file issues against a baseline known not to match CI) until a
      CI-representative baseline exists (follow-up). Orphan branch deleted; #395/
      #396 closed. Also closes the honest gap that #399 was pushed without
      running full make scan/lint/test locally — these changes were verified with
      full make scan locally before pushing."

  822:
    name: "Go 1.26.6 bump + .trivyignore first-/third-party split"
    status: COMPLETE
    action_plan: docs/phases/PHASE_822.md
    dependencies: []
    size: SMALL
    summary: "Two changes that stop the scan gate lying about our own product.
      (1) Makefile passed the SAME --ignorefile to both scan-images
      (third-party) and scan-first-party, and Trivy's ignorefile has no
      per-image scoping — so every waiver granted to an abandoned monitoring
      sidecar also suppressed the same finding in the proxy we ship. Observed:
      CVE-2026-39821 and CVE-2026-46600 were waived with justifications written
      entirely about Grafana/Promtail/Alertmanager/cAdvisor ('they consume
      metrics/logs or serve authenticated admin UIs only') while both were live
      in ja4proxy:2.0.0, an internet-facing TLS proxy. Split into
      .trivyignore.first-party (4 entries) and .trivyignore.third-party (55),
      with DIFFERENT rules: first-party forbids waiving anything a rebuild can
      fix; third-party requires only that no fix be reachable without replacing
      the image — the honest criterion the old header claimed but could not
      enforce (70 of 73 entries carried a non-empty FixedVersion).
      (2) Bumped Go 1.26.5 -> 1.26.6 across five digest-pinned builders, go.mod
      and seven CI pins, clearing those two CVEs plus the six-CVE stdlib batch
      (CVE-2026-33818/-56853/-56858/-56859/-56860/-56862) that a Trivy DB update
      surfaced on 2026-08-15 and which had turned scan-images red on main.
      ja4proxy:2.0.0 now scans clean with NO ignorefile at all. Guard tests
      assert the two targets use different files, that no CVE appears in both,
      and that the retired single .trivyignore has not reappeared — one test
      specifically pins the mis-edit made during implementation, where a single
      sed over both occurrences pointed scan-first-party at the third-party file
      and would have restored the bug while looking like the fix. renew_trivyignore.py
      and the weekly renewal workflow now walk both files; left on the retired
      path the automation would have become a silent no-op."
  820:
    name: "Retire prom/haproxy-exporter for HAProxy's native Prometheus exporter"
    status: COMPLETE
    action_plan: docs/phases/PHASE_820.md
    dependencies: []
    size: SMALL
    summary: "prom/haproxy-exporter was a CSV-to-Prometheus shim from before
      HAProxy 2.0 shipped its own exporter. haproxy:2.8.26-alpine (already
      pinned) is built with USE_PROMEX=1, so Prometheus scrapes haproxy:8404
      directly. Upstream abandoned the sidecar — last release 2023-02-15 on Go
      1.19.5 — and it carried 58 HIGH/CRITICAL CVEs requiring 20 of the repo's
      73 .trivyignore exceptions (73 -> 53). Running both exporters side by side
      revealed the monitoring built on it was ALREADY DEAD: nine selectors (five
      alert rules, four dashboard panels) filtered on {proxy=\"ja4proxy\"}, but
      proxy= is the NATIVE exporter's label — the sidecar emitted
      frontend=/backend= and never a proxy label at all — and the value was
      wrong regardless (the backend is ja4proxy_workers). HAProxyBackendDown
      additionally now pins state=\"UP\": native promex emits
      haproxy_server_status as a state machine, so an unconstrained == 0 matches
      four always-zero states and pages continuously. Two panels used
      rate(haproxy_frontend_connections_rate[1m]) — a metric native promex does
      not emit, and a gauge under the sidecar, so rate() was invalid either way.
      Adds tests/unit/test_metric_selector_validity.py, a REUSABLE selector
      validator (Phase 821a extends it to ja4proxy_* rather than
      reimplementing): it parses dashboard JSON into expr strings rather than
      scanning raw text, because quotes are backslash-escaped in the file so a
      raw-text regex sees empty labels and passes vacuously — fixing that
      immediately surfaced four further dead selectors beyond the five found by
      hand. Retires the follow-up deferred by Phases 810, 812 and 818."

  821a:
    name: "Console metrics foundation — Prometheus client, metric catalogue, one panel"
    status: PROPOSED
    action_plan: docs/phases/PHASE_821a.md
    dependencies: []
    size: MEDIUM
    summary: "PROPOSED 2026-08-15. Makes the management console the single
      operational face: Prometheus becomes a headless engine, the console its
      only human face. Today the proxy exports 89 ja4proxy_* metrics and the
      console shows five Redis-derived numbers; _PROMETHEUS_URL
      (partials.py:690) is defined and never used, and aiohttp was added in
      Phase 234 for exactly this job and never imported. Ships ONE panel, not
      five, because expert review of the monolithic draft found five wrong
      PromQL expressions and two wrong dependency choices. Security: closed
      tile-ID catalogue, never client PromQL. Reliability: console fails
      VISIBLY (three-state Ok/Empty/Unavailable) unlike the proxy's fail-open —
      only ConnectionsTotal pre-initialises labels, so a healthy fresh proxy
      returns empty vectors that must render 0, not 'broken'."

  821b:
    name: "Console panels — the remaining Prometheus tiles"
    status: PROPOSED
    action_plan: docs/phases/PHASE_821b.md
    dependencies: [821a]
    size: MEDIUM
    summary: "PROPOSED 2026-08-15, rewritten after a second expert review that
      found three tiles structurally dead or actively misleading:
      ja4proxy_dial_changes_total is defined and registered but NEVER
      incremented (permanent false 'no dial changes'); the panics tile used
      increase(a)+increase(b), and + across an absent operand yields empty which
      'or vector(0)' converts to a confident 0 during a panic storm; the browser
      tile's corpus holds only 12 unique fingerprints and Decide() returns
      'allow' at the default dial=0, so it would read '0% of browsers harmed'
      from a measurement structurally unable to detect harm. Scope narrowed —
      the connections.py unbounded-xrange fix (a compliance-facing paginated
      endpoint) becomes its own security PR, RBAC becomes 821d, deployed
      alert-rule fixes become 821e."

  821c:
    name: "Prometheus hardening (quarantined)"
    status: PROPOSED
    action_plan: docs/phases/PHASE_821c.md
    dependencies: [820, 821a, 821b]
    size: SMALL
    summary: "PROPOSED 2026-08-15. Quarantined from 821 because expert review
      found the original 'Prometheus not reachable from the host' criterion
      would have broken Phase 820's own acceptance criteria (which verify alerts
      via /api/v1/rules from a host-side script) plus ~10 callers across
      scripts/ and the Makefile — for near-zero gain, since the port is already
      loopback-only. This phase RECOMMENDS DECLINING that change and keeps only
      the free win: dropping --web.enable-lifecycle from both compose files.
      Nothing in the repo POSTs /-/reload, and the flag exposes unauthenticated
      /-/quit on a Prometheus that sits on four networks including the DMZ."

  816:
    name: Demo environment — end-to-end management console showcase
    status: PROPOSED
    action_plan: docs/phases/PHASE_816.md
    dependencies: []
    size: MEDIUM
    summary: 'Single-command demo: fake backend + varied TLS traffic + management
      console + Prometheus/Grafana, with live block/allow/dial control. Glues trafficgen
      + management into the start path, seeds via API, adds end-to-end verify + runbook.'

  823:
    name: "Test failures print no traceback inside Docker — conftest os._exit() preempted pytest reporting"
    status: COMPLETE
    action_plan: docs/phases/PHASE_823.md
    dependencies: []
    size: SMALL
    summary: "Rescued from the handoff-to-deepseek branch, where it had been
      written 2026-08-05 as Phase 816 and preserved outside manifest.yaml; a
      different phase later took 816 (demo environment, #424), so this was
      renumbered to 823. tests/conftest.py ended the session with
      os._exit() inside Docker, which terminates before pytest's terminal
      reporter writes the FAILURES section — so every failing test printed 'F'
      and nothing else: no traceback, no assertion message. Every Python test
      here runs in a container, so that was every failure. It hid because the
      exit code stayed correct: CI went red, just uninformatively. The plan
      demanded measuring rather than assuming, and that paid off twice: (a)
      trylast=True, the plan's likely minimal fix, does NOT work — the terminal
      reporter's own sessionfinish runs in the same phase and ordering alone
      does not decide the winner; (b) the asyncio hang the hook guarded against
      no longer reproduces on the current pytest/pytest-asyncio/base image —
      1864 unit tests (xdist AND serial) and 751 management tests all exited
      cleanly in seconds with it removed. So the hook is deleted, not
      reordered. Adds tests/unit/test_pytest_reporting.py: real pytest
      subprocesses asserting the assertion message appears in serial and xdist,
      that a FAILURES/summary section is emitted, and an AST guard (verified to
      fail on reintroduction) against os._exit returning. This bug cost two
      debugging cycles during Phases 820/822, where a CI failure showed
      'sss................F' with no traceback and was misattributed to log
      buffering."

  824:
    name: "Customer journeys — catalogue, journey regression tests, and a RED flag for the UI"
    status: PROPOSED
    action_plan: docs/phases/PHASE_824.md
    dependencies: [816, 821a]
    size: LARGE
    summary: "PROPOSED 2026-08-15. The suite proves the parts work; it does not
      prove a person can get their job done. Catalogues ten customer journeys
      (stop-the-bots, day-one deploy, demo, false-positive rescue, dial tuning,
      retrospective, hot config change, degraded dependencies, audit/DSAR,
      capacity) with the CLI path, the console path, and an explicit
      'proves it worked' assertion for each. The UI gap is structural: the
      console is a shell plus htmx partials polled from /api/v1/partials/*, and
      test_pages.py asserts only that the shell renders — which it does
      identically when every partial behind it is broken, because htmx fetches
      them after page load. Of 15 hx-get URLs referenced across templates, 6
      already have route-resolution assertions (incidentally, from tests written
      for other purposes) and 9 do not: health-cards, dial, bans, audit,
      intelligence, intelligence-review, attack-top, attack-fingerprint-table,
      attack-mode-indicator. All 15 resolve today, but two live in
      attack_mode.py and tls_health.py rather than partials.py, so a router
      refactor can blank a panel with nothing to catch it. Proposes three UI tiers (route
      resolution extracted FROM the templates so it is self-maintaining; content
      checks that a 200 is not rendering an error state; Playwright nightly) and
      a /api/v1/health/ui RED flag reusing Phase 821a's Ok/Empty/Unavailable
      model — EMPTY must never read RED or a quiet system reports itself broken.
      The same endpoint serves operator, Prometheus alert and CI assertion, and
      must be proven to go RED by deliberately breaking a panel. Journey tiering
      is explicit about cost: T2 (every PR) is J1/J2/J8 — enforcement works,
      first deploy harms nobody, degradation fails open."

  825:
    name: "Migrate Promtail to Grafana Alloy (cAdvisor stays)"
    status: PROPOSED
    action_plan: docs/phases/PHASE_825.md
    dependencies: []
    size: MEDIUM
    summary: "PROPOSED 2026-08-16, rescoped 2026-08-17. Originally 'cut cAdvisor
      and Promtail' justified as 59 -> ~30 exceptions; investigating the blast
      radius changed both halves. cAdvisor STAYS: removing it would take four
      alerts (ContainerOOMKilled, ContainerRestartLoop, ContainerMemoryHigh,
      ContainerCPUThrottleHigh), two recording rules and the Container
      Drill-Down row. ContainerOOMKilled decided it — an OOM-killed proxy fails
      CLOSED for the connections it was serving, the expensive direction under
      the core asymmetry, and nothing else reports it (node-exporter is
      host-level; the console heartbeat answers 'up now', not 'was killed').
      Promtail migrates rather than being removed: it is EOL and Alloy, its
      supported successor, scans 6 vs 29 — and removal would have destroyed log
      search, since no shipper means Loki has nothing to serve. CRITICALLY, the
      saving is 59 -> 58, not 59 -> 30: promtail is the sole carrier of only 2
      exceptions (27 of its 29 are shared with cAdvisor/Alertmanager, which
      stay) and Alloy ADDS CVE-2026-71556. Approve this as 'replace an EOL
      component', not 'reduce exceptions' — the churn lever is Grafana +
      Alertmanager, blocked on 821a/b. Main risk is config translation (YAML ->
      River), not the image swap: a silent error stops log delivery and an empty
      Loki looks identical to a quiet system, so the acceptance test asserts a
      marker line ARRIVES with labels intact, not that the container is Up."
