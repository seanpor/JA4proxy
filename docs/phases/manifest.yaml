  814f:
    name: "Pentest: supply chain and CI/CD (fork-based, de-escalation ladder)"
    status: PROPOSED
    action_plan: docs/phases/PHASE_814.md
    dependencies: [814b]
    size: LARGE
    summary: "Stage 1, largest never-tested surface — and it grew in Phase 812.
      Fork-only under the de-escalation ladder (L0 static review first, stop at
