  814:
    name: "Full-Spectrum Penetration Testing Programme (umbrella)"
    status: PROPOSED
    action_plan: docs/phases/PHASE_814.md
    dependencies: []
    size: XLARGE
    summary: "PROPOSED, owner-approved 2026-08-04. Converts ad-hoc pentest
      campaigns into a durable programme: written rules of engagement with a
      de-escalation ladder for untested blast radius, an isolated egress-free
      test range, a generated + drift-checked attack-surface inventory,
      methodology mapped to PTES/NIST 800-115/OWASP WSTG+ASVS/API Top 10/CI-CD
      Top 10/ATT&CK/CIS/SLSA, and a three-pass find-fix-audit model. Motivated
      by the last full campaign being 2026-04-16 (stale against the Python-proxy
      deletion, Phase 500, the Go TAP sensor, 515/516, 520/521, 813, and the
      net-new Phase 812 pull_request_target CI surface) and by roughly a third
      of the shipped surface never having been adversarially tested at all.
      Three owner-mandated properties: every finding is written as a
      junior-implementable fix specification with the complete ripple file list
      (section 8); every fix ships a verification script with a mandatory
      two-state proof, fails pre-fix and passes post-fix, machine-checked
      against the fix commit's parent (section 9); every fix then goes through
      an independent third pass by neither the tester nor the implementer, which
      re-runs the ORIGINAL attack and hunts for regressions the fix introduced
      and for the same or adjacent bugs nearby (section 10). Broken into 19
      ordered sub-phases 814a-814s across four stages: foundation, assessment,
      remediation, assurance. Two additions after review: 814c re-verifies the
      92 findings sitting at FIXED that have never been independently VERIFIED
      (no regression test has ever been shown to fail on revert), run BEFORE
      new-bug hunting; and 814g tests the agent instruction surface, since this
      repo is built by an autonomous agent fleet with commit access that reads
      CLAUDE.md/AGENTS.md/phase docs every session. The durable method lives in
      docs/security/pentest/PROGRAMME.md so it outlives this phase doc; the
      recurring timetable lives in docs/reference/MAINTENANCE_CALENDAR.md.
      Absorbs Phase 523."
  814a:
