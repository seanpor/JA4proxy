    summary: 'DELIVERED. Re-based the four CVE-bearing first-party Python images (analytics, tarpit, test, trafficgen) onto a single digest-pinned python:3.14.6-alpine3.24 base — clearing the Debian no-fix distro HIGH on test/trafficgen by changing the base rather than waiving it, and refreshing the alpine pair to a current openssl. Dropped the dead proxy.py reference from Dockerfile.test (archived Phase 128) and switched its coverage target to --cov=src. Flipped scan-first-party to gate on HIGH+CRITICAL and made it actually build the profile-gated test/trafficgen images so they are scanned (previously a vacuous pass); test_ci_flow asserts the gate. All six first-party images verified scanning 0 HIGH/CRITICAL. admin/management (Debian slim, FastAPI) stay out of the first-party gate, their no-fix distro CVEs waiver-tracked. Honest rules from 314 held: no image excluded to green the gate. Original PROPOSED scope follows for history. Direct follow-up to PHASE_314: deliver the deferred first-party HIGH gate. 314 found the first-party images split three ways — the Go images (ja4proxy, mockbackend) are HIGH-clean (already golang:1.26.4-alpine); the alpine images (analytics, tarpit) carry a FIXABLE openssl HIGH (rebuild on alpine openssl >=3.5.7-r0); the Debian python:3.14-slim images (test, trafficgen, + out-of-gate management/admin which also carry no-fix CRITICAL perl CVEs) carry NO-FIX distro HIGH that can only be cleared by changing the base. Plan: (1) rebuild the alpine images on a current base; (2) re-base the Debian Python images onto a slim/low-CVE base (alpine-musl or Chainguard/Wolfi/distroless — pick one, validate Python wheel + healthcheck/entrypoint compatibility, the main effort sink); (3) flip scan-first-party to gate on HIGH+CRITICAL once a clean scan is proven in CI; (4) update test_ci_flow to assert the first-party HIGH gate; (5) tick the PHASE_313 first-party HIGH-gate box. Honest rules carried from 314: do NOT exclude images to green the gate; any residual is a dated/justified .trivyignore entry, not a blanket suppression. Third-party HIGH stays out of scope (upstream-dependent, waiver-tracked). PROPOSED — no code until approved.'
  315:
    name: Go Backup / Restore Subsystem (index)
    status: COMPLETE
    completed: 2026-06-13
    action_plan: docs/phases/complete/PHASE_315.md
    size: MEDIUM
    summary: 'DELIVERED. Resurrected Go Backup/Restore work (originally drafted as Phase 313 before 313/314 were repurposed). Built as the internal/backup package across two sub-phases: 315a (ja4p backup — native per-key DUMP/PTTL, AES-256-GCM + PBKDF2, atomic write, retention, lock, paced SCAN; 4 ja4proxy_backup_* metrics) and 315b (ja4p restore — selective GDPR-erasure-aware: allow-state by default, block-state only with --include-blocks, live-erasure-log + --tombstone-file tombstone check read pre-flush, integrity fail-closed, audited, locked; 3 ja4proxy_restore_* metrics + skipped). Together they revive the previously-dead backup.rules.yml alert set by finally emitting its metrics. ADR-205/206, runbook docs/runbooks/backup_restore.md.'
  315a:
    name: Go Redis Backup Engine
    status: COMPLETE
    completed: 2026-06-13
    action_plan: docs/phases/complete/PHASE_315a.md
    dependencies: [231b]
    size: MEDIUM
    summary: 'Part 1 of 2 (backup) — DELIVERED. New internal/backup package: ja4p backup subcommand (grounding correction: ja4p cobra CLI, not the ja4pd daemon as the draft said) does native per-key DUMP + PTTL capture of the security-state Redis prefixes (excluding ephemeral + credential/session/MFA keys), gzip + AES-256-GCM at rest (PBKDF2-SHA256 key derivation, random 16B salt + 12B nonce, GCM-authenticated binary header so tamper/truncation fails closed), atomic 0600 temp+rename write in a 0700 dir, count/age retention pruning, backup:operation_lock (SET NX EX 600) against concurrent runs, paced pipelined SCAN to spare the Redis thread, and a backup inspect subcommand for offline metadata. Registered the 4 ja4proxy_backup_* Prometheus series (process registry + optional node-exporter textfile) reviving the dead backup.rules.yml alerts; renamed *_last_success_timestamp -> *_seconds per OBSERVABILITY_STANDARDS. Tests: crypto round-trip/wrong-key/tamper, scope+exclude, TTL capture, retention, metrics toggle, lock (miniredis); every-type + IPv6 real-Redis round-trip behind -tags integration (miniredis only DUMPs strings). ADR-205 + docs/runbooks/backup_restore.md + REDIS_SCHEMA attribution updated. DEFERRED to a follow-up (not blocking): the --sanitize PII redactor, a backup: config block (scope is documented defaults + flags today), schema-migrator, and textfile-collector deployment wiring in docker-compose.monitoring.yml. Restore is 315b.'
  315b:
    name: Go Redis Restore (selective, GDPR-aware)
    status: COMPLETE
    completed: 2026-06-13
    action_plan: docs/phases/complete/PHASE_315b.md
    dependencies: [315a]
    size: MEDIUM
    summary: 'Part 2 of 2 (restore — the dangerous half) — DELIVERED. ja4p restore (grounding correction: ja4p cobra CLI, not ja4pd) reads the 315a artifact (reusing DecryptPayload + the snapshot format + lock) and loads it back SAFELY: allow-state restored by default, block-state (ban/ban_cidr/ip:blacklist/ja4:blacklist/config:dial) only with explicit --include-blocks so a restore can never mass-re-block real users; GDPR tombstone check from the LIVE management:gdpr_erasure_log read BEFORE any --force FLUSHDB (which would destroy it) merged with an optional --tombstone-file, IPv4/IPv6-canonical subject extraction, so erased subjects are never resurrected; integrity-verified (GCM) fail-closed before any write; non-empty target needs --force; --dry-run side-effect-free; TTLs re-applied; schema downgrade-block; every restore audited to management:policy_audit + backup:last_restore/restored_from. Registers the 3 ja4proxy_restore_* series + _skipped_total{reason}, completing the backup.rules.yml alert set. Tests: classification (incl. IPv6), block-gating, GDPR skip via file AND live-log, dry-run, non-empty/force, tamper, schema-block, audit, metrics (miniredis); real-Redis round-trip + GDPR-not-resurrected behind -tags integration. ADR-206 + runbook restore section + REDIS_SCHEMA attribution. DEFERRED (non-safety): full schema-migrator registry, --prefix-map, post-restore smoke; config-divergence is a non-blocking WARN.'
