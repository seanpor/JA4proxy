    summary: 'REVISED after a fresh authoritative scan (2026-06-13) invalidated the original "bump every image to a fixed tag, then flip make scan to a blanket HIGH gate" plan. Reality: only 2 of 9 pinned third-party images are bump-fixable (alertmanager v0.32.1->v0.33.0, redis_exporter v1.84.0->v1.86.0 — both re-scanned CLEAN); the other 6 are ALREADY on their newest stable tag, carrying brand-new Go-stdlib CVEs (fixed only in Go 1.26.4, days old — upstream not rebuilt), distro openssl/gpgv patches, and 2 docker/docker CVEs with no upstream fix at all. A blanket HIGH gate would need ~6 images of .trivyignore residuals whose 14-day windows expire and flap the REQUIRED Security Scan gate red for every PR on CVEs we cannot fix. First-party is not uniformly clean either: Go images clean (already 1.26.4), alpine analytics/tarpit have a fixable openssl HIGH, but Debian python:3.14-slim test/trafficgen carry no-fix distro HIGH+CRITICAL. DECISION (user-approved): differentiated gate — hard HIGH+CRITICAL on Dockerfiles + our own Go toolchain; third-party stays CRITICAL-gated with HIGH reported + tracked in a dated waiver register (docs/security/THIRD_PARTY_CVE_WAIVERS.md), bumped-and-dropped as upstream ships fixes. THIS PR lands the 2 verified bumps (Makefile/compose/Ansible/DOCKER_IMAGES.md sync), the waiver register, the DOCKER_IMAGES.md drift fix, and the scan-images wording. DEFERRED to a follow-up: the first-party HIGH gate flip (needs alpine openssl rebuild + a slim/distroless base for the Debian Python images) and the third-party HIGH gate flip (needs upstream Go-1.26.4 rebuilds). PHASE_313 deferred HIGH-gate box stays open, annotated.'
