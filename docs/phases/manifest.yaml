  814r:
    name: "Pentest: independent fix-audit and adjacent-bug hunt (pass 3)"
    status: PROPOSED
    action_plan: docs/phases/PHASE_814.md
    dependencies: [814p]
    size: LARGE
    summary: "Stage 3, the owner-mandated third pass, run per remediation wave
      rather than once at the end. Auditor is neither the tester nor the
      implementer, and for agent runs means a fresh session with no inherited
      context — an agent reviewing its own fix will rationalise it. Four questions
      answered in writing for every fix: Q1 is it actually fixed (re-run the
      ORIGINAL attack from the spec, not the fixer's test, then vary it one step);
      Q2 did the fix break something (adversarial diff review for new error paths,
      nil derefs, lock ordering, hot-path allocation with the benchmark actually
      run, changed TTL/timeout/defaults, and above all any new FAIL-CLOSED
      behaviour, which is a candidate C-4 regression); Q3 is the same bug elsewhere
      (systemic grep for the class not the instance, recording the actual command
      AND its output, cross-language); Q4 is there a bug beside it (callers,
      callees, sibling branches, same lifecycle stage elsewhere). Q3/Q4 findings
      get their own canonical IDs and re-enter at Stage 2. Hard limit of two
      re-audit iterations per finding, then owner escalation and a formal
      accept-or-redesign decision."
  814s:
