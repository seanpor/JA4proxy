  515:
    name: "Decision-Cache Client Isolation & Asymmetric TTLs"
    status: COMPLETE
    completed: '2026-07-02'
    action_plan: docs/phases/complete/PHASE_515.md
    dependencies: []
    size: MEDIUM
    summary: "Fixed the Go proxy decision cache (internal/security/cache.go), which was
      keyed on the JA4 fingerprint alone, cached IP-derived decisions, and had no TTL —
      contradicting ADR-003. Because a JA4 is shared across all clients on the same TLS
      stack, a block/ban from one IP was served to every client sharing that fingerprint
      (false positive: real browsers blocked, never self-healing) and an allow warmed by
      one client let an attacker bypass all per-IP controls (false negative). Fix: composite
      per-client key (clientIP|JA4) + asymmetric ALLOW/BLOCK TTLs enforced on read, per
      ADR-003; new hot-reloadable decision_cache config block. Registered JA4PROXY-2026-0087
      (HIGH). Second-pass review found and fixed JA4PROXY-2026-0088 (MEDIUM data race:
      processInternal/beaconingWorker read p.cfg and swappable modules unlocked while
      ReplaceConfig swapped them on hot reload — go test -race clean after a per-call config
      snapshot). Merged two external Hunter findings into the same phase and fixed them:
      JA4PROXY-2026-0090 (MEDIUM — beaconing/audit workers started at construction leaked
      goroutines per Pipeline; moved to StartBackgroundWorkers with ctx cancellation) and
      JA4PROXY-2026-0091 (LOW — nil-Ranger crash class in BlocklistManager.Check; read-side
      guard added, write-side already present). Registered and deferred JA4PROXY-2026-0089
      (hot-reload orphans async enrichment workers) to Phase 517."
