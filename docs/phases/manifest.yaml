  813:
    name: "Redis ACL authentication fix (production-impacting)"
    status: COMPLETE
    action_plan: docs/phases/complete/PHASE_813.md
    dependencies: []
    size: MEDIUM
    summary: "COMPLETE. Merged to main (PR #391, 2026-08-04). Discovered
      while investigating a Nightly Benchmark failure: docker-compose.poc.yml
      and docker-compose.prod.yml's redis service passed the invalid
      --requirepass-file directive (crash-loops the container);
      config/redis_acl.conf was bind-mounted read-only with unrendered
      ${VAR} placeholders (Redis ACL files don't support shell
      substitution); scripts/start-poc.sh never generated
      MANAGEMENT_REDIS_PASSWORD or JA4TAP_REDIS_PASSWORD; the Go proxy
      itself authenticated as the deliberately-disabled default user. Fixed
      with a rendering entrypoint script (deploy/docker/redis-entrypoint.sh),
      a new 'proxy' ACL user, corrected secrets wiring in both compose
      files, and start-poc.sh additions. Four more bugs found only by
      actually running the fix end-to-end: Docker Compose's secrets
      uid/gid/mode fields are swarm-only and silently ignored (fixed with
      cap_add: DAC_OVERRIDE instead); Redis's --aclfile parser rejects
      # comments entirely; +@read/+@write don't imply +ping;
      docker-compose.prod.yml's proxy service never bridged its secret
      file into REDIS_PASSWORD at all. Verified end-to-end via
      scripts/start-poc.sh in a scratch worktree and direct redis-cli auth
      per ACL user. Unblocks Phase 812's 812-A."
  812:
