      inversion (kill DNS/AbuseIPDB/RDAP/Redis/feeds and observe the DECISION,
      not the log — any fail-closed path is C-4); measured browser FP exposure
      at dial=100 against the Tranco corpus; and whether dial=0 is genuinely
      non-blocking on every path including bypass BLOCKs, the 0094 hard-block
      path and ban expiry."
  814e:
    name: "Pentest: Management API and UI (WSTG / ASVS L2 / API Top 10)"
