      actions/cache poisoning, auto-merge scope, action-pin integrity, SLSA
      provenance verification against a DELIBERATELY TAMPERED artefact, SBOM
      completeness, image signing, dependency confusion, and the release path."
  814g:
    name: "Pentest: agent instruction surface (prompt injection into the dev pipeline)"
    status: PROPOSED
    action_plan: docs/phases/PHASE_814.md
    dependencies: [814b]
    size: MEDIUM
    summary: "Stage 1, novel and specific to how this project is built. The repo
      is developed by an autonomous multi-agent fleet WITH COMMIT ACCESS,
      alongside a pull_request_target workflow holding contents: write. Agents
      are instructed to read CLAUDE.md, AGENTS.md, docs/phases/* and the findings
      register every session, and encounter PR titles, issue bodies, commit
      messages and code comments while working — making those an injection
      surface. Where 814f asks whether a PR can influence the SCRIPT, this asks
      whether a PR can influence the AGENT. Questions: can a PR editing
      AGENTS.md/CLAUDE.md/a phase doc change a later agent session's behaviour,
      and would review catch it; can instructions planted in a file an agent is
      likely to read (test fixture, doc, code comment, findings.yaml notes
      field) redirect it toward exfiltrating a secret, weakening a check or
      approving its own work; does any agent-invoked automation consume
      untrusted text as INSTRUCTION rather than DATA; what credentials and
      permissions does an agent session actually hold; and would any audit trail
      show a hostile instruction afterwards. Maps to OWASP LLM01. Deliverable
      is a written agent trust-boundary model plus least-privilege and
      instruction-file provenance recommendations."
  814h:
    name: "Pentest: TLS/JA4 parser and protocol fuzzing"
    status: PROPOSED
    action_plan: docs/phases/PHASE_814.md
    dependencies: [814b]
    size: LARGE
    summary: "Stage 1. Record fragmentation across TCP segments and TLS records,
      malformed extension lengths, duplicate extensions, GREASE, ECH, SNI edge
      cases (empty/IDN/NUL/over-long/mixed-case), zero-RTT and resumption,
      reassembly-cap envelope, and the unsafe.String zero-copy in
      internal/tls/parser.go (F-400-01 accepted risk — prove or disprove). Key
      cross-feed to 814d: JA4 canonicalisation collisions, i.e. can two different
      clients be made to share a fingerprint so that blocking one blocks the
      other — an FP weapon. Extends the existing Go fuzz targets with
      structure-aware corpora and differential testing against a reference TLS
      library."
  814i:
    name: "Pentest: network and DMZ edge"
    status: PROPOSED
    action_plan: docs/phases/PHASE_814.md
    dependencies: [814b]
    size: MEDIUM
    summary: "Stage 1. Re-tests from scratch against Go what the 2026-04-16
      campaign found in the Python era (PROXY smuggling L1-018, fragmentation
      bypass L1-019). Direct-to-ja4pd reachability bypassing HAProxy; PROXY
      header spoofing/doubling/smuggling with an internal dst; XFF vs PROXY
      precedence; trusted-CIDR correctness for IPv6, IPv4-mapped-IPv6 and
      zone-scoped addresses; DMZ scanning via the backend; RST/timeout oracles
      distinguishing blocked from backend-down; and whether ANY path reaches the
