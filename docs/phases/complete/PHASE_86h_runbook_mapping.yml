# PHASE_86h_runbook_mapping.yml
# Maps alert name -> runbook filename (relative to docs/runbooks/).
# Used by scripts/fix_runbook_urls.py to rewrite the runbook_url annotation
# on every alert rule in monitoring/alertmanager/rules/*.yml to the canonical
# format: https://github.com/seanpor/JA4proxy/blob/main/docs/runbooks/<file>.md
#
# Format: <AlertName>: <runbook_filename.md>
#
# Every alert in every rule file MUST have an entry here. If a best-fitting
# runbook does not yet exist, a short STUB was created in Phase 86h Step 3
# rather than pointing at a generic incident runbook.

