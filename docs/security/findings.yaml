# JA4proxy Canonical Findings Register
#
# Source of truth for every security finding across all pentest campaigns, red
# team reports, and audits. Generated human-readable view lives in
# docs/security/FINDINGS_REGISTER.md — regenerate with:
#
#     python3 scripts/findings_register.py render
#
# DO NOT edit this file by hand. Use the CLI:
#
#     python3 scripts/findings_register.py validate
#     python3 scripts/findings_register.py list [--status=OPEN] [--severity=HIGH] [--sla-breach]
#     python3 scripts/findings_register.py add --source=PHASE_118 --source-id=118a-01 \
#         --title="..." --severity=HIGH --cvss="CVSS:3.1/AV:N/..." --discovered=2026-04-17
#         # `add` opens a GitHub issue automatically.
#         # --no-issue: skip creation (offline/CI).
#         # --issue N:  link an existing issue instead (e.g. externally-opened reports).
#     python3 scripts/findings_register.py dedup-hint "PROXY protocol spoofing"
#     python3 scripts/findings_register.py promote-verified
#     python3 scripts/findings_register.py sync-issues [--dry-run] [--report-missing]
#         # Reconcile github_issue state with status (closes/reopens issues as needed).
#
# Schema (see docs/security/FINDINGS_REGISTER.md for full definitions):
#
#   id                  JA4PROXY-YYYY-NNNN   (allocated by `add`, never reused)
#   title               short human title
#   severity            CRITICAL | HIGH | MEDIUM | LOW     (per SEVERITY_RUBRIC.md)
#   severity_rationale  which rubric clause this was classified under
#   cvss_v3_1:
#     score             float 0.0–10.0
#     vector            "CVSS:3.1/..."
#   source_refs:        list of {report, id, discovered}
#     - report          PHASE_108 | PHASE_118 | RED_TEAM_AUDIT | WHITEBOX_2026_04_17 | ...
#       id              original local ID as it appears in the source doc
#       discovered      ISO date the source recorded the finding
#   remediation_phases  list of phase IDs that will fix it, e.g. [118a, 109]
#   owner               GitHub handle, including @
#   lane                go-proxy | python-management | infrastructure     (see OWNERSHIP.md)
#   discovered          earliest discovered date across source_refs
#   due                 ISO date derived from discovered + SLA window
#   status              OPEN | IN_PROGRESS | FIXED | VERIFIED | CLOSED | DUPLICATE
#   supersedes          list of canonical IDs this one subsumes (only on DUPLICATE)
#   depends_on          list of canonical IDs that must be fixed first
#   regression_test     pytest nodeid or go test path, required once status ≥ FIXED
#   closed_commit       git SHA of the merge that moved status to CLOSED
#   github_issue        GitHub issue number (integer) — set automatically by `add`
#   notes               free-text, optional


