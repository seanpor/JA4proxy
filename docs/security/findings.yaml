  cvss_v3_1:
    score: 7.5
    vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N
  description: 'reassembleClientHello in cmd/ja4pd/main.go uses hardCap=16640 to limit the first TLS record
    read, but the fragmentation loop can append additional record bodies, growing data beyond 16384 bytes.
    The header update at line 832 writes the total reassembled body length into the record header, but
    ParseClientHello rejects records with recordLen>16384. The connection then proceeds without JA4 fingerprinting
    (fail-open), bypassing all JA4-based security controls including protocol lockdown, scoring, and tarpitting.

    '
  impact: 'An attacker can fragment a ClientHello across multiple TLS records such that the total reassembled
    body exceeds 16384 bytes. The proxy fails to compute a JA4 fingerprint, causing the connection to
    be scored without JA4 context. This bypasses protocol lockdown (JA4PROXY-2026-0011), JA4-based allow/deny
    lists, and any security policy that depends on the JA4 fingerprint. The attacker''s connection proceeds
    as if it were an unknown client.

    '
  notes: 'Root cause: hardCap=16640 in reassembleClientHello allows data to exceed the TLS record maximum
    (16384). Parser rejects the oversized record, connection proceeds without JA4. Attacker fragments
    ClientHello across multiple records to trigger.'
