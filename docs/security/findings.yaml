- id: JA4PROXY-2026-0087
  title: Decision cache keyed on shared JA4 leaks per-IP decisions across clients (no TTL)
  severity: HIGH
  severity_rationale: 'H (CWE-807/CWE-524). DecisionCache is keyed on the JA4 fingerprint alone, which
    is shared by all clients using the same TLS stack, and has no TTL. A block/ban derived from one IP
    is served to every other client sharing that JA4 (false positive: real browsers blocked, never self-healing
    without TTL); an allow warmed by one client lets an attacker with the same ClientHello bypass all
    per-IP controls incl. ban:{ip} (false negative). Contradicts ADR-003 (per-client cache, asymmetric
    TTLs).'
