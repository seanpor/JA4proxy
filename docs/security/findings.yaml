- id: JA4PROXY-2026-0089
  title: "Hot config reload orphans async enrichment workers (DNS/AbuseIPDB/RDAP/feed) \u2014 enrichment\
    \ silently degrades after SIGHUP"
  severity: MEDIUM
  severity_rationale: M (CWE-404 improper resource shutdown/release + reload lifecycle). StartBackgroundWorkers
    starts DNSEnrichment/AbuseIPDB/RDAP/FeedDownloader workers ONCE at startup on the original module
    instances. ReplaceConfig (SIGHUP / pub/sub reload) replaces each module with a fresh NewX instance
    but never Start()s its workers and never cancels the old ones. After any reload, processInternal enqueues
    to the new instances whose drain goroutines never run; their bounded queues fill and enqueues drop
    silently (DNSEnrichmentQueueDropsTotal), and periodic blocklist-feed refresh stops. Fail-open (enrichment
    merely stops contributing signals), but detection quietly weakens after the first reload. Enqueue
    is non-blocking, so no hot-path stall.
