  - 118a
  discovered: '2026-04-17'
  due: '2026-04-24'
  status: FIXED
  supersedes: []
  depends_on: []
  regression_test: cmd/ja4pd/pentest_goroutine_leak_regression_test.go::TestRegression_JA4PROXY_2026_0009_ForwardDoesNotLeakGoroutines
  closed_commit: e2e963b
  description: Both forward() and tarpit() spawn two goroutines for bidirectional copy but only receive
    from done channel once. The second goroutine leaks, holding its buffer indefinitely. At 100 conn/s
    sustained, this is ~69MB/hour of permanently leaked memory. Under attack load, OOM kill within hours.
    Each connection leak is ~8KB stack + buffer.
  notes: 'Simple fix: change `<-done` to `<-done; <-done` in both functions, or use sync.WaitGroup.'
