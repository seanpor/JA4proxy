  supersedes: []
  depends_on: []
  regression_test: cmd/ja4pd/pentest_proxy_parser_regression_test.go::TestRegression_JA4PROXY_2026_0001_StripsUntrustedHeader
  closed_commit: c54369ddb8fc1e825946c6ded6ecc64aeb2f82b6
  description: If a source IP is not in trusted_cidrs, the PROXY protocol v1/v2 header is currently ignored
    but left in the data buffer. This "leaks" the attacker's header to the backend, which may trust it.
    Attacker-controlled IP and port fields can be spoofed, bypassing source IP validation and enabling
    internal SSRF-style attacks.
  notes: Phase 109a (scrubbing) and Phase 116a (fail-closed) both address this. 109a strips untrusted
    headers; 116a enforces that trusted sources MUST provide valid headers.
