    buffer 256, non-blocking send with drop-on-full). Matches the existing beaconingJobs pattern.
- id: JA4PROXY-2026-0068
  title: forward() Copy Goroutines Read Config Without Lock
  severity: HIGH
  severity_rationale: H-2 (data race under Go memory model). The cp closure captures the proxy receiver
    and reads p.cfg.Proxy.ReadTimeout/WriteTimeout without holding p.mu.RLock(). Concurrent reload() can
    swap p.cfg mid-copy.
  source_refs:
  - report: PHASE_500
    id: 500b-02
    discovered: '2026-06-22'
  remediation_phases:
  - 500b
  owner: '@seanpor'
  lane: go-proxy
  discovered: '2026-06-22'
  due: '2026-07-22'
  status: FIXED
  supersedes: []
  depends_on: []
  regression_test: cmd/ja4pd/pentest_forward_config_local_capture_test.go::TestForward_ConfigLocalCapture
  closed_commit: ''
  cvss_v3_1:
    score: 7.5
    vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N
  description: 'main.go:920-940 defines a cp closure inside forward() that reads p.cfg.Proxy.ReadTimeout
    and p.cfg.Proxy.WriteTimeout at lines 926 and 929 through the proxy receiver, without holding p.mu.RLock().
    The forward() function captures a local cfg at line 844 under RLock, but the cp closure captures p
    (the proxy) and re-reads p.cfg directly. A concurrent reload() that swaps p.cfg can cause the goroutine
    to read a partially-constructed config.

    '
  impact: 'Under concurrent config reload, the copy-loop goroutine may read stale or partially-initialized
    timeout values, potentially causing connections to hang indefinitely (zero timeout) or timeout prematurely.

    '
  notes: Fixed by changing p.cfg.Proxy.ReadTimeout to cfg.Proxy.ReadTimeout in the cp closure, using the
    local cfg variable already captured under RLock at line 844.
