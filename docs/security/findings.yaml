  title: PROXY Protocol v2 Spoofing from Untrusted Source
  severity: CRITICAL
  severity_rationale: C-4 (could block legitimate traffic via fail-closed config); also bypass of IP-based
    security decisions). CVSS v3.1 rates this 9.1; consistent with rubric.
  lane: go-proxy
  owner: '@seanpor'
