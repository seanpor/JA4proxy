  closed_commit: c54369ddb8fc1e825946c6ded6ecc64aeb2f82b6
  description: After the proxy strips the legitimate PROXY protocol header from a trusted source, an attacker
    can inject a second PROXY header immediately following the first. The proxy forwards this injected
    header to the backend, which may trust it and use the attacker-specified src/dst IP and port values
    to route internal requests. This enables DMZ scanning and pivoting to internal services.
  notes: 118a specifies the anti-smuggling check (detect second header after strip); 117a is the second-layer
    hardening.
