    unsafeString for the synchronous callers. Discovered in phase-519 remote-exploitability hunt.'
- id: JA4PROXY-2026-0093
  title: Security escape-hatches (TEST_MODE hardcoded JWT secret, CSRF disable, SAML strict-off) fail
    open when ENVIRONMENT is not exactly 'production'
  severity: HIGH
  severity_rationale: "H (CWE-1188 insecure default + CWE-636 fail-open). _is_production() returns True\
    \ ONLY for ENVIRONMENT in {production,prod}; every test-mode escape hatch and its startup guard gate\
    \ on it, so ENVIRONMENT unset / 'staging' / 'dmz' is treated as non-production. is_test_mode() then\
    \ activates on MANAGEMENT_TEST_MODE=1 alone, and _get_secret_key() falls back to the PUBLIC hardcoded\
    \ 'test-secret-do-not-use-in-production' (plus OIDC signature verification is skipped) \u2014 an attacker\
    \ who sets/knows these can forge admin JWTs. The startup guard _enforce_no_test_mode_in_production()\
    \ does NOT fire because _is_production() is False. Same fail-open affects MANAGEMENT_DISABLE_CSRF\
    \ and MANAGEMENT_SAML_STRICT=false. JA4proxy's core use case is a DMZ appliance where ENVIRONMENT\
    \ is plausibly unset or 'dmz'. Requires an operator/image to carry a test flag, but the fail-open-on-unknown-ENVIRONMENT\
    \ turns a common misconfig into an auth/CSRF/SAML bypass on an internet-facing service."
  source_refs:
