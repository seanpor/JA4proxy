  - 108d
  discovered: '2026-04-09'
  due: '2026-04-16'
  status: FIXED
  supersedes: []
  depends_on: []
  regression_test: cmd/ja4pd/pentest_tls_evasion_regression_test.go::TestRegression_JA4PROXY_2026_0003_FragmentedClientHelloIsReassembled
  closed_commit: a78638f960ef547f26f1692442659bdb7a99faec
  description: The Go proxy performs a single Read() into 8KB buffer. If the TLS ClientHello is fragmented
    across TCP packets, the first packet may contain only a partial record; tlsparse.ParseClientHello
    returns ErrTruncated. The proxy falls through to forward() action without computing a JA4 fingerprint.
    Attacker completely bypasses all JA4-based blocklists and rate limiting. RT-002 additionally shows
    that after PROXY header stripping, the check uses the stale `n` variable instead of `len(data)`, creating
    a second variant that works even with a single TCP segment.
  notes: Phase 118b implements reassembly loop and protocol lockdown. RT-002 bug (n vs len(data)) is a
    separate fix on same line.
- id: JA4PROXY-2026-0004
  title: ALPN Browser Bypass Trusts Attacker-Controlled Signal
  severity: CRITICAL
  severity_rationale: C-4 (skips entire security pipeline based on client-controlled TLS field). CVSS
    v3.1 rates this 9.8; consistent. Design flaw, not a code bug.
  lane: go-proxy
  owner: '@seanpor'
  cvss_v3_1:
    score: 9.8
    vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N
  source_refs:
  - report: PHASE_119
    id: 119a
    discovered: '2026-04-17'
  - report: PHASE_120
    id: 120a
    discovered: '2026-04-17'
  remediation_phases:
  - 119a
  discovered: '2026-04-17'
  due: '2026-04-24'
  status: FIXED
  supersedes: []
  depends_on: []
  regression_test: cmd/ja4pd/pentest_tls_evasion_regression_test.go::TestRegression_JA4PROXY_2026_0004_ALPNBypassDefaultDisabled
  closed_commit: a78638f960ef547f26f1692442659bdb7a99faec
  description: The ALPNBrowserBypass feature (enabled by default in config/proxy.yml) grants immediate
    ALLOW to any connection whose first ALPN protocol is h2 or h1. ALPN is an attacker-controlled plaintext
    field in the ClientHello. Any bot, scanner, or tool can set ALPN=h2 and bypass JA4 blocklists, rate
    limiting, geo-blocking, risk scoring, and the entire security pipeline. This is the proxy's single
    biggest design flaw.
  notes: "Phase 119a offers three fix options: (1) downgrade to signal not bypass, (2) correlate ALPN\
    \ with other ClientHello features before granting bypass, (3) disable bypass by default. No obvious\
    \ single 'correct' fix \u2014 requires architectural decision."
- id: JA4PROXY-2026-0005
  title: X-JA4-Fingerprint HTTP Header Injection Bypass
  severity: CRITICAL
  severity_rationale: C-4 (complete security bypass via attacker-controlled header). CVSS v3.1 rates this
    9.8; consistent.
  lane: go-proxy
  owner: '@seanpor'
  cvss_v3_1:
    score: 9.8
    vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N
  source_refs:
  - report: PHASE_119
    id: 119b
    discovered: '2026-04-17'
  - report: PHASE_120
    id: 120b
    discovered: '2026-04-17'
  remediation_phases:
  - 119b
  discovered: '2026-04-17'
  due: '2026-04-24'
  status: FIXED
  supersedes: []
  depends_on: []
  regression_test: cmd/ja4pd/pentest_tls_protocol_lockdown_regression_test.go::TestRegression_JA4PROXY_2026_0011_non_tls_first_byte_is_dropped
  closed_commit: a78638f960ef547f26f1692442659bdb7a99faec
  description: 'When non-TLS traffic arrives at the proxy port, _extract_ja4_from_http() reads an X-JA4-Fingerprint
    HTTP header and uses its value directly as the connection''s JA4 with zero validation. Attacker sends
    plain HTTP with X-JA4-Fingerprint: t13d1516h2_8daaf6152771_02713d6af862 (whitelisted fingerprint).
    The proxy treats this as a Chrome connection, applies whitelist bypass, and forwards traffic with
    ALLOW status. Complete security bypass.'
  notes: "The function comment says 'testing/fallback' but is called unconditionally for all non-TLS data.\
    \ Phase 119b recommends removal or gating behind disabled-by-default flag. Go reclassification (Phase\
    \ 309 R1) \u2014 the Go proxy never parses HTTP headers; TLS protocol lockdown drops any non-TLS first\
    \ byte, so an X-JA4 HTTP header can never reach the scorer. The class of bug is architecturally impossible\
    \ in Go; guarded behaviourally by the 0011 lockdown test."
