- id: JA4PROXY-2026-0094
  title: Manual ban (ban:{ip}) and Spamhaus blocklist bypassed when the async scoring queue (workChan)
    is saturated
  severity: MEDIUM
  severity_rationale: "M (CWE-636 fail-open under resource exhaustion). Pipeline.Process runs checkHardBlocks\
    \ synchronously (JA4/JA4X/country/dynamic-CIDR blacklists) but the operator manual ban (Redis ban:{ip})\
    \ and the Spamhaus DROP/EDROP blocklist are evaluated ONLY inside processInternal, which in async\
    \ mode (production default) runs on workChan. When workChan is full (20000 buffer, 32 workers) Process\
    \ hits the select default, increments WorkChanDroppedTotal, returns {allow,0}, and handleConn FORWARDS\
    \ the connection to the backend without ever checking ban:{ip} or Spamhaus. An attacker who sustains\
    \ enough load to saturate the queue can slip a banned or Spamhaus-listed IP through \u2014 the two\
    \ hard blocks operators most expect to always hold. Fail-open is the project philosophy for scoring,\
    \ but these are documented HARD blocks."
  source_refs:
  - report: PHASE_520
    id: 520-01
    discovered: '2026-07-02'
