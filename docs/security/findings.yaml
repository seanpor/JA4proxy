  cvss_v3_1:
    score: 7.5
    vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
  description: 'pipeline.go:548 spawns an unbounded fire-and-forget goroutine (go p.auditDecision(...))
    for every connection with TotalScore > 0. Each goroutine makes two Redis calls (GET + SET). Under
    load with a slow or partitioned Redis, goroutines pile up without bound, consuming memory and eventually
    causing OOM.

    '
