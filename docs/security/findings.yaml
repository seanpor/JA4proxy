- id: JA4PROXY-2026-0009
  title: Goroutine Leak in forward() and tarpit()
  severity: CRITICAL
  severity_rationale: C-4 (memory exhaustion OOM causes proxy to block legitimate traffic). CVSS v3.1
    rates this 8.6.
  lane: go-proxy
  owner: '@seanpor'
  cvss_v3_1:
