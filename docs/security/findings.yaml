  regression_test: tests/unit/test_proxy_server.py::TestAnalyzeTlsHandshake::test_regression_JA4PROXY_2026_0005_non_tls_http_ja4_header_ignored
  closed_commit: a78638f960ef547f26f1692442659bdb7a99faec
  description: 'When non-TLS traffic arrives at the proxy port, _extract_ja4_from_http() reads an X-JA4-Fingerprint
    HTTP header and uses its value directly as the connection''s JA4 with zero validation. Attacker sends
    plain HTTP with X-JA4-Fingerprint: t13d1516h2_8daaf6152771_02713d6af862 (whitelisted fingerprint).
    The proxy treats this as a Chrome connection, applies whitelist bypass, and forwards traffic with
    ALLOW status. Complete security bypass.'
  notes: The function comment says 'testing/fallback' but is called unconditionally for all non-TLS data.
    Phase 119b recommends removal or gating behind disabled-by-default flag.
