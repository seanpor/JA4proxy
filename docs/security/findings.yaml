- id: JA4PROXY-2026-0088
  title: 'Data race: processInternal reads p.cfg and sub-analyzers unlocked while ReplaceConfig swaps
    them on hot reload'
  severity: MEDIUM
  severity_rationale: M (CWE-362 race condition). Pipeline.ReplaceConfig (SIGHUP / pub/sub config reload)
    reassigns p.cfg and every signal-module pointer under p.mu.Lock(), but the async scoring path (processInternal)
