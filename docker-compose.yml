# JA4proxy — Quick Start
#
# 3 containers: proxy + Redis + dashboard. Designed for emergency deployment
# and evaluation.
#
# Usage:
#   BACKEND_HOST=your-server.com docker compose up -d
#
# The proxy listens on port 8443 (no root required) and forwards TLS
# connections to BACKEND_HOST:443. It starts in monitor mode (dial=0):
# scores everything, blocks nothing.
#
# Dashboard: http://localhost:8090 (admin / changeme — change in production!)
#
# For the full multi-container stack with HAProxy, monitoring, and analytics:
#   docker compose -f deploy/docker/docker-compose.poc.yml up -d
#
# Docs: docs/operations/EMERGENCY_DEPLOY.md

services:
  ja4proxy:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.go-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8443}:8443"
      - "127.0.0.1:9090:9090"
    depends_on:
      - redis
    volumes:
      - ./config:/app/config:ro
    environment:
      - CONFIG_PATH=/app/config/proxy.minimal.yml
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - BACKEND_HOST=${BACKEND_HOST:?Set BACKEND_HOST to your backend server}
      - BACKEND_PORT=${BACKEND_PORT:-443}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=10M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  management:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.management
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MANAGEMENT_PORT:-8090}:8090"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - MANAGEMENT_JWT_SECRET=${MANAGEMENT_JWT_SECRET:-ja4proxy-quickstart-secret-change-me}
      - MANAGEMENT_ADMIN_USER=${MANAGEMENT_ADMIN_USER:-admin}
      - MANAGEMENT_ADMIN_PASSWORD=${MANAGEMENT_ADMIN_PASSWORD:-changeme}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=10M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data:size=256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
