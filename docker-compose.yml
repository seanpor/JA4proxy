# JA4proxy — Minimal Quick Start
#
# 2 containers: proxy + Redis. No HAProxy, no monitoring, no analytics.
# Designed for emergency deployment and evaluation.
#
# Usage:
#   BACKEND_HOST=your-server.com docker compose up -d
#
# The proxy listens on port 8443 (no root required) and forwards TLS
# connections to BACKEND_HOST:443. It starts in monitor mode (dial=0):
# scores everything, blocks nothing.
#
# For the full multi-container stack with HAProxy, monitoring, and analytics:
#   docker compose -f deploy/docker/docker-compose.poc.yml up -d
#
# Docs: docs/operations/EMERGENCY_DEPLOY.md

services:
  ja4proxy:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.go-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8443}:8443"
      - "127.0.0.1:9090:9090"
    depends_on:
      - redis
    volumes:
      - ./config:/app/config:ro
    environment:
      - CONFIG_PATH=/app/config/proxy.minimal.yml
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - BACKEND_HOST=${BACKEND_HOST:?Set BACKEND_HOST to your backend server}
      - BACKEND_PORT=${BACKEND_PORT:-443}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=10M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data:size=256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
