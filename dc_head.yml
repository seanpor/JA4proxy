name: ja4proxy

services:
  haproxy:
    image: haproxy:2.8.26-alpine
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_INGRESS:-443}:443"
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_STATS:-8404}:8404"
    volumes:
      - ../../config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - proxy
    networks:
      - ja4proxy-dmz
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.go-proxy
      args:
        VERSION: ${VERSION:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: ja4proxy:2.0.0
    restart: unless-stopped
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_DIRECT:-8081}:8080"
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_METRICS:-9090}:9090"
    depends_on:
      - redis
    volumes:
      - ../../config:/app/config:ro
      - ../../data/geoip:/app/geoip:ro
    environment:
      - CONFIG_PATH=/app/config/proxy.yml
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - BACKEND_HOST=${BACKEND_HOST:-backend}
      - BACKEND_PORT=${BACKEND_PORT:-443}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JA4PROXY_TRACE=${JA4PROXY_TRACE:-false}
    networks:
      - ja4proxy-dmz
      - ja4proxy-data
      - ja4proxy-origin
      - ja4proxy-mgmt
    security_opt:
      - no-new-privileges:true
      # AppArmor profile (Phase 34d): must be loaded on host before enabling.
      # Load with: sudo apparmor_parser -r config/apparmor/ja4proxy
      # Then uncomment the line below:
      # - apparmor:ja4proxy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
      - /var/run:noexec,nosuid,nodev,size=10m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Non-root user: ja4proxy (set in docker/Dockerfile.go-proxy)
    cpuset: "${AGENT_CPU_SET:-0-15}"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '4.0'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    # No host port exposure — internal to ja4proxy-data only.
    # Tests use `docker exec` + redis-cli for state manipulation.
    restart: unless-stopped
    # Official redis:7.4.9-alpine passes extra flags as command args to redis-server
    # JA4PROXY-2026-0042: --unixsocketperm 770 (not 777). The socket lives
    # on a named Docker volume that is NOT mounted by any non-redis service
    # in this compose file, so tightening to 770 removes the world-writable
    # bit without breaking functionality. (If a future service mounts the
    # redis-sock volume, it MUST also add `group_add: ["999"]` — the redis
    # user's GID inside redis:7.4.9-alpine — or it will not be able to
    # connect.)
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --hz
      - "20"
      - --tcp-keepalive
      - "60"
      - --save
      - ""
      - --unixsocket
      - /var/run/redis/redis.sock
      - --unixsocketperm
      - "770"
    networks:
      - ja4proxy-data
    volumes:
      - redis-data:/data
      - redis-sock:/var/run/redis
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
      - /var/run:noexec,nosuid,nodev,size=10m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mockbackend
    image: ja4proxy-mockbackend:1.0.0
    restart: unless-stopped
    # No host port exposure — internal to ja4proxy-origin only
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - ja4proxy-origin
    security_opt:
      - no-new-privileges:true
    read_only: true
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JA4PROXY_TRACE=${JA4PROXY_TRACE:-false}
      - JA4PROXY_FORENSIC=${JA4PROXY_FORENSIC:-false}
    networks:
      - ja4proxy-dmz
      - ja4proxy-data
      - ja4proxy-origin
      - ja4proxy-mgmt
    cap_drop:
      - ALL
    # Non-root user set in docker/Dockerfile.mockbackend (USER backend)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
