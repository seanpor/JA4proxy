# Splunk savedsearches.conf — JA4proxy Technology Add-on
# Correlation search definitions for Splunk Enterprise Security.
# Each search is scheduled and generates notable events when the condition fires.
#
# Required: Splunk Enterprise Security 7.x or later for the `notable` command.
# Without ES, these can be used as standard scheduled alerts with email/webhook actions.

# ── 1. Beaconing Detected ────────────────────────────────────────────────────
[JA4proxy - Beaconing Detected]
action.notable                     = 1
action.notable.param.rule_name     = JA4proxy - Beaconing Detected
action.notable.param.rule_title    = JA4proxy Beaconing: $"source.ip"$ / $"ja4proxy.fingerprint.ja4"$
action.notable.param.security_domain = network
action.notable.param.severity      = high
action.notable.param.description   = JA4proxy detected beaconing behaviour — a client is connecting at highly regular intervals, characteristic of C2 check-in traffic.
action.notable.param.nes_fields    = source.ip,ja4proxy.fingerprint.ja4,host.name
cron_schedule                      = */5 * * * *
description                        = Detects when the analytics node has flagged a source IP for beaconing (periodic connection pattern with low inter-arrival time variance).
disabled                           = false
dispatch.earliest_time             = -10m
dispatch.latest_time               = now
enableSched                        = 1
realtime_schedule                  = 0
search                             = sourcetype=ja4proxy:telemetry "ja4proxy.signals{}.name"=beaconing_detected \
| stats count, max("event.risk_score") as max_score, values("ja4proxy.sni") as sni_list by "source.ip", "ja4proxy.fingerprint.ja4", "host.name" \
| where count >= 3 \
| eval alert_title="Beaconing: " + 'source.ip' + " (" + count + " events, score=" + max_score + ")"

# ── 2. New Fingerprint from Banned ASN ──────────────────────────────────────
[JA4proxy - New Fingerprint from Banned ASN]
action.notable                     = 1
action.notable.param.rule_name     = JA4proxy - New Fingerprint from Banned ASN
action.notable.param.rule_title    = New JA4 fingerprint from banned ASN $"ja4proxy.asn_org"$
action.notable.param.security_domain = network
action.notable.param.severity      = medium
action.notable.param.description   = A new JA4 fingerprint (not seen before from this ASN) has appeared from an ASN that has previously generated banned connections. This may indicate attacker tool rotation.
action.notable.param.nes_fields    = source.ip,ja4proxy.fingerprint.ja4,ja4proxy.asn_org
cron_schedule                      = */15 * * * *
description                        = Detects new TLS fingerprints emerging from ASNs that previously generated banned connections, which may indicate attacker tool or client rotation.
disabled                           = false
dispatch.earliest_time             = -30m
dispatch.latest_time               = now
enableSched                        = 1
realtime_schedule                  = 0
search                             = sourcetype=ja4proxy:telemetry \
| eval asn_org='ja4proxy.asn_org', ja4='ja4proxy.fingerprint.ja4', src='source.ip' \
| eventstats dc(ja4) as fp_count, values("event.action") as all_actions by asn_org \
| where match(mvjoin(all_actions, " "), "banned") \
| search "event.action"!=banned \
| eventstats dc(ja4) as new_fp_count by asn_org \
| where new_fp_count > fp_count - 1 \
| table _time, src, ja4, asn_org, "event.risk_score", "event.action"

# ── 3. Dial Threshold Crossed ────────────────────────────────────────────────
[JA4proxy - Dial Threshold Crossed]
action.notable                     = 1
action.notable.param.rule_name     = JA4proxy - Dial Threshold Crossed
action.notable.param.rule_title    = JA4proxy dial changed on $host.name$: $"ja4proxy.dial_setting"$
action.notable.param.security_domain = network
action.notable.param.severity      = medium
action.notable.param.description   = The JA4proxy blocking dial was changed outside a scheduled maintenance window. Unexpected dial increases could cause false positives for legitimate users; decreases could lower protection.
action.notable.param.nes_fields    = host.name,ja4proxy.dial_setting
cron_schedule                      = */5 * * * *
description                        = Alerts when the JA4proxy dial setting changes outside a defined maintenance window (09:00–11:00 UTC Mon–Fri).
disabled                           = false
dispatch.earliest_time             = -10m
dispatch.latest_time               = now
enableSched                        = 1
realtime_schedule                  = 0
search                             = sourcetype=ja4proxy:telemetry "event.action"=config_change "event.category{}"=configuration \
| streamstats current=true last("ja4proxy.dial_setting") as prev_dial by "host.name" \
| where "ja4proxy.dial_setting" != prev_dial \
| eval is_maintenance_window=if(date_wday!="saturday" AND date_wday!="sunday" AND date_hour>=9 AND date_hour<11, 1, 0) \
| where is_maintenance_window=0 \
| table _time, "host.name", prev_dial, "ja4proxy.dial_setting"

# ── 4. Burst of Blocks from Single /24 ──────────────────────────────────────
[JA4proxy - Burst of Blocks from Single /24]
action.notable                     = 1
action.notable.param.rule_name     = JA4proxy - Burst of Blocks from Single /24
action.notable.param.rule_title    = Block burst from subnet $subnet$: $block_count$ events
action.notable.param.security_domain = network
action.notable.param.severity      = high
action.notable.param.description   = More than 50 blocked connections from distinct IPs within the same /24 subnet in a 5-minute window. May indicate a coordinated scan or distributed attack from a compromised netblock.
action.notable.param.nes_fields    = subnet,block_count
cron_schedule                      = */5 * * * *
description                        = Detects a burst of blocked connections originating from a single /24 IPv4 subnet, which may indicate a coordinated scan or distributed botnet attack.
disabled                           = false
dispatch.earliest_time             = -10m
dispatch.latest_time               = now
enableSched                        = 1
realtime_schedule                  = 0
search                             = sourcetype=ja4proxy:telemetry ("event.action"=blocked OR "event.action"=banned) \
| eval subnet=replace("source.ip", "\\.[0-9]+$", ".0/24") \
| bucket _time span=5m \
| stats dc("source.ip") as unique_ips, count as block_count by subnet, _time \
| where block_count >= 50 \
| sort -block_count \
| table _time, subnet, unique_ips, block_count

# ── 5. New Country Not Seen in 30 Days ──────────────────────────────────────
[JA4proxy - New Country Not Seen in 30 Days]
action.notable                     = 1
action.notable.param.rule_name     = JA4proxy - New Country Not Seen in 30 Days
action.notable.param.rule_title    = First connection from $"ja4proxy.country_code"$ in 30 days
action.notable.param.security_domain = network
action.notable.param.severity      = low
action.notable.param.description   = A source IP from a country not seen in the past 30 days has connected to the proxy. This may warrant review if the country is geopolitically high-risk or unexpected for your user base.
action.notable.param.nes_fields    = source.ip,ja4proxy.country_code
cron_schedule                      = 0 * * * *
description                        = Detects the first connection from a source country not observed in the previous 30 days. Useful for geo-anomaly detection in environments with a defined user population geography.
disabled                           = false
dispatch.earliest_time             = -1h
dispatch.latest_time               = now
enableSched                        = 1
realtime_schedule                  = 0
search                             = sourcetype=ja4proxy:telemetry \
| eval country='ja4proxy.country_code' \
| eval seen_last_30d=if(earliest(_time, -30d), 1, 0) \
| eventstats values(country) as historic_countries by "host.name" \
| eval is_new_country=if(isnull(mvfind(historic_countries, country)), 1, 0) \
| where is_new_country=1 AND earliest=-1h \
| dedup country \
| table _time, country, "source.ip", "event.risk_score", "ja4proxy.sni"
