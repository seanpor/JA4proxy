commonfields:
  id: JA4proxy
  version: -1
name: JA4proxy
display: JA4proxy TLS Security Proxy
category: Network Security
description: Integration with JA4proxy TLS-aware security proxy for IP banning, watchlisting, and health monitoring.
configuration:
  - display: Management API URL
    name: base_url
    type: 0
    required: true
  - display: API Token
    name: api_token
    type: 4
    required: true
    hidden: true
script:
  # Synchronous XSOAR-native integration script.
  # Uses requests (sync) and demisto module — required by XSOAR runtime.
  # The adjacent commands.py uses aiohttp (async) and is the testable unit for CI;
  # this embedded script is the XSOAR-executable equivalent.
  script: |
    import requests

    def _init():
        params = demisto.params()
        return params.get('base_url', '').rstrip('/'), params.get('api_token', '')

    def _request(base_url, token, method, path, json_body=None, params=None):
        url = f'{base_url}{path}'
        headers = {
            'Authorization': f'Bearer {token}',
            'Content-Type': 'application/json',
            'Accept': 'application/json',
        }
        resp = requests.request(method, url, headers=headers,
                                json=json_body, params=params, timeout=30)
        if resp.status_code == 401:
            return_error('Authentication failed — check the API token.')
        resp.raise_for_status()
        if resp.status_code == 204:
            return {}
        return resp.json()

    def ban_ip_cmd(base_url, token):
        args = demisto.args()
        ttl = int(args.get('ttl_seconds', 3600))
        result = _request(base_url, token, 'POST', '/api/v1/bans',
                          json_body={'ip': args['ip'], 'ttl_seconds': ttl, 'reason': args.get('reason', '')})
        return CommandResults(outputs_prefix='JA4proxy.Ban', outputs=result,
                              readable_output=f"Banned **{args['ip']}** for {ttl}s.")

    def release_ban_cmd(base_url, token):
        ip = demisto.args()['ip']
        _request(base_url, token, 'DELETE', f'/api/v1/bans/{ip}')
        return CommandResults(readable_output=f'Ban released for **{ip}**.')

    def get_connection_history_cmd(base_url, token):
        args = demisto.args()
        ip, days = args['ip'], args.get('days', '7')
        result = _request(base_url, token, 'GET', '/api/v1/connections', params={'ip': ip, 'days': days})
        return CommandResults(outputs_prefix='JA4proxy.ConnectionHistory', outputs=result,
                              readable_output=f'Connection history for {ip} (last {days}d).')

    def get_fingerprint_detail_cmd(base_url, token):
        ja4 = demisto.args()['ja4']
        result = _request(base_url, token, 'GET', f'/api/v1/fingerprints/{ja4}')
        return CommandResults(outputs_prefix='JA4proxy.Fingerprint', outputs=result,
                              readable_output=f'Fingerprint detail for {ja4}.')

    def add_to_watchlist_cmd(base_url, token):
        args = demisto.args()
        _request(base_url, token, 'POST', '/api/v1/watchlist',
                 json_body={'ip': args['ip'], 'reason': args.get('reason', '')})
        return CommandResults(readable_output=f"Added **{args['ip']}** to watchlist.")

    def get_health_cmd(base_url, token):
        result = _request(base_url, token, 'GET', '/api/v1/health/deep')
        return CommandResults(outputs_prefix='JA4proxy.Health', outputs=result,
                              readable_output=f"Health: {result.get('status', 'unknown')}")

    def add_to_allowlist_cmd(base_url, token):
        args = demisto.args()
        ttl = int(args['ttl_seconds'])
        if ttl <= 0:
            return_error('ttl_seconds must be > 0: indefinite allowlist entries are not permitted.')
        _request(base_url, token, 'POST', '/api/v1/allowlist',
                 json_body={'ip': args['ip'], 'ttl_seconds': ttl, 'reason': args.get('reason', '')})
        return CommandResults(readable_output=f"Added **{args['ip']}** to allowlist for {ttl}s.")

    def get_dial_cmd(base_url, token):
        result = _request(base_url, token, 'GET', '/api/v1/dial')
        return CommandResults(outputs_prefix='JA4proxy.Dial', outputs=result,
                              readable_output=f"Current dial: {result.get('dial', 'unknown')}")

    def main():
        base_url, token = _init()
        command = demisto.command()
        try:
            if command == 'test-module':
                _request(base_url, token, 'GET', '/api/v1/health/deep')
                return_results('ok')
            elif command == 'ja4proxy-ban-ip':
                return_results(ban_ip_cmd(base_url, token))
            elif command == 'ja4proxy-release-ban':
                return_results(release_ban_cmd(base_url, token))
            elif command == 'ja4proxy-get-connection-history':
                return_results(get_connection_history_cmd(base_url, token))
            elif command == 'ja4proxy-get-fingerprint-detail':
                return_results(get_fingerprint_detail_cmd(base_url, token))
            elif command == 'ja4proxy-add-to-watchlist':
                return_results(add_to_watchlist_cmd(base_url, token))
            elif command == 'ja4proxy-get-health':
                return_results(get_health_cmd(base_url, token))
            elif command == 'ja4proxy-add-to-allowlist':
                return_results(add_to_allowlist_cmd(base_url, token))
            elif command == 'ja4proxy-get-dial':
                return_results(get_dial_cmd(base_url, token))
            else:
                return_error(f'Unknown command: {command}')
        except Exception as e:
            return_error(f'Failed to execute {command}: {str(e)}')

    if __name__ in ('__main__', '__builtin__', 'builtins'):
        main()
  type: python
  subtype: python3
  dockerimage: demisto/python3:3.10
  commands:
    - name: ja4proxy-ban-ip
      description: Ban an IP address with optional TTL and justification.
      arguments:
        - name: ip
          required: true
          description: IP address to ban.
        - name: ttl_seconds
          required: false
          default: "3600"
          description: Ban duration in seconds.
        - name: reason
          required: false
          description: Reason for the ban (logged to audit trail).
      outputs:
        - contextPath: JA4proxy.Ban.ip
          description: Banned IP address.
        - contextPath: JA4proxy.Ban.expires_at
          description: Ban expiry timestamp.

    - name: ja4proxy-release-ban
      description: Release an active ban on an IP address.
      arguments:
        - name: ip
          required: true
          description: IP address to release.

    - name: ja4proxy-get-connection-history
      description: Return connection timeline for an IP address.
      arguments:
        - name: ip
          required: true
          description: IP address to look up.
        - name: days
          required: false
          default: "7"
          description: Number of days of history to return.
      outputs:
        - contextPath: JA4proxy.ConnectionHistory
          description: List of connection events for the IP.

    - name: ja4proxy-get-fingerprint-detail
      description: Return full fingerprint intel including associated IPs.
      arguments:
        - name: ja4
          required: true
          description: JA4 fingerprint string.
      outputs:
        - contextPath: JA4proxy.Fingerprint
          description: Fingerprint detail and associated IP history.

    - name: ja4proxy-add-to-watchlist
      description: Add an IP to elevated monitoring.
      arguments:
        - name: ip
          required: true
          description: IP address to monitor.
        - name: reason
          required: false
          description: Reason for elevated monitoring.

    - name: ja4proxy-get-health
      description: Deep health check of all JA4proxy nodes.
      outputs:
        - contextPath: JA4proxy.Health.status
          description: Overall health status (ok/degraded/critical).

    - name: ja4proxy-add-to-allowlist
      description: Add an IP to the temporary allowlist (mandatory expiry required).
      arguments:
        - name: ip
          required: true
          description: IP address to allowlist.
        - name: ttl_seconds
          required: true
          description: Allowlist duration in seconds. Must be > 0 — no indefinite entries.
        - name: reason
          required: false
          description: Reason for allowlisting.

    - name: ja4proxy-get-dial
      description: Return the current dial setting (0=monitor-only, 100=full enforcement).
      outputs:
        - contextPath: JA4proxy.Dial.value
          description: Current dial value (0–100).
