---
# Temporary: Whitelist an IP for a limited time.
#
# Usage:
#   ansible-playbook temp-whitelist-ip.yml \
#     -e ip=203.0.113.5 \
#     -e reason="Debugging partner integration" \
#     -e ttl_hours=2 \
#     -e ticket=CHG0001500 \
#     -e ja4proxy_token="${JA4PROXY_TOKEN}"
#
# Optional:
#   -e ja4proxy_url=http://localhost:8090  (default)
#   -e slack_enabled=true                  (default: false)

- name: Temporary IP Whitelist
  hosts: localhost
  gather_facts: false
  vars:
    ja4proxy_url: "https://localhost:8090"
    ttl_hours: 2
    slack_enabled: false

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ip is defined
          - reason is defined
          - ticket is defined
          - ja4proxy_token is defined
        fail_msg: "Missing required variable: ip, reason, ticket, ja4proxy_token"

    - name: Compute expires_at
      ansible.builtin.set_fact:
        expires_at: "{{ (ansible_date_time.epoch_int | int + (ttl_hours | int * 3600)) | ansible.builtin.to_datetime('%Y-%m-%dT%H:%M:%SZ', utc=True) }}"

    - name: Add allowlist entry via Management API
      # nosemgrep
      ansible.builtin.uri:
        url: "{{ ja4proxy_url }}/api/v1/allowlist"
        method: POST
        headers:
          Authorization: "Bearer {{ ja4proxy_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          entry: "{{ ip }}"
          note: "[temporary] {{ reason }} (ticket: {{ ticket }})"
          expires_at: "{{ expires_at }}"
          managed_by: operator
        status_code: 200
        timeout: 30
      register: whitelist_result
      failed_when: >
        whitelist_result.status != 200 or
        'error' in (whitelist_result.json | default({}))

    - name: Assert allowlist entry confirmed
      ansible.builtin.assert:
        that:
          - whitelist_result.json.id is defined
        fail_msg: "API did not confirm the allowlist entry"

    - name: Post expiry reminder to Slack
      # checkov:skip=CKV2_ANSIBLE_1: External URL
      ansible.builtin.uri:
        url: "{{ slack_webhook_url }}"
        method: POST
        body_format: json
        body:
          text: "⏰ Temporary Whitelist: `{{ ip }}` expires at {{ expires_at }} — {{ reason }} — Ticket: {{ ticket }}"
        status_code: 200
        timeout: 10
      when: slack_enabled | bool
      vars:
        slack_webhook_url: "{{ lookup('env', 'SLACK_WEBHOOK_URL') }}"
