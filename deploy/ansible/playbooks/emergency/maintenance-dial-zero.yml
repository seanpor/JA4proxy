---
# Maintenance: Set dial to 0 for a maintenance window, then restore.
#
# Usage:
#   ansible-playbook maintenance-dial-zero.yml \
#     -e duration_minutes=60 \
#     -e reason="Maintenance window for backend upgrade" \
#     -e ticket=CHG0001600 \
#     -e ja4proxy_token="${JA4PROXY_TOKEN}"
#
# Optional:
#   -e ja4proxy_url=http://localhost:8090  (default)
#   -e ja4proxy_servicenow_enabled=true             (default: false)
#
# Safety: Steps down in ±10 increments. If 422 returned at any step,
# the playbook ABORTS — do not suppress four-eyes approval.

- name: Maintenance Dial Zero
  hosts: localhost
  gather_facts: false
  vars:
    ja4proxy_url: "https://localhost:8090"
    max_dial_change: 10

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - duration_minutes is defined
          - reason is defined
          - ticket is defined
          - ja4proxy_token is defined
        fail_msg: "Missing required variable: duration_minutes, reason, ticket, ja4proxy_token"

    - name: Get current dial value
      # nosemgrep
      ansible.builtin.uri:
        url: "{{ ja4proxy_url }}/api/v1/dial"
        method: GET
        headers:
          Authorization: "Bearer {{ ja4proxy_token }}"
          Accept: "application/json"
        status_code: 200
        timeout: 30
      register: current_dial_result

    - name: Save current dial value
      ansible.builtin.set_fact:
        previous_dial: "{{ current_dial_result.json.value | int }}"

    - name: Calculate dial steps (decrement by 10)
      ansible.builtin.set_fact:
        dial_steps: >-
          {{ range(previous_dial, -1, -max_dial_change) | list |
             map('int') | list }}

    - name: Step dial down to 0
      # nosemgrep
      ansible.builtin.uri:
        url: "{{ ja4proxy_url }}/api/v1/dial"
        method: PATCH
        headers:
          Authorization: "Bearer {{ ja4proxy_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          value: "{{ item }}"
        status_code: 200
        timeout: 30
      loop: "{{ dial_steps }}"
      register: dial_step_results
      failed_when: >
        dial_step_results.results | default([]) |
        selectattr('status', 'ne', 200) | list | length > 0
      ignore_errors: true

    - name: Fail if any dial step returned 422 (four-eyes)
      ansible.builtin.fail:
        msg: >
          Dial change was rejected (likely four-eyes approval pending).
          Do not suppress the approval gate — contact the approver instead.
          Previous dial value: {{ previous_dial }}
      when: >
        dial_step_results.results | default([]) |
        selectattr('status', 'equalto', 422) | list | length > 0

    - name: Wait for maintenance window
      ansible.builtin.wait_for:
        timeout: "{{ duration_minutes | int * 60 }}"
      when: dial_step_results is not failed

    - name: Restore previous dial value (stepped)
      # nosemgrep
      ansible.builtin.uri:
        url: "{{ ja4proxy_url }}/api/v1/dial"
        method: PATCH
        headers:
          Authorization: "Bearer {{ ja4proxy_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          value: "{{ item }}"
        status_code: 200
        timeout: 30
      loop: >-
        {{ range(0, previous_dial + max_dial_change, max_dial_change) |
           map('int') | list | select('<=', previous_dial) | list }}
      when: dial_step_results is not failed

    - name: Create ServiceNow change record
      # checkov:skip=CKV2_ANSIBLE_1: External URL
      ansible.builtin.uri:
        url: "{{ servicenow_url }}/api/now/table/change_request"
        method: POST
        user: "{{ servicenow_user }}"
        password: "{{ servicenow_password }}"
        body_format: json
        body:
          short_description: "Maintenance dial zero: {{ reason }}"
          description: "Dial set to 0 for {{ duration_minutes }}m — Ticket: {{ ticket }}"
        force_basic_auth: true
        status_code: 201
        timeout: 30
      when: ja4proxy_servicenow_enabled | default(false) | bool
      vars:
        servicenow_url: "{{ lookup('env', 'SERVICENOW_URL') }}"
        servicenow_user: "{{ lookup('env', 'SERVICENOW_USER') }}"
        servicenow_password: "{{ lookup('env', 'SERVICENOW_PASSWORD') }}"
