---
# Molecule scenario — ServiceNow CMDB disabled (Phase 94k)
#
# Verifies that with ja4proxy_servicenow_enabled: false (the default),
# the cmdb_register.yml task is never reached (zero changed tasks).

dependency:
  name: galaxy

driver:
  name: delegated
  options:
    managed: false
    login_cmd_template: "docker exec -ti {instance} bash"
    ansible_connection_options:
      ansible_connection: docker

platforms:
  - name: ja4proxy-rocky9
    image: docker.io/rockylinux:9
    privileged: true
    pre_build_image: true
    command: /usr/lib/systemd/systemd

provisioner:
  name: ansible
  config_options:
    defaults:
      deprecation_warnings: false
      callback_whitelist: timer,profile_tasks
  inventory:
    group_vars:
      all:
        ja4proxy_backend_host: "backend.test.local"
        ja4proxy_upstream_lb_host: "lb.test.local"
        ja4proxy_deploy_mode: "binary"
        ja4proxy_binary_src: ""
        ja4proxy_servicenow_enabled: false    # explicitly disabled

verifier:
  name: ansible

scenario:
  name: servicenow-disabled
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
