---
- name: Prepare (ServiceNow enabled scenario)
  hosts: ja4proxy-rocky9
  become: true
  tasks:
    - name: Install minimal dependencies
      ansible.builtin.package:
        name:
          - systemd
          - python3
        state: present

    - name: Create stub ServiceNow endpoint directory
      ansible.builtin.file:
        path: /tmp/servicenow-stub
        state: directory
        mode: "0755"

    - name: Deploy stub ServiceNow HTTP server
      ansible.builtin.copy:
        content: |
          #!/usr/bin/env python3
          """Minimal ServiceNow CMDB stub for Molecule testing (Phase 94k)."""
          import json
          import os
          from http.server import HTTPServer, BaseHTTPRequestHandler

          LOG_FILE = "/tmp/servicenow-stub/requests.log"

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(length).decode() if length else ""
                  os.makedirs(os.path.dirname(LOG_FILE), exist_ok=True)
                  with open(LOG_FILE, "a") as f:
                      f.write(json.dumps({
                          "method": "POST",
                          "path": self.path,
                          "body": body,
                      }) + "\n")
                  self.send_response(201)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(json.dumps({
                      "result": {"sys_id": "stub-sys-id-001"}
                  }).encode())

              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(json.dumps({"result": []}).encode())

              def log_message(self, fmt, *args):
                  pass  # suppress stdout noise

          if __name__ == "__main__":
              server = HTTPServer(("0.0.0.0", 18080), Handler)
              print("Stub ServiceNow listening on :18080")
              server.serve_forever()
        dest: /tmp/servicenow-stub/server.py
        mode: "0755"

    - name: Start stub ServiceNow server in background
      ansible.builtin.shell: |
        nohup python3 /tmp/servicenow-stub/server.py > /tmp/servicenow-stub/server.log 2>&1 &
        echo $! > /tmp/servicenow-stub/server.pid
      args:
        creates: /tmp/servicenow-stub/server.pid

    - name: Wait for stub to be ready
      # checkov:skip=CKV2_ANSIBLE_1: Local test stub uses HTTP
      ansible.builtin.uri:
        url: "http://127.0.0.1:18080/api/now/table/cmdb_ci_server"
        method: GET
        status_code: 200
      register: stub_check
      retries: 5
      delay: 1
      until: stub_check.status == 200
