---
# Molecule default scenario — converge on Rocky Linux 9
# Tests the ja4proxy role baseline (Phase 94j).

dependency:
  name: galaxy

driver:
  name: delegated
  options:
    managed: false
    login_cmd_template: "docker exec -ti {instance} bash"
    ansible_connection_options:
      ansible_connection: docker

platforms:
  - name: ja4proxy-rocky9
    image: docker.io/rockylinux:9
    privileged: true
    pre_build_image: true
    command: /usr/lib/systemd/systemd

provisioner:
  name: ansible
  config_options:
    defaults:
      deprecation_warnings: false
      callback_whitelist: timer,profile_tasks
  inventory:
    group_vars:
      all:
        backend_host: "backend.test.local"
        upstream_lb_host: "lb.test.local"
        ja4proxy_deploy_mode: "binary"
        ja4proxy_binary_src: ""    # no binary in Molecule — check mode only
        servicenow_enabled: false

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
