---
# ja4proxy/tasks/cmdb_register.yml — Phase 94k
#
# Register the JA4proxy node in ServiceNow CMDB on deploy.
# Opt-out by default: the when guard skips this task unless
# ja4proxy_servicenow_enabled is explicitly set to true.
#
# Custom fields (u_*) must exist in the ServiceNow instance before
# this task runs. See docs/decisions/ for the CMDB field mapping.

- name: Register JA4proxy node in ServiceNow CMDB
  when: ja4proxy_servicenow_enabled | bool
  servicenow.itsm.configuration_item:
    name: "{{ inventory_hostname }}"
    short_description: "JA4proxy TLS Security Proxy"
    asset_tag: "JA4PROXY-{{ inventory_hostname }}"
    install_status: "installed"
    ip_address: "{{ ansible_host }}"
    u_version: "{{ ja4proxy_image_tag }}"
    u_upstream_lb: "{{ ja4proxy_upstream_lb_host }}"
    u_downstream_backend: "{{ ja4proxy_backend_host }}"
    u_environment: "{{ ja4proxy_deploy_environment }}"
    u_last_deployed: "{{ ansible_date_time.iso8601 }}"
    u_ja4proxy_config_checksum: "{{ ja4proxy_config_checksum.stdout | default('') }}"
  delegate_to: localhost
