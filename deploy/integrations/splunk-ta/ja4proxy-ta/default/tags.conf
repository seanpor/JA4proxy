# Splunk tags.conf — JA4proxy Technology Add-on
# Maps JA4proxy event types to Splunk CIM data model tags.
# Required for Splunk Enterprise Security (ES) data model acceleration.
#
# CIM reference: https://docs.splunk.com/Documentation/CIM/latest/User/Overview
#
# Note: event types that participate in multiple CIM data models have all tags
# consolidated into a single section (Splunk requires unique section headers).

# ── CIM: Network Traffic ─────────────────────────────────────────────────────

[eventtype=ja4proxy_block]
network     = enabled
communicate = enabled

[eventtype=ja4proxy_tarpit]
network     = enabled
communicate = enabled

[eventtype=ja4proxy_rate_limited]
network     = enabled
communicate = enabled

[eventtype=ja4proxy_allowed]
network     = enabled
communicate = enabled

[eventtype=ja4proxy_flagged]
network     = enabled
communicate = enabled

# ── Mixed CIM: Network Traffic + Intrusion Detection ─────────────────────────
# ja4proxy_ban participates in both Network Traffic and Intrusion Detection.
# All tags are combined in a single section — Splunk applies all of them.

[eventtype=ja4proxy_ban]
network     = enabled
communicate = enabled
attack      = enabled
ids         = enabled

# ── CIM: Intrusion Detection ──────────────────────────────────────────────────

[eventtype=ja4proxy_high_risk]
attack = enabled
ids    = enabled

# ── Mixed CIM: Intrusion Detection + Alerts ───────────────────────────────────
# ja4proxy_campaign participates in both Intrusion Detection and Alerts CIM models.

[eventtype=ja4proxy_campaign]
attack = enabled
ids    = enabled
alert  = enabled

# ── CIM: Alerts ──────────────────────────────────────────────────────────────

[eventtype=ja4proxy_score_drift]
alert = enabled
