# Splunk props.conf — JA4proxy Technology Add-on
# Defines the ja4proxy:telemetry sourcetype used by all JA4proxy events.
#
# Events arrive as newline-delimited ECS JSON objects. Each line is a complete
# self-contained event; line merging must be disabled so multi-line JSON
# objects from other sources are never mixed with JA4proxy events.

[ja4proxy:telemetry]

# JSON key-value extraction — Splunk's built-in JSON KV processor handles
# ECS dotted-key fields (e.g. "source.ip") correctly as field names.
KV_MODE = json

# Timestamp configuration
# ECS uses ISO-8601 with millisecond precision, e.g. "2026-04-07T10:00:00.000Z"
TIME_FORMAT       = %Y-%m-%dT%H:%M:%S.%3NZ
TIME_PREFIX       = "@timestamp":"
MAX_TIMESTAMP_LOOKAHEAD = 40
TZ                = UTC

# Never merge lines — each JA4proxy log event is exactly one JSON object
SHOULD_LINEMERGE  = false

# Do not truncate events; JA4proxy events with many signals can be ~4 KB
TRUNCATE          = 0

# Category used by the Splunk App for Enterprise Security
ANNOTATE_PUNCT    = false

# CIM normalisation: map ECS fields to Splunk CIM Network Traffic fields.
# These FIELDALIAS entries allow CIM-based queries and ES correlation searches
# to work without field extraction rewrites.

# CIM: Network Traffic — src / dest
FIELDALIAS-src          = "source.ip"          AS src
FIELDALIAS-src_port     = "source.port"        AS src_port
FIELDALIAS-dest         = "destination.ip"     AS dest
FIELDALIAS-dest_port    = "destination.port"   AS dest_port
FIELDALIAS-transport    = "network.transport"  AS transport
FIELDALIAS-protocol     = "network.protocol"   AS protocol

# CIM: Network Traffic — action
FIELDALIAS-action       = "event.action"       AS action

# CIM: IDS / Network Traffic — severity proxy (derived via lookup, not direct alias)
# See transforms.conf for the ja4proxy_actions lookup that adds `severity`.

# CIM: TLS
FIELDALIAS-ssl_version  = "tls.version"        AS ssl_version
FIELDALIAS-ssl_cipher   = "tls.cipher"         AS ssl_cipher

# Custom JA4proxy fields — keep full dotted names for direct KQL/SPL access
# (no alias needed; KV_MODE=json makes them available as-is in SPL)
