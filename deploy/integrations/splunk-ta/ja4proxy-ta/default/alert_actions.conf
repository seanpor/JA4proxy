# Splunk alert_actions.conf — JA4proxy Technology Add-on
# Registers the JA4proxy Ban IP alert action so it appears in the ES
# notable event workflow and in the standard Splunk alert action picker.

[ja4proxy_ban_action]
label = JA4proxy Ban IP
description = Bans the source IP via the JA4proxy Management API
icon_path = appIcon.png
payload_format = json
