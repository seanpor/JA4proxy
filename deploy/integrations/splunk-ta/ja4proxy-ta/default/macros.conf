# Splunk macros.conf — JA4proxy Technology Add-on
# Macros provide reusable search fragments for dashboards and correlation searches.
# Use: `ja4proxy_index` expands to the full sourcetype filter.

# ── Index/sourcetype scoping ──────────────────────────────────────────────────

[ja4proxy_index]
# Primary search scope: all JA4proxy telemetry events.
# Include all indexes that receive JA4proxy data; adjust if you use a custom index.
definition = (index=security sourcetype=ja4proxy:telemetry)
iseval = 0

[ja4proxy_index(1)]
# Parameterised version — accepts an additional search filter string.
# Usage: `ja4proxy_index("event.action=blocked")` in a search.
args = filter
definition = (index=security sourcetype=ja4proxy:telemetry $filter$)
iseval = 0

# ── Time-scoped convenience macros ───────────────────────────────────────────

[ja4proxy_blocks_last_hour]
# All blocked/banned/tarpitted connections in the last hour.
definition = sourcetype=ja4proxy:telemetry ("event.action"=blocked OR "event.action"=banned OR "event.action"=tarpitted) earliest=-1h latest=now
iseval = 0

[ja4proxy_blocks_last_24h]
# Same as above but for the last 24 hours. Used in SOC daily summary dashboards.
definition = sourcetype=ja4proxy:telemetry ("event.action"=blocked OR "event.action"=banned OR "event.action"=tarpitted) earliest=-24h latest=now
iseval = 0

[ja4proxy_high_risk_last_hour]
# All high-risk connections (score >= 70) in the last hour.
definition = sourcetype=ja4proxy:telemetry "event.risk_score">=70 earliest=-1h latest=now
iseval = 0

# ── Field extraction helpers ──────────────────────────────────────────────────

[ja4proxy_fingerprint_stats]
# Tabulate connection counts by JA4 fingerprint — useful for threat hunting.
definition = `ja4proxy_index` | stats count, avg("event.risk_score") as avg_score, values("event.action") as actions by "ja4proxy.fingerprint.ja4" | sort -count
iseval = 0

[ja4proxy_top_blocked_ips]
# Top 20 source IPs by blocked connection count in the last 24 hours.
definition = `ja4proxy_blocks_last_24h` | stats count by "source.ip" | sort -count | head 20
iseval = 0
