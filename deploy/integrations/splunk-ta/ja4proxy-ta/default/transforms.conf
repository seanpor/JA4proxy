# Splunk transforms.conf — JA4proxy Technology Add-on
# Defines lookup tables referenced from props.conf and correlation searches.

# ── Action severity lookup ──────────────────────────────────────────────────
# Maps JA4proxy action values to CIM-compatible severity labels.
# Used by the CIM compliance layer and Splunk ES notable event creation.
[ja4proxy_actions]
filename     = ja4proxy_actions.csv
case_sensitive_match = false
default_match = true

# Columns in ja4proxy_actions.csv:
#   action        — matches event.action field values
#   cim_action    — CIM Network Traffic action (allowed / blocked)
#   severity      — CIM severity string (low / medium / high / critical / informational)
