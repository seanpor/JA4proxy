# Splunk eventtypes.conf — JA4proxy Technology Add-on
# Defines named event type filters for common JA4proxy query patterns.
# These event types are mapped to CIM tags in tags.conf.

# ── Connection decisions ─────────────────────────────────────────────────────

[ja4proxy_block]
# All connections that were blocked or banned by the proxy.
search = sourcetype=ja4proxy:telemetry ("event.action"=blocked OR "event.action"=banned)

[ja4proxy_ban]
# Connections where the source IP was permanently banned (not just blocked).
search = sourcetype=ja4proxy:telemetry "event.action"=banned

[ja4proxy_tarpit]
# Connections redirected to the tarpit.
search = sourcetype=ja4proxy:telemetry "event.action"=tarpitted

[ja4proxy_rate_limited]
# Connections that triggered the rate limiter.
search = sourcetype=ja4proxy:telemetry "event.action"=rate_limited

[ja4proxy_allowed]
# Connections that were allowed through.
search = sourcetype=ja4proxy:telemetry "event.action"=allowed

[ja4proxy_flagged]
# Connections that were allowed but flagged for analyst review.
search = sourcetype=ja4proxy:telemetry "event.action"=flagged

# ── Analytics alerts ─────────────────────────────────────────────────────────

[ja4proxy_campaign]
# Cross-connection campaign detection alerts generated by the analytics node.
search = sourcetype=ja4proxy:telemetry "event.kind"=alert "event.action"=campaign_detected

[ja4proxy_score_drift]
# Score drift alerts — proxy scoring behaviour has changed significantly.
search = sourcetype=ja4proxy:telemetry "event.kind"=alert "event.action"=score_drift

# ── High-risk connections ────────────────────────────────────────────────────

[ja4proxy_high_risk]
# Any connection with a risk score >= 70 (block threshold at dial=100).
search = sourcetype=ja4proxy:telemetry "event.risk_score">=70

[ja4proxy_spamhaus]
# Connections that triggered a Spamhaus DROP/EDROP match signal.
search = sourcetype=ja4proxy:telemetry "ja4proxy.signals{}.name"=spamhaus_drop
