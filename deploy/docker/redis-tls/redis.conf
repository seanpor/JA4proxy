# phase-201: Redis 7 configuration for the TLS integration overlay.
#
# Used by: deploy/docker/docker-compose.redis-tls.yml
# Purpose: run a Redis instance that speaks TLS on port 6380, one-way TLS
#          (server-auth only — client-cert mTLS is deferred past Phase 201).
#
# The matching cert/key are generated at container start by
# deploy/docker/redis-tls/generate-certs.sh (self-signed, 30-day validity,
# CN=localhost, SAN = DNS:redis,DNS:localhost,IP:127.0.0.1). Private keys
# are NEVER committed — see .gitignore (*.key, *.pem, *.crt all excluded).
#
# Phase-201-relevant fields are flagged with `# phase-201`. Everything else
# is a stock Redis 7 default with a comment for context.

# ── Network ─────────────────────────────────────────────────────────────
port 0                           # phase-201: disable the cleartext listener;
                                 # all traffic must traverse TLS.
tls-port 6380                    # phase-201: TLS listener (matches
                                 # config/proxy.yml `redis.port` when ssl=true).
bind 0.0.0.0 -::*                # JA4PROXY-2026-0047: listens on all
                                 # interfaces, which inside a container
                                 # means the container's single Docker
                                 # network NIC (ja4proxy-dmz). The host
                                 # port publish in docker-compose pins
                                 # the listener to 127.0.0.1 only, so
                                 # no external host can reach 6380.
                                 # Specific-IP binding is infeasible
                                 # because Docker assigns container IPs
                                 # dynamically at runtime.

# JA4PROXY-2026-0047 — defence in depth: protected-mode refuses
# connections from non-loopback clients when no password is set.
# Redis 7 defaults this to "yes", but pinning it explicitly keeps
# future config edits from silently weakening the posture.
protected-mode yes

# ── TLS material ────────────────────────────────────────────────────────
tls-cert-file /tls/redis.crt     # phase-201: generated by generate-certs.sh
tls-key-file  /tls/redis.key     # phase-201: generated by generate-certs.sh
tls-ca-cert-file /tls/redis.crt  # phase-201: self-signed — CA == server cert.

tls-auth-clients no              # phase-201: one-way TLS only (server-auth).
                                 # Client-cert mTLS is deferred (see ADR-201a).

tls-protocols "TLSv1.2 TLSv1.3"  # phase-201: matches the Go client's
                                 # MinVersion=TLS 1.2 (ADR-201a).

# ── Persistence / operational ───────────────────────────────────────────
save ""                          # test overlay — no persistence.
appendonly no
loglevel notice
