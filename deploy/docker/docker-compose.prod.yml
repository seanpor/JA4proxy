# JA4proxy — Single-Instance Production Compose
#
# Phase 14f: Replaces the broken aspirational compose that referenced
# non-existent files (Dockerfile.enterprise, config/enterprise.yml, redis cluster,
# ELK stack, security-scanner).
#
# Deferred items (documented with rationale in docs/phases/complete/PHASE_14.md §14f):
#   - Redis cluster (3 nodes): no HA requirement stated; Phase 15+
#   - Redis TLS: Docker internal network isolation is adequate; Phase 15+
#   - ELK stack: already have Loki/Promtail/Grafana; ELK is duplication
#   - Container image signing: CI/CD concern; ops runbook
#
# Prerequisites (must be created before first deploy):
#   deploy/secrets/redis_password.txt             — proxy's Redis ACL user password
#   deploy/secrets/management_redis_password.txt  — management console's Redis ACL user password
#   deploy/secrets/analytics_redis_password.txt   — analytics container's Redis ACL user password
#   deploy/secrets/ja4tap_redis_password.txt      — ja4-tap sensor's Redis ACL user password
#   deploy/secrets/exporter_redis_password.txt    — redis_exporter's Redis ACL user password
#   deploy/secrets/grafana_password.txt           — Grafana admin password
#   deploy/secrets/abuseipdb_api_key.txt          — AbuseIPDB API key (or empty file to disable)
#   (Phase 813: the five *_redis_password.txt files replace what was
#   previously just redis_password.txt — an existing deployment upgrading
#   past Phase 813 must generate the four new files before restarting the
#   redis service, or it will fail to render its ACL file and refuse to
#   start. Each password must be distinct per user — see
#   config/redis_acl.conf.template and JA4PROXY-2026-0043.)
#
# Quick start:
#   for f in redis_password management_redis_password analytics_redis_password \
#            ja4tap_redis_password exporter_redis_password; do
#     openssl rand -base64 48 > "deploy/secrets/${f}.txt"
#   done
#   openssl rand -base64 32 > deploy/secrets/grafana_password.txt
#   echo "your-api-key" > deploy/secrets/abuseipdb_api_key.txt
#   chmod 600 deploy/secrets/*.txt
#   ENVIRONMENT=production docker compose -f deploy/docker/docker-compose.prod.yml up -d

services:
  haproxy:
    image: haproxy:2.8.26-alpine
    ports:
      - "443:443"
      - "80:80"
      - "127.0.0.1:8404:8404"   # Stats page — internal only
    volumes:
      - ../../config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - proxy
    networks:
      - ja4proxy-frontend
      - ja4proxy-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 64M

  proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.go-proxy
    image: ja4proxy:2.0.0
    # No host ports (0046): HAProxy reaches proxy:8080 and Prometheus scrapes
    # proxy:9090 over the ja4proxy-backend network — neither needs publishing
    # to the host. The short form (- "8080") previously published random
    # 0.0.0.0 ports.
    depends_on:
      - redis
    volumes:
      - ../../config:/app/config:ro
      - ../../logs:/app/logs
      - redis-sock:/var/run/redis
    environment:
      - CONFIG_PATH=/app/config/proxy.yml
      - ENVIRONMENT=production
      - BACKEND_HOST=${BACKEND_HOST:?Set BACKEND_HOST to your upstream server IP/hostname}
      - BACKEND_PORT=${BACKEND_PORT:-443}
      - REDIS_UNIX_SOCKET_PATH=/var/run/redis/redis.sock
    # Phase 813: config/proxy.yml's redis.password reads "${REDIS_PASSWORD}"
    # (an env var this container's own process must see), but this service
    # only ever had `secrets: [redis_password]` -- a file at
    # /run/secrets/redis_password -- with nothing bridging the file's
    # content into that env var. ja4pd has no built-in _FILE-suffix
    # convention, so REDIS_PASSWORD silently resolved to empty and every
    # Redis operation would have failed AUTH. Same bridging pattern already
    # used below for ja4-tap.
    entrypoint:
      - /bin/sh
      - -c
      - 'export REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"; exec /usr/local/bin/ja4pd'
    # JA4PROXY-2026-0042: GID 999 matches the redis user inside redis:7.4.9-alpine
    # (see deploy/helm/ja4proxy/templates/redis.yaml and
    # deploy/ansible/roles/redis-secure/tasks/main.yml, which both pin 999 for
    # the same reason). Required for this service to connect to the unix
    # socket now that --unixsocketperm is 770 on the redis side.
    group_add:
      - "999"
    secrets:
      - redis_password
      - abuseipdb_api_key
    networks:
      - ja4proxy-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp:../../config/seccomp/proxy.json
      # AppArmor profile (Phase 34d): must be loaded on host before enabling.
      # Load with: sudo apparmor_parser -r config/apparmor/ja4proxy
      # Then uncomment the line below:
      - apparmor:ja4proxy-docker
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
      - /var/run:noexec,nosuid,nodev,size=10m
    cap_drop:
      - ALL
    # Phase 813: DAC_OVERRIDE added alongside the pre-existing
    # NET_BIND_SERVICE. deploy/secrets/*.txt are chmod 600 on the host
    # (deploy/secrets/README.md's documented policy); docker compose
    # (non-swarm) bind-mounts `secrets:` files with those exact host
    # permissions -- the long-form uid/gid/mode fields are swarm-only and
    # silently ignored here (verified directly: "not supported, they will
    # be ignored"). This container runs as fixed USER 1000:1000
    # (deploy/docker/Dockerfile.go-proxy), which won't generally match
    # whatever host user generated the secret file, so it needs
    # DAC_OVERRIDE to read it regardless of ownership.
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2.0'
        reservations:
          memory: 128M

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    # Official redis:7.4.9-alpine passes extra flags as command args to redis-server
    # JA4PROXY-2026-0042: --unixsocketperm 770 (not 777). The proxy service
    # mounts redis-sock to connect via unix socket; for that to keep working
    # after tightening to 770, the proxy service is given `group_add:
    # ["999"]` (redis's GID inside redis:7.4.9-alpine). If a future service
    # mounts redis-sock, it MUST add the same group_add or it will not be
    # able to open the socket.
    # Phase 813: --requirepass-file is not a real Redis directive (it
    # crash-loops the container with a FATAL CONFIG FILE ERROR) and the ACL
    # file needs its ${..._REDIS_PASSWORD} placeholders rendered before
    # Redis can read it (Redis ACL files don't support shell substitution,
    # and this file was previously bind-mounted verbatim). The custom
    # entrypoint below does both: renders the template, then execs
    # redis-server with only the non-auth flags from `command:`.
    entrypoint: ["/usr/local/bin/redis-entrypoint.sh"]
    command:
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --hz
      - "20"
      - --tcp-keepalive
      - "60"
      - --save
      - ""
      - --unixsocket
      - /var/run/redis/redis.sock
      - --unixsocketperm
      - "770"
    secrets:
      - redis_password
      - management_redis_password
      - analytics_redis_password
      - ja4tap_redis_password
      - exporter_redis_password
    networks:
      - ja4proxy-backend
    volumes:
      - redis-data:/data
      - redis-sock:/var/run/redis
      - ../../config/redis_acl.conf.template:/etc/redis/redis_acl.conf.template:ro
      - ./redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
      - /var/run:noexec,nosuid,nodev,size=10m
    cap_drop:
      - ALL
    # Phase 813: deploy/secrets/*.txt are chmod 600 on the host per
    # deploy/secrets/README.md's documented policy -- preserved, not
    # loosened. docker compose (non-swarm) bind-mounts `secrets:` files
    # with the host file's permissions verbatim; the long-form
    # uid/gid/mode fields are swarm-only and silently ignored here
    # (verified directly). redis-entrypoint.sh runs as root (it replaces
    # the image's own root->redis privilege-drop entrypoint) and needs
    # DAC_OVERRIDE specifically to read a secret file it doesn't own.
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 128M

  analytics:
    build:
      context: ../..
      dockerfile: src/analytics/Dockerfile
    image: ja4proxy-analytics:1.0.0
    # No host ports (0046): Prometheus scrapes analytics:8080 over the network.
    # Was published on 0.0.0.0:8082 despite the "internal only" comment.
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://analytics:${ANALYTICS_REDIS_PASSWORD:?ANALYTICS_REDIS_PASSWORD is required}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WAIT_FOR_REDIS=true
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    # Phase 813: no `secrets:` here -- this service authenticates to Redis
    # via the ANALYTICS_REDIS_PASSWORD-interpolated REDIS_URL above (a
    # compose-level ${VAR} substitution, resolved on the host at `docker
    # compose up` time), not a mounted Docker secret file. The
    # `secrets: [redis_password]` this service carried before Phase 813 was
    # unused -- this service was never the proxy and had no use for its
    # credential.
    volumes:
      - ../../config:/app/config:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ja4proxy-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  tarpit:
    build:
      context: ../../src/tarpit
      dockerfile: Dockerfile
    image: ja4proxy-tarpit:1.0.0
    # No host ports (0046): the proxy reaches tarpit:8888 and Prometheus scrapes
    # tarpit:9099 over the network. Both were published on 0.0.0.0.
    environment:
      - TARPIT_PORT=8888
      - TARPIT_DURATION=60
      - TARPIT_METRICS_PORT=9099
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - ja4proxy-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M

  # ── Monitoring ────────────────────────────────────────────────────────────

  redis-exporter:
    image: oliver006/redis_exporter:v1.87.0
    environment:
      - REDIS_ADDR=redis:6379
      # Phase 813: previously authenticated with no username at all, which
      # defaults to Redis's "default" user -- disabled by
      # config/redis_acl.conf.template, so this silently failed to connect
      # (same root cause as the proxy's own pre-813 misconfiguration). Uses
      # its own named ACL user, not redis_password (the proxy's).
      - REDIS_USER=exporter
      - REDIS_PASSWORD_FILE=/run/secrets/exporter_redis_password
    secrets:
      - exporter_redis_password
    networks:
      - ja4proxy-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Phase 813: deploy/secrets/*.txt are chmod 600 on the host (policy:
    # deploy/secrets/README.md); docker compose (non-swarm) bind-mounts
    # secrets with those exact host permissions -- long-form uid/gid/mode
    # is swarm-only and silently ignored (verified directly). This image
    # runs as fixed uid 59000 (verified via `docker inspect
    # oliver006/redis_exporter:v1.87.0 --format '{{.Config.User}}'`),
    # which won't match whatever host user generated the secret file.
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  prometheus:
    image: prom/prometheus:v3.13.2
    ports:
      # 0046: loopback-or-private only (never 0.0.0.0) — Prometheus UI for
      # debugging. Was published on 0.0.0.0:9091. Matches the grafana binding.
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_PROMETHEUS:-9091}:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - ja4proxy-backend
      - ja4proxy-monitoring
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  grafana:
    image: grafana/grafana:13.0.4-ubuntu
    ports:
      # JA4PROXY-2026-0045: bind to loopback — the comment claims
      # "internal only" but the previous form "3001:3000" published
      # on 0.0.0.0. Reach via SSH tunnel or an authenticated reverse
      # proxy, never from a public interface.
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_password
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    secrets:
      - grafana_password
    networks:
      - ja4proxy-monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Phase 813: deploy/secrets/*.txt are chmod 600 on the host (policy:
    # deploy/secrets/README.md); docker compose (non-swarm) bind-mounts
    # secrets with those exact host permissions -- long-form uid/gid/mode
    # is swarm-only and silently ignored (verified directly). grafana/grafana
    # runs as fixed uid 472 (verified via `docker inspect
    # grafana/grafana:13.0.4-ubuntu --format '{{.Config.User}}'`), which
    # won't match whatever host user generated the secret file.
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  loki:
    image: grafana/loki:3.7.4
    # No host ports (0046): Grafana queries loki:3100 and Promtail pushes over
    # the network. Was published on 0.0.0.0:3100.
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - ja4proxy-monitoring
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  promtail:
    image: grafana/promtail:3.6.11
    volumes:
      - ../monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../../logs:/var/log/ja4proxy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - ja4proxy-monitoring
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # phase-809 (O-005): standalone Go TAP/SPAN sensor (cmd/ja4-tap). Disabled
  # by default (`profiles: [tap]`) since it's an optional add-on most
  # deployments don't run, and because live SPAN/mirror-port capture doesn't
  # fit this file's bridge-network model cleanly (see the network note
  # below) -- enable explicitly with `docker compose --profile tap up`.
  #
  # Prerequisite: `deploy/secrets/ja4tap_redis_password.txt` and a `ja4tap`
  # user in config/redis_acl.conf.template (see that file's phase-809 entry) --
  # least-privilege by default: only fp:* writes, ban:* only once armed.
  #
  # Network: AF_PACKET live capture needs to see the SPAN interface, which a
  # normal bridge network namespace does not expose. This service defaults
  # to `network_mode: host` for that reason -- the tradeoff is it can no
  # longer resolve `redis` by the compose DNS name, so REDIS_URL below points
  # at `host.docker.internal` (mapped to the host's real IP via extra_hosts)
  # instead; the redis service must publish its port to the host for this to
  # work (it does not, by default, in this file -- add a
  # `ports: ["127.0.0.1:6379:6379"]` mapping to redis, or run ja4-tap outside
  # Docker entirely per docs/runbooks/tap_mode.md, which is the simpler
  # option for most deployments since the sensor already needs no privileged
  # Docker features beyond CAP_NET_RAW).
  #
  # --redis-password only accepts a literal value (F-017 keeps it off the
  # command line via REDIS_PASSWORD, not a --*-file flag), so the entrypoint
  # is a shell one-liner that reads the Docker secret file into that env var
  # before exec'ing the binary.
  ja4-tap:
    profiles: ["tap"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ja4-tap
    image: ja4proxy-tap:1.0.0
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_URL=redis://host.docker.internal:6379/0
      - TAP_INTERFACE=${TAP_INTERFACE:?Set TAP_INTERFACE to the SPAN/mirror port interface}
    secrets:
      - ja4tap_redis_password
    entrypoint:
      - /bin/sh
      - -c
      - 'export REDIS_PASSWORD="$$(cat /run/secrets/ja4tap_redis_password)"; exec /usr/local/bin/ja4-tap --interface="$$TAP_INTERFACE" --metrics-addr=:9110 --quiet'
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    # Phase 813: DAC_OVERRIDE added alongside the pre-existing NET_RAW
    # (AF_PACKET capture). This container runs as fixed USER 1000:1000
    # (deploy/docker/Dockerfile.ja4-tap). Before this, whether `cat
    # /run/secrets/ja4tap_redis_password` in the entrypoint above actually
    # worked depended on the host user that created the secret file
    # happening to also be uid 1000 -- true on most Debian/Ubuntu hosts'
    # first non-root user (and GitHub Actions runners), but not a real
    # guarantee, and not the actual mechanism that should be providing it.
    # deploy/secrets/*.txt stay chmod 600 per deploy/secrets/README.md;
    # docker compose (non-swarm) bind-mounts secrets with those exact host
    # permissions regardless of the long-form uid/gid/mode fields, which
    # are swarm-only and silently ignored here (verified directly).
    cap_add:
      - NET_RAW
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 64M

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  redis-sock:

networks:
  ja4proxy-frontend:
    driver: bridge
  ja4proxy-backend:
    driver: bridge
  ja4proxy-monitoring:
    driver: bridge

secrets:
  redis_password:
    file: ../secrets/redis_password.txt
  management_redis_password:
    file: ../secrets/management_redis_password.txt
  analytics_redis_password:
    file: ../secrets/analytics_redis_password.txt
  ja4tap_redis_password:
    file: ../secrets/ja4tap_redis_password.txt
  exporter_redis_password:
    file: ../secrets/exporter_redis_password.txt
  grafana_password:
    file: ../secrets/grafana_password.txt
  abuseipdb_api_key:
    file: ../secrets/abuseipdb_api_key.txt
