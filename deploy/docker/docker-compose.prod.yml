# JA4proxy — Single-Instance Production Compose
#
# Phase 14f: Replaces the broken aspirational compose that referenced
# non-existent files (Dockerfile.enterprise, config/enterprise.yml, redis cluster,
# ELK stack, security-scanner).
#
# Deferred items (documented with rationale in docs/phases/PHASE_14.md §14f):
#   - Redis cluster (3 nodes): no HA requirement stated; Phase 15+
#   - Redis TLS: Docker internal network isolation is adequate; Phase 15+
#   - ELK stack: already have Loki/Promtail/Grafana; ELK is duplication
#   - Container image signing: CI/CD concern; ops runbook
#
# Prerequisites (must be created before first deploy):
#   deploy/secrets/redis_password.txt   — strong random password (min 32 chars)
#   deploy/secrets/grafana_password.txt — Grafana admin password
#   deploy/secrets/abuseipdb_api_key.txt — AbuseIPDB API key (or empty file to disable)
#
# Quick start:
#   openssl rand -base64 48 > deploy/secrets/redis_password.txt
#   openssl rand -base64 32 > deploy/secrets/grafana_password.txt
#   echo "your-api-key" > deploy/secrets/abuseipdb_api_key.txt
#   chmod 600 deploy/secrets/*.txt
#   ENVIRONMENT=production docker compose -f docker/docker-compose.prod.yml up -d

services:
  haproxy:
    image: haproxy:2.8.24-alpine
    ports:
      - "443:443"
      - "80:80"
      - "127.0.0.1:8404:8404"   # Stats page — internal only
    volumes:
      - ../../config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - proxy
    networks:
      - ja4proxy-frontend
      - ja4proxy-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 64M

  proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.go-proxy
    image: ja4proxy:1.0.0
    ports:
      - "8080"   # Proxy (HAProxy connects here)
      - "9090"   # Prometheus metrics / Health API
    depends_on:
      - redis
    volumes:
      - ../../config:/app/config:ro
      - ../../logs:/app/logs
      - redis-sock:/var/run/redis
    environment:
      - CONFIG_PATH=/app/config/proxy.yml
      - ENVIRONMENT=production
      - BACKEND_HOST=${BACKEND_HOST:?Set BACKEND_HOST to your upstream server IP/hostname}
      - BACKEND_PORT=${BACKEND_PORT:-443}
      - REDIS_UNIX_SOCKET_PATH=/var/run/redis/redis.sock
    # JA4PROXY-2026-0042: GID 999 matches the redis user inside redis/redis-stack
    # (see deploy/helm/ja4proxy/templates/redis.yaml and
    # deploy/ansible/roles/redis-secure/tasks/main.yml, which both pin 999 for
    # the same reason). Required for this service to connect to the unix
    # socket now that --unixsocketperm is 770 on the redis side.
    group_add:
      - "999"
    secrets:
      - redis_password
      - abuseipdb_api_key
    networks:
      - ja4proxy-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp:../../config/seccomp/proxy.json
      # AppArmor profile (Phase 34d): must be loaded on host before enabling.
      # Load with: sudo apparmor_parser -r config/apparmor/ja4proxy
      # Then uncomment the line below:
      - apparmor:ja4proxy-docker
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
      - /var/run:noexec,nosuid,nodev,size=10m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2.0'
        reservations:
          memory: 128M

  redis:
    image: redis/redis-stack:7.4.0-v8
    environment:
      # Password injected via Docker secret mounted at /run/secrets/redis_password
      # redis/redis-stack reads REDIS_ARGS for extra flags
      # JA4PROXY-2026-0042: --unixsocketperm 770 (not 777). The proxy service
      # mounts redis-sock to connect via unix socket; for that to keep working
      # after tightening to 770, the proxy service is given `group_add:
      # ["999"]` (redis's GID inside redis/redis-stack). If a future service
      # mounts redis-sock, it MUST add the same group_add or it will not be
      # able to open the socket.
      - REDIS_ARGS=--requirepass-file /run/secrets/redis_password --maxmemory 512mb --maxmemory-policy allkeys-lru --hz 20 --tcp-keepalive 60 --save "" --unixsocket /var/run/redis/redis.sock --unixsocketperm 770
    secrets:
      - redis_password
    networks:
      - ja4proxy-backend
    volumes:
      - redis-data:/data
      - redis-sock:/var/run/redis
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
      - /var/run:noexec,nosuid,nodev,size=10m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 128M

  analytics:
    build:
      context: ../..
      dockerfile: src/analytics/Dockerfile
    image: ja4proxy-analytics:1.0.0
    ports:
      - "8082:8080"   # Analytics metrics (internal only)
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WAIT_FOR_REDIS=true
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    secrets:
      - redis_password
    volumes:
      - ../../config:/app/config:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ja4proxy-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  tarpit:
    build:
      context: ../../src/tarpit
      dockerfile: Dockerfile
    image: ja4proxy-tarpit:1.0.0
    ports:
      - "8888:8888"   # Tarpit port (internal only)
      - "9099:9099"   # Tarpit metrics (internal only)
    environment:
      - TARPIT_PORT=8888
      - TARPIT_DURATION=60
      - TARPIT_METRICS_PORT=9099
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - ja4proxy-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M

  # ── Monitoring ────────────────────────────────────────────────────────────

  redis-exporter:
    image: oliver006/redis_exporter:v1.84.0
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    secrets:
      - redis_password
    networks:
      - ja4proxy-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  prometheus:
    image: prom/prometheus:v3.12.0
    ports:
      - "9091:9090"   # Prometheus UI (internal only)
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - ja4proxy-backend
      - ja4proxy-monitoring
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  grafana:
    image: grafana/grafana:13.0.1-ubuntu
    ports:
      # JA4PROXY-2026-0045: bind to loopback — the comment claims
      # "internal only" but the previous form "3001:3000" published
      # on 0.0.0.0. Reach via SSH tunnel or an authenticated reverse
      # proxy, never from a public interface.
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_password
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    secrets:
      - grafana_password
    networks:
      - ja4proxy-monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  loki:
    image: grafana/loki:3.7.2
    ports:
      - "3100:3100"   # Loki API (internal only)
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - ja4proxy-monitoring
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  promtail:
    image: grafana/promtail:3.6.11
    volumes:
      - ../monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../../logs:/var/log/ja4proxy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - ja4proxy-monitoring
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  redis-sock:

networks:
  ja4proxy-frontend:
    driver: bridge
  ja4proxy-backend:
    driver: bridge
  ja4proxy-monitoring:
    driver: bridge

secrets:
  redis_password:
    file: ../secrets/redis_password.txt
  grafana_password:
    file: ../secrets/grafana_password.txt
  abuseipdb_api_key:
    file: ../secrets/abuseipdb_api_key.txt
