services:
  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_PROMETHEUS:-9091}:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      # JA4PROXY-2026-0008: proxy /metrics requires a Bearer token for remote
      # scraping. File is bind-mounted ro so the token never lives in the image.
      - ../secrets/metrics_token.txt:/etc/prometheus/metrics_token.txt:ro
      # Phase 805: both of these were referenced by prometheus.yml's rule_files
      # (or documented in OBSERVABILITY_STANDARDS.md as "the" alert rule
      # location) but never actually mounted -- `promtool check config`
      # against the real mount set confirmed Prometheus fails to start
      # without the slo_recording_rules.yml line below. The alertmanager/rules
      # directory mount makes all 10 existing per-component rule files (plus
      # this phase's new performance.rules.yml) actually load for the first
      # time; previously they were promtool-syntax-validated but never
      # evaluated by a running Prometheus.
      - ../monitoring/prometheus/slo_recording_rules.yml:/etc/prometheus/slo_recording_rules.yml:ro
      - ../monitoring/alertmanager/rules:/etc/prometheus/alertmanager-rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - ja4proxy-monitoring
      - poc_dmz_net
      - poc_mgmt_net
      - poc_origin_net
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.33.1
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_ALERTMANAGER:-9093}:9093"
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    networks:
      - ja4proxy-monitoring
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:13.0.6-ubuntu
    ports:
      # JA4PROXY-2026-0045: bind to loopback only — consistent with the
      # Prometheus and Alertmanager services above. Dashboards should be
      # reached via an SSH tunnel or an authenticated reverse proxy, not
      # exposed on the host's public interfaces.
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_GRAFANA:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/grafana/certs/grafana.crt
      # phase-800: MUST be GF_SERVER_CERT_KEY, not GF_SERVER_KEY_FILE. Grafana's
      # setting is [server] cert_key, so the env override is GF_SERVER_CERT_KEY.
      # GF_SERVER_KEY_FILE matches no setting, so Grafana silently ignored it,
      # left cert_key empty, and crash-looped with "cert_key cannot be empty
      # when using HTTPS" (observed: 13 restarts). Verified against both
      # 13.0.4-ubuntu and 13.0.6-ubuntu — this was never version-specific.
      - GF_SERVER_CERT_KEY=/etc/grafana/certs/grafana.key
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/
      - GF_INSTALL_PLUGINS=
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/ja4proxy-overview.json
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./certs/grafana:/etc/grafana/certs:ro
    restart: unless-stopped
    networks:
      - ja4proxy-monitoring
    depends_on:
      - prometheus
      - loki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      # phase-800: curl, https, -k. This probe was unrunnable as written, in two
      # independent ways:
      #   1. grafana/grafana:*-ubuntu ships NO wget (verified: `command -v wget`
      #      is empty, curl is at /usr/bin/curl). Docker reported the probe's
      #      exit code as -1 — the command never ran.
      #   2. It targeted http://, but GF_SERVER_PROTOCOL is https, so even with
      #      a working client it could not have succeeded. -k because the cert
      #      is self-signed.
      # Verified after the fix: curl -sk https://localhost:3000/api/health
      # returns 200 from inside the container.
      test: ["CMD", "curl", "-fsk", "https://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      # Phase 805: reads the .prom file scripts/export_ci_benchmark_textfile.sh
      # writes on the host via a systemd timer (D5 — kept a host-level cron,
      # not a container, so no container needs write access to this path).
      - '--collector.textfile.directory=/textfile'
    # Not exposed to host — only accessible from monitoring network
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
      # Read-only here; scripts/export_ci_benchmark_textfile.sh writes this
      # path from the host, outside any container (the puller's own
      # `mkdir -p` creates it on first run if absent). See
      # docs/runbooks/nightly_benchmark_regression.md for install steps.
      - /var/lib/node_exporter/textfile_collector:/textfile:ro
    restart: unless-stopped
    networks:
      - ja4proxy-monitoring
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  redis-exporter:
    image: oliver006/redis_exporter:v1.87.0
    environment:
      - REDIS_ADDR=redis:6379
      # Phase 813: previously authenticated with no username (defaults to
      # the disabled "default" user) using REDIS_PASSWORD (the proxy's own
      # credential). Uses its own named ACL user now.
      - REDIS_USER=exporter
      - REDIS_PASSWORD=${EXPORTER_REDIS_PASSWORD:?EXPORTER_REDIS_PASSWORD is required}
    # Not exposed to host — only accessible from monitoring network
    restart: unless-stopped
    networks:
      - poc_data_net
      - ja4proxy-monitoring
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  loki:
    image: grafana/loki:3.7.6
    # Not exposed to host — only accessible from monitoring network
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - ja4proxy-monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    # No healthcheck: the distroless loki image ships only /usr/bin/loki
    # (no wget/curl/sh), so no in-container readiness probe can run. A broken
    # healthcheck would leave the container permanently "unhealthy".

  # JA4PROXY-2026-0017 — tecnativa/docker-socket-proxy exposes a
  # whitelisted subset of the Docker API over TCP so promtail can do
  # container service-discovery without a raw /var/run/docker.sock
  # mount. Only CONTAINERS=1 is enabled; every other Docker API domain
  # (IMAGES, VOLUMES, EXEC, NETWORKS, SWARM, SYSTEM, ...) stays denied.
  # Even if promtail is compromised, the attacker cannot enumerate
  # images, read env vars outside the discovery scope, or exec into
  # other containers.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      # Everything else stays 0 by default.
      POST: 0
      DELETE: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - ja4proxy-monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'

  promtail:
    image: grafana/promtail:3.6.11
    # JA4PROXY-2026-0017 — no more /var/run/docker.sock mount. Promtail
    # now reads container metadata from docker-socket-proxy over TCP
    # (see promtail-config.yml `host: tcp://docker-socket-proxy:2375`).
    volumes:
      - ../monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/positions
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
      - docker-socket-proxy
    restart: unless-stopped
    networks:
      - ja4proxy-monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    # JA4PROXY-2026-0016 — cAdvisor previously ran with privileged: true, full
    # r/w /var/run mount, and /dev/kmsg access. A compromise of the cAdvisor
    # container had a direct path to host root via the Docker socket under
    # /var/run. The minimum caps cAdvisor needs to read /proc + /sys cgroup
    # data are SYS_PTRACE + DAC_READ_SEARCH; /var/run is now read-only so
    # the Docker socket cannot be written to from inside the container.
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
      - DAC_READ_SEARCH
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    networks:
      - ja4proxy-monitoring
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  haproxy-exporter:
    image: prom/haproxy-exporter:v0.15.0
    command:
      # Use HAProxy path-parameter CSV suffix (;csv) and include basic-auth credentials.
      # Operators MUST set HAPROXY_STATS_USER / HAPROXY_STATS_PASSWORD in .env;
      # phase-202 removed the admin/admin123 fallbacks.
      - '--haproxy.scrape-uri=http://${HAPROXY_STATS_USER:?HAPROXY_STATS_USER is required}:${HAPROXY_STATS_PASSWORD:?HAPROXY_STATS_PASSWORD is required}@haproxy:8404/stats;csv'
    restart: unless-stopped
    networks:
      - ja4proxy-monitoring
      - poc_dmz_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  promtail-positions:
    driver: local

networks:
  ja4proxy-monitoring:
    driver: bridge
  # Connect to POC networks for metrics scraping.
  # Names match the explicit name: fields on networks in docker/docker-compose.poc.yml.
  # After Phase 89, poc networks have explicit name: ja4proxy-dmz / ja4proxy-data / ja4proxy-mgmt.
  poc_dmz_net:
    external: true
    name: ja4proxy-dmz
  poc_data_net:
    external: true
    name: ja4proxy-data
  poc_mgmt_net:
    external: true
    name: ja4proxy-mgmt
  poc_origin_net:
    external: true
    name: ja4proxy-origin
