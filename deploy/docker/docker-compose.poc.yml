# JA4proxy Proof-of-Compose stack.
#
# Prerequisites (must be created before first deploy — scripts/start-poc.sh
# does all of this automatically; the manual steps below are for reference
# / non-start-poc.sh deployments):
#   deploy/secrets/redis_password.txt             — proxy's Redis ACL user password
#   deploy/secrets/management_redis_password.txt  — management console's Redis ACL user password
#   deploy/secrets/analytics_redis_password.txt   — analytics container's Redis ACL user password
#   deploy/secrets/ja4tap_redis_password.txt      — ja4-tap sensor's Redis ACL user password
#   deploy/secrets/exporter_redis_password.txt    — redis_exporter's Redis ACL user password
#   (each: strong random password, min 32 chars, distinct per user — see
#   config/redis_acl.conf.template and JA4PROXY-2026-0043)
#
# Quick start:
#   mkdir -p deploy/secrets
#   for f in redis_password management_redis_password analytics_redis_password \
#            ja4tap_redis_password exporter_redis_password; do
#     openssl rand -base64 48 > "deploy/secrets/${f}.txt"
#   done
#   chmod 600 deploy/secrets/*.txt
#   cp template.env .env  # edit as needed
#   docker compose up -d

name: ja4proxy

services:
  haproxy:
    image: haproxy:2.8.26-alpine
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_INGRESS:-443}:443"
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_STATS:-8404}:8404"
    volumes:
      - ../../config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - proxy
    networks:
      - ja4proxy-dmz
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.go-proxy
      args:
        VERSION: ${VERSION:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: ja4proxy:2.0.0
    restart: unless-stopped
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_DIRECT:-8081}:8080"
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_METRICS:-9090}:9090"
    depends_on:
      - redis
    volumes:
      - ../../config:/app/config:ro
      - ../../data/geoip:/app/geoip:ro
    environment:
      - CONFIG_PATH=/app/config/proxy.yml
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - BACKEND_HOST=${BACKEND_HOST:-backend}
      - BACKEND_PORT=${BACKEND_PORT:-8443}  # mock backend runs non-root on 8443
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JA4PROXY_TRACE=${JA4PROXY_TRACE:-false}
      - JA4PROXY_FORENSIC=${JA4PROXY_FORENSIC:-false}
      - METRICS_BIND_HOST=${METRICS_BIND_HOST:-127.0.0.1}
      - METRICS_AUTH_TOKEN=${METRICS_AUTH_TOKEN:-}
    networks:
      - ja4proxy-dmz
      - ja4proxy-data
      - ja4proxy-origin
      - ja4proxy-mgmt
    security_opt:
      - no-new-privileges:true
      # AppArmor profile (Phase 34d): must be loaded on host before enabling.
      # Load with: sudo apparmor_parser -r config/apparmor/ja4proxy
      # Then uncomment the line below:
      # - apparmor:ja4proxy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
      - /var/run:noexec,nosuid,nodev,size=10m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Non-root user: ja4proxy (set in docker/Dockerfile.go-proxy)
    cpuset: "${AGENT_CPU_SET:-0-15}"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '4.0'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    # No host port exposure — internal to ja4proxy-data only.
    # Tests use `docker exec` + redis-cli for state manipulation.
    restart: unless-stopped
    # Official redis:7.4.9-alpine passes extra flags as command args to redis-server
    # JA4PROXY-2026-0042: --unixsocketperm 770 (not 777). The socket lives
    # on a named Docker volume that is NOT mounted by any non-redis service
    # in this compose file, so tightening to 770 removes the world-writable
    # bit without breaking functionality. (If a future service mounts the
    # redis-sock volume, it MUST also add `group_add: ["999"]` — the redis
    # user's GID inside redis:7.4.9-alpine — or it will not be able to
    # connect.)
    # Phase 813: --requirepass-file is not a real Redis directive (it
    # crash-loops the container with a FATAL CONFIG FILE ERROR) and the ACL
    # file needs its ${..._REDIS_PASSWORD} placeholders rendered before
    # Redis can read it (Redis ACL files don't support shell substitution,
    # and this file was previously bind-mounted verbatim). The custom
    # entrypoint below does both: renders the template, then execs
    # redis-server with only the non-auth flags from `command:`.
    entrypoint: ["/usr/local/bin/redis-entrypoint.sh"]
    command:
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --hz
      - "20"
      - --tcp-keepalive
      - "60"
      - --save
      - ""
      - --unixsocket
      - /var/run/redis/redis.sock
      - --unixsocketperm
      - "770"
    networks:
      - ja4proxy-data
    volumes:
      - redis-data:/data
      - redis-sock:/var/run/redis
      - ../../config/redis_acl.conf.template:/etc/redis/redis_acl.conf.template:ro
      - ./redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    secrets:
      - redis_password
      - management_redis_password
      - analytics_redis_password
      - ja4tap_redis_password
      - exporter_redis_password
    # JA4PROXY-2026-0079: Hardening controls below are mandatory for Redis.
    # Do NOT weaken or remove without explicit security review (issue #238).
    #   1. Pinned image with digest (immutable, not mutable tag)
    #   2. no-new-privileges — prevent setuid escalation
    #   3. cap_drop: ALL — drop all Linux capabilities, cap_add only what's needed
    #   4. read_only: true — prevent filesystem writes
    #   5. No apparmor:unconfined — use default or custom profile
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
      - /var/run:noexec,nosuid,nodev,size=10m
    cap_drop:
      - ALL
    # Phase 813: deploy/secrets/*.txt are chmod 600 on the host per
    # deploy/secrets/README.md's documented policy ("Files MUST be 600") --
    # preserved, not loosened. docker compose (non-swarm) bind-mounts
    # `secrets:` files with the HOST file's permissions verbatim; the
    # long-form `uid`/`gid`/`mode` fields exist in the Compose spec but are
    # swarm-only -- this Compose version logs "not supported, they will be
    # ignored" and silently falls back to the raw bind-mount (verified
    # directly). redis-entrypoint.sh (running as root, since it replaces
    # the image's own root->redis privilege-drop entrypoint) therefore
    # needs CAP_DAC_OVERRIDE specifically to read a secret file it doesn't
    # own -- every other capability stays dropped.
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mockbackend
    image: ja4proxy-mockbackend:1.0.0
    restart: unless-stopped
    # No host port exposure — internal to ja4proxy-origin only
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - JA4PROXY_FORENSIC=${JA4PROXY_FORENSIC:-false}
    networks:
      - ja4proxy-origin
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    # Non-root user set in docker/Dockerfile.mockbackend (USER backend)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  tarpit:
    build:
      context: ../../src/tarpit
      dockerfile: Dockerfile
    image: ja4proxy-tarpit:1.0.0
    restart: unless-stopped
    # No host port exposure — internal to ja4proxy-origin only
    environment:
      - TARPIT_PORT=8888
      - TARPIT_DURATION=60
      - TARPIT_METRICS_PORT=9099
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - ja4proxy-origin
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    # Non-root user set in src/tarpit/Dockerfile (USER tarpit)
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  trafficgen:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.trafficgen
    image: ja4proxy-trafficgen:1.0.0
    restart: unless-stopped
    depends_on:
      - proxy
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ja4proxy-dmz
    profiles:
      - traffic
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Non-root user set in docker/Dockerfile.trafficgen
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  analytics:
    build:
      context: ../..
      dockerfile: src/analytics/Dockerfile
    image: ja4proxy-analytics:1.0.0
    restart: unless-stopped
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_ANALYTICS:-8080}:8080"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://analytics:${ANALYTICS_REDIS_PASSWORD:?ANALYTICS_REDIS_PASSWORD is required}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WAIT_FOR_REDIS=true
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ../../config:/app/config:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ja4proxy-mgmt
      # phase-232c: analytics reads Redis (events stream + findings); Redis is
      # attached only to the internal ja4proxy-data network, so analytics must
      # join it too or the `redis` hostname does not resolve. Mirrors the
      # `management` service, which is on both networks.
      - ja4proxy-data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    # Non-root user set in src/analytics/Dockerfile (USER analytics)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # phase-232d/232e: the unauthenticated `admin-api` service (host port 8091)
  # was decommissioned and its legacy source module removed. All management
  # operations now go through the JWT-gated `management` service on port 8090.

  test:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.test
    image: ja4proxy-test:1.0.0
    depends_on:
      - proxy
      - redis
      - backend
    volumes:
      # Paths are relative to this compose file (deploy/docker/), so `../../` is repo root.
      - ../../tests:/app/tests:ro
      - ../../tests/performance:/app/performance:ro
      - reports-data:/app/reports
      - ../../src:/app/src:ro
      - ../../config:/app/config:ro
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - PROXY_HOST=proxy
      - PROXY_PORT=8080
      - BACKEND_HOST=backend
      - BACKEND_PORT=8443  # mock backend runs non-root on 8443
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    networks:
      - ja4proxy-dmz
      - ja4proxy-data
      - ja4proxy-origin
    profiles:
      - test
    command: ["pytest", "/app/tests", "-v", "--cov=src", "--cov-report=html:/app/reports/coverage", "--cov-report=term", "--junitxml=/app/reports/junit.xml"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # pytest collects ~5000 test items — conftest.py import chain needs
          # significant RAM. Keep well above observed peak.
          memory: 6G
          cpus: '2.0'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  management:
    image: ja4proxy-management:1.0.0
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.management
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_MANAGEMENT:-8090}:8090"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MANAGEMENT_JWT_SECRET=${MANAGEMENT_JWT_SECRET:?MANAGEMENT_JWT_SECRET is required}
      - MANAGEMENT_ADMIN_USER=${MANAGEMENT_ADMIN_USER:?MANAGEMENT_ADMIN_USER is required}
      - MANAGEMENT_ADMIN_PASSWORD=${MANAGEMENT_ADMIN_PASSWORD:?MANAGEMENT_ADMIN_PASSWORD is required}
    networks:
      - ja4proxy-mgmt
      - ja4proxy-data
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  redis-data:
  redis-sock:
  reports-data:  # Per-agent test reports — prefixed by COMPOSE_PROJECT_NAME

secrets:
  redis_password:
    file: ../secrets/redis_password.txt
  management_redis_password:
    file: ../secrets/management_redis_password.txt
  analytics_redis_password:
    file: ../secrets/analytics_redis_password.txt
  ja4tap_redis_password:
    file: ../secrets/ja4tap_redis_password.txt
  exporter_redis_password:
    file: ../secrets/exporter_redis_password.txt

networks:
  ja4proxy-dmz:
    driver: bridge
    name: ja4proxy-dmz
  ja4proxy-data:
    driver: bridge
    internal: true   # No internet/external access — Proxy ↔ Redis only
    name: ja4proxy-data
  ja4proxy-origin:
    driver: bridge
    internal: true   # No internet/external access — Proxy ↔ Backend/Tarpit only
    name: ja4proxy-origin
  ja4proxy-mgmt:
    driver: bridge
    name: ja4proxy-mgmt
