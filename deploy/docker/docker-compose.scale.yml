# Docker Compose scale overlay for multi-instance Go proxy scaling.
#
# Usage: docker compose -f docker-compose.poc.yml -f docker-compose.scale.yml up -d
#
# This overlay adds N Go proxy worker instances that share the same Redis backend.
# HAProxy load balances TCP connections across all workers using round-robin.

services:
  # HAProxy load balancer for multi-process scaling
  haproxy:
    image: haproxy:2.8.24-alpine
    container_name: ja4proxy_haproxy
    ports:
      - "443:443"
      - "8404:8404"  # HAProxy stats port
    volumes:
      - ../../config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - ja4proxy-network
    restart: unless-stopped
    depends_on:
      - proxy-worker-1
      - proxy-worker-2
      - proxy-worker-3
      - proxy-worker-4

  # Go proxy worker instances (4 workers for optimal scaling on i9-9900K)
  proxy-worker-1:
    extends:
      service: proxy
      file: docker-compose.poc.yml
    container_name: ja4proxy_worker_1
    environment:
      - PROXY_PORT=8080
      - WORKER_ID=1
    ports:
      - "8080:8080"
    networks:
      - ja4proxy-network

  proxy-worker-2:
    extends:
      service: proxy
      file: docker-compose.poc.yml
    container_name: ja4proxy_worker_2
    environment:
      - PROXY_PORT=8083
      - WORKER_ID=2
    ports:
      - "8083:8083"
    networks:
      - ja4proxy-network

  proxy-worker-3:
    extends:
      service: proxy
      file: docker-compose.poc.yml
    container_name: ja4proxy_worker_3
    environment:
      - PROXY_PORT=8084
      - WORKER_ID=3
    ports:
      - "8084:8084"
    networks:
      - ja4proxy-network

  proxy-worker-4:
    extends:
      service: proxy
      file: docker-compose.poc.yml
    container_name: ja4proxy_worker_4
    environment:
      - PROXY_PORT=8085
      - WORKER_ID=4
    ports:
      - "8085:8085"
    networks:
      - ja4proxy-network

# Shared networks and volumes from prod/poc
networks:
  ja4proxy-frontend:
    driver: bridge
  ja4proxy-backend:
    driver: bridge
  ja4proxy-network:
    name: ja4proxy-network
    driver: bridge

volumes:
  redis-sock:
