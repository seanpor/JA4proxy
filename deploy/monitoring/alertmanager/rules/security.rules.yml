groups:
  - name: ja4proxy_security
    rules:
      - alert: AbuseIPDBQuotaExhausted
        expr: ja4proxy_abuseipdb_quota_exhausted == 1
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "AbuseIPDB daily quota exhausted; enrichment paused until midnight UTC"
          runbook: "docs/runbooks/external_api_failures.md"
          runbook_url: "https://github.com/seanpor/JA4proxy/blob/main/docs/runbooks/external_api_failures.md"

      - alert: SpamhausDownloadFailed
        expr: rate(ja4proxy_blocklist_download_errors_total[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Spamhaus DROP/EDROP download failing"
          runbook: "docs/runbooks/feed_management.md"
          runbook_url: "https://github.com/seanpor/JA4proxy/blob/main/docs/runbooks/feed_management.md"

      - alert: SpamhausListStale
        expr: time() - ja4proxy_blocklist_last_refresh_success_seconds > 7200
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Spamhaus list not refreshed for >2 hours"
          runbook_url: "https://github.com/seanpor/JA4proxy/blob/main/docs/runbooks/feed_management.md"

      - alert: PipelineInternalError
        # phase-309 WP-6: was ja4proxy_pipeline_unexpected_errors_total (not emitted
        # by the Go proxy); ja4proxy_connection_errors_total is the real signal —
        # "unhandled errors in the connection handler before a policy decision".
        expr: rate(ja4proxy_connection_errors_total[1m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "Connection-handler internal error"
          description: "An unhandled error occurred in the connection handler before a policy decision. Check logs immediately."
          runbook: "docs/runbooks/security_incident_response.md#pipeline-internal-error"
          runbook_url: "https://github.com/seanpor/JA4proxy/blob/main/docs/runbooks/security_incident_response.md"

      - alert: ExceptionRateSpike
        # phase-309 WP-6: was ja4proxy_exception_handled_total (not emitted by the
        # Go proxy); ja4proxy_handler_panics_total (recovered handler panics) is
        # the real Go signal for the same intent.
        expr: |
          rate(ja4proxy_handler_panics_total[5m]) > 2 *
          avg_over_time(rate(ja4proxy_handler_panics_total[5m])[1h:5m])
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Recovered handler-panic rate 2× above 1h baseline"
          description: "Spike may indicate a new failure mode. Current: {{ $value | humanize }}/s"
          runbook: "docs/runbooks/security_incident_response.md#exception-rate-spike"
          runbook_url: "https://github.com/seanpor/JA4proxy/blob/main/docs/runbooks/security_incident_response.md"
