# Phase 85 — Threat intelligence feed runner alert rules.
#
# These rules complement (rather than replace) the Phase 14e / 59 hot-path
# TI provider alerts. They fire only on the batch-poller runner living in
# the analytics container (src/analytics/ti_feeds/).
groups:
  - name: ja4proxy_ti_feed
    rules:
      - alert: TIFeedCircuitOpen
        expr: ja4proxy_ti_feed_circuit_state >= 2
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "TI feed {{ $labels.feed_id }} circuit has been open for >30m"
          description: |
            The threat-intel feed {{ $labels.feed_id }} has failed enough
            consecutive polls to trip its circuit breaker and has stayed open
            for more than 30 minutes. No indicators from this feed are being
            refreshed; existing rules remain in place. Check the feed's
            endpoint, credentials, and the analytics container logs.
          runbook: "docs/runbooks/ti_feed_circuit_open.md"
          runbook_url: "https://github.com/seanpor/JA4proxy/blob/main/docs/runbooks/ti_feed_circuit_open.md"

      - alert: TIFeedStale
        expr: time() - ja4proxy_ti_feed_last_success_timestamp_seconds > 7200
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "TI feed {{ $labels.feed_id }} has not polled successfully in 2h"
          description: |
            The threat-intel feed {{ $labels.feed_id }} has not recorded a
            successful poll in more than 2 hours. This is independent of the
            circuit state and catches slow-drift failures (partial responses,
            valid HTTP but zero indicators, upstream publisher stalls).
          runbook: "docs/runbooks/ti_feed_stale.md"
          runbook_url: "https://github.com/seanpor/JA4proxy/blob/main/docs/runbooks/ti_feed_stale.md"

      - alert: TIFeedMgmtApiErrors
        expr: rate(ja4proxy_ti_feed_mgmt_api_errors_total[10m]) > 0.1
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "TI feed {{ $labels.feed_id }} is failing to write to the Management API"
          description: |
            The threat-intel feed {{ $labels.feed_id }} is recording
            Management API errors faster than 0.1/s over the last 10 minutes.
            Rules from this feed are not being applied. Check the
            Management API health, the operator bearer token, and
            ja4proxy_ti_feed_mgmt_api_errors_total{feed_id="{{ $labels.feed_id }}"}
            broken down by status_code.
          runbook: "docs/runbooks/ti_feed_mgmt_api_errors.md"
          runbook_url: "https://github.com/seanpor/JA4proxy/blob/main/docs/runbooks/ti_feed_mgmt_api_errors.md"

      # PHASE_101 C4: per-poll safety caps (max_new_per_poll, max_owned_total,
      # max_delta_per_poll). Any non-zero hit rate means a feed is being
      # constrained — operator should investigate why before relaxing.
      - alert: TIFeedCapsHit
        expr: rate(ja4proxy_ti_feed_caps_hit_total[15m]) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "TI feed {{ $labels.feed_id }} hit a safety cap ({{ $labels.cap }})"
          description: |
            The threat-intel feed {{ $labels.feed_id }} hit the
            {{ $labels.cap }} cap during the last 15 minutes. New indicators
            were rejected to prevent runaway growth or upstream-corruption
            blast radius. Inspect the feed's poll output and decide whether
            the cap should be raised, the feed paused, or the upstream
            provider contacted.
          runbook: "docs/runbooks/ti_feed_caps_hit.md"
          runbook_url: "https://github.com/seanpor/JA4proxy/blob/main/docs/runbooks/ti_feed_caps_hit.md"

      # PHASE_101 C6: any non-zero rate of FP-corpus rejections means a feed
      # tried to block a known-browser JA4 — either the upstream is
      # corrupted/poisoned, or the corpus is missing a fingerprint.
      - alert: TIFeedFPBlocked
        expr: rate(ja4proxy_ti_feed_fp_blocked_total[15m]) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "TI feed {{ $labels.feed_id }} attempted to block a known-browser JA4"
          description: |
            The threat-intel feed {{ $labels.feed_id }} tried to add a JA4
            that matches the local FP corpus. The block was refused, but the
            attempt itself is suspicious. Either the upstream provider is
            corrupted/poisoned, or the FP corpus at
            fixtures/ti_feeds/ja4_fp_corpus.txt is stale and is mis-flagging
            a legitimate threat indicator.
          runbook: "docs/runbooks/ti_feed_fp_blocked.md"
          runbook_url: "https://github.com/seanpor/JA4proxy/blob/main/docs/runbooks/ti_feed_fp_blocked.md"
