# Prometheus Configuration for JA4proxy Monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ja4proxy-poc'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts.yml'
  - '/etc/prometheus/recording_rules.yml'
  - '/etc/prometheus/slo_recording_rules.yml'  # phase-63
  # Phase 805: deploy/monitoring/alertmanager/rules/*.yml (proxy, redis,
  # security, backup, tap, ebpf_attack, management_ui, slo_alerts, ti_feed,
  # tls_alerts, and this phase's new performance.rules.yml) were documented
  # and promtool-syntax-validated but never actually loaded by this file --
  # no rule_files entry and no docker-compose volume mount pointed at them.
  # See deploy/docker/docker-compose.monitoring.yml's matching comment.
  - '/etc/prometheus/alertmanager-rules/*.yml'

# Scrape configurations
scrape_configs:
  # Analytics node metrics
  - job_name: 'ja4proxy-analytics'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'analytics:8080'
        labels:
          service: 'analytics'
          role: 'analytics'

  # JA4 Proxy metrics
  - job_name: 'ja4proxy'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 'ja4proxy:9090'
        labels:
          service: 'ja4proxy'
          role: 'proxy'

  # Redis metrics (if redis_exporter is used)
  - job_name: 'ja4proxy-redis'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'ja4proxy-redis-exporter:9121'
        labels:
          service: 'redis'
          role: 'database'

  # Tarpit metrics
  - job_name: 'ja4proxy-tarpit'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'tarpit:9099'
        labels:
          service: 'tarpit'
          role: 'security-action'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'localhost:9090'

  # Node exporter (if available)
  - job_name: 'node'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          role: 'infrastructure'

  - job_name: 'cadvisor'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: cadvisor
          role: container-metrics
    metric_relabel_configs:
      # Drop per-device blkio series — high cardinality, unused
      - source_labels: [__name__]
        regex: 'container_(blkio_device|tasks_state).*'
        action: drop
      # Drop the host cgroup root (name="") — covered by node-exporter
      - source_labels: [name]
        regex: ''
        action: drop

  - job_name: 'haproxy'
    scrape_interval: 15s
    static_configs:
      - targets: ['haproxy-exporter:9101']
        labels:
          service: haproxy
          role: load-balancer

  # phase-809 (O-004): standalone Go TAP/SPAN sensor (cmd/ja4-tap), --metrics-addr
  # :9110. Optional service (docker-compose.prod.yml's `tap` profile) --
  # network_mode: host there means this target is the host's real address, not
  # a compose DNS name; adjust the target below to match your deployment
  # (e.g. the SPAN-capture host's IP, or host.docker.internal from within the
  # monitoring network).
  - job_name: 'ja4proxy-tap'
    scrape_interval: 15s
    static_configs:
      - targets: ['ja4-tap:9110']
        labels:
          service: ja4-tap
          role: tap-sensor

# Storage configuration is set via command-line flags in docker-compose.yml
# retention.time and retention.size are passed as startup arguments

# Remote write (optional - for long-term storage)
# remote_write:
#   - url: 'http://remote-storage:9201/write'
#     queue_config:
#       capacity: 10000
#       max_shards: 5
