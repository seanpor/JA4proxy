server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    # JA4PROXY-2026-0017 — discovery goes via docker-socket-proxy
    # (tecnativa image) which whitelists only the CONTAINERS endpoint.
    # Promtail no longer has direct access to /var/run/docker.sock.
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 5s
        filters:
          # Docker's `name` filter is a SUBSTRING match, so this single value
          # already matched every container below it — and, importantly, keeps
          # matching once names are lane-prefixed
          # (ja4proxy-lane23-backend-1, ja4proxy-lane23-grafana-1, ...).
          #
          # phase-800: the per-service values that used to be listed here were
          # already dead. The poc/prod stacks have never set container_name:, so
          # their containers were ja4proxy-lane<N>-<svc>-1 and none of
          # "ja4proxy-backend" / "ja4proxy-redis" / "ja4proxy-tarpit" ever
          # matched anything; only this prefix did any work. The monitoring
          # stack's container_name: pins have now been removed too (they blocked
          # a second lane from starting), so those entries would be dead as well.
          - name: name
            values:
              - ja4proxy
    relabel_configs:
      # Use container name as the primary label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Extract service role from container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/ja4proxy-(.*)'
        target_label: 'service'
      # The main proxy container is just "ja4proxy"
      - source_labels: ['__meta_docker_container_name']
        regex: '/ja4proxy$'
        target_label: 'service'
        replacement: 'proxy'
    pipeline_stages:
      # Parse proxy structured log lines
      - regex:
          expression: '(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) - (?P<logger>\S+) - (?P<level>\w+) - (?P<message>.*)'
      - labels:
          level:
      # Tag security events
      - match:
          selector: '{service="proxy"}'
          stages:
            - regex:
                expression: '(?P<action>ALLOWED|BLOCKED|WHITELISTED|BLACKLISTED|TIMEOUT):'
            - labels:
                action:
