apiVersion: 1

# Dashboards provisioned from monitoring/grafana/dashboards/ (mounted into
# the Grafana container at /var/lib/grafana/dashboards). Current set:
#
#   - analytics.json
#   - ja4proxy-infrastructure.json    (Ops audience)
#   - ja4proxy-overview.json          (SecOps audience)
#   - tap_sensor.json
#   - 04_capacity.json                (Capacity / platform audience — Phase 86i)
#   - ci_benchmark_trend.json         (CI/synthetic perf trend — Phase 805)

providers:
  - name: 'Default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
