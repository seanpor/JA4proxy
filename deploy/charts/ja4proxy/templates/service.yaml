apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace | default "ja4proxy" }}
  name: ja4proxy
  labels:
    app: ja4proxy
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    app: ja4proxy
