# Default values for ja4proxy
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Image configuration
image:
  repository: ja4proxy
  tag: latest
  pullPolicy: IfNotPresent

# Resource limits and requests
resources:
  limits:
    cpu: "2"
    memory: "512Mi"
  requests:
    cpu: "500m"
    memory: "128Mi"

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Redis configuration (external Redis required)
redis:
  external: true
  host: "redis"
  port: 6379
  url: ""  # Set via REDIS_URL secret

# Configuration file (mounted as ConfigMap)
config:
  # Mount the proxy.yml config file
  enabled: true
  mountPath: /app/config/proxy.yml
  subPath: proxy.yml

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# JA4PROXY-2026-0046: liveness and readiness probes. Both target the
# Go proxy's /health endpoint on the metrics port. Defaults chosen for
# a proxy on the DMZ: readiness checks often (the load balancer needs
# fast drain signalling); liveness checks slower but with enough
# failures to survive a momentary GC pause.
probes:
  liveness:
    httpGet:
      path: /health
      port: 9090
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health
      port: 9090
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

# JA4PROXY-2026-0046: NetworkPolicy. When enabled, the chart installs
# a default-deny-plus-allowlist policy scoped to the ja4proxy pods:
# ingress only from pods matching `clientLabels` (or all pods in the
# namespace if `clientLabels` is empty); metrics port (9090) only from
# pods matching `metricsScrapeLabels`; egress to DNS, to the Redis
# service, and to the upstream backend host. Disable only when an
# external NetworkPolicy controller (Cilium, Calico GlobalNetworkPolicy)
# is enforcing the same rules at a higher tier.
networkPolicy:
  enabled: true
  # Labels that gating pods sending traffic to the proxy must carry.
  # Empty ({}) means "any pod in the ja4proxy namespace".
  clientLabels: {}
  # Labels on the Prometheus pod(s) allowed to scrape /metrics:9090.
  # Default matches the kube-prometheus-stack release's server pod.
  metricsScrapeLabels:
    app.kubernetes.io/name: prometheus
  # Extra CIDR blocks allowed to reach port 8080 (e.g., external LB CIDR).
  # Leave empty to restrict ingress to in-cluster pods only.
  ingressCIDRs: []
  # Namespace selector restricting which namespaces' pods may call the
  # proxy. Empty means "same namespace only".
  ingressNamespaceLabels: {}

# Backend target (what the proxy forwards to)
backend:
  host: "backend"
  port: 443

# Secrets — set at install time, never commit real values here.
# Use: helm install ja4proxy ./ja4proxy --set secrets.redisPassword=<pw>
# Or use Vault Agent / External Secrets Operator for production.
secrets:
  create: true           # Set false if managing secrets externally (Vault, ESO)
  redisPassword: ""      # Redis requirepass value
  abuseipdbApiKey: ""    # AbuseIPDB v2 API key
  redisUrl: ""           # Full Redis URL (overrides redis.url if set)

# Prometheus Operator monitoring
monitoring:
  enabled: false              # Set true if Prometheus Operator is installed
  scrapeInterval: "15s"
  scrapeTimeout: "10s"
  prometheusSelector:         # Must match your Prometheus Operator's serviceMonitorSelector
    release: kube-prometheus-stack

# Analytics node deployment (optional — required for adaptive rate limiting)
analytics:
  enabled: false
  image:
    repository: ja4proxy-analytics
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "2"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "256Mi"
