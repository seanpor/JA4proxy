apiVersion: apps/v1
kind: Deployment
metadata:
  name: ja4proxy
  labels:
    app: ja4proxy
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ja4proxy
  template:
    metadata:
      labels:
        app: ja4proxy
        metrics: "true"   # Selected by ServiceMonitor
    spec:
      {{- if .Values.nodeAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ja4proxy
              topologyKey: "kubernetes.io/hostname"
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: ja4proxy
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        env:
        - name: REDIS_URL
          {{- if .Values.secrets.create }}
          valueFrom:
            secretKeyRef:
              name: ja4proxy-secrets
              key: REDIS_URL
              optional: true   # Falls back to redis.url value if secret key absent
          {{- else }}
          value: {{ .Values.redis.url | quote }}
          {{- end }}
        - name: ABUSEIPDB_API_KEY
          {{- if .Values.secrets.create }}
          valueFrom:
            secretKeyRef:
              name: ja4proxy-secrets
              key: ABUSEIPDB_API_KEY
              optional: true
          {{- end }}
        {{- if .Values.config.enabled }}
        volumeMounts:
        - name: config-volume
          mountPath: {{ .Values.config.mountPath }}
          subPath: {{ .Values.config.subPath }}
        {{- end }}
      {{- if .Values.config.enabled }}
      volumes:
      - name: config-volume
        configMap:
          name: ja4proxy-config
      {{- end }}
