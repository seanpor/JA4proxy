# Secret template — TEMPLATED VALUES ONLY.
# Do NOT commit real secrets to values.yaml.
# Use Vault Agent injection, Sealed Secrets, or External Secrets Operator in production.
#
# Usage:
#   helm install ja4proxy ./ja4proxy \
#     --set secrets.redisPassword="<password>" \
#     --set secrets.abuseipdbApiKey="<key>"
#
# Or provide via a values file that is NOT checked into source control.
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: ja4proxy-secrets
  labels:
    app: ja4proxy
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
  annotations:
    # Helm does not manage secret rotation. Use Vault or ESO for production.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.abuseipdbApiKey }}
  ABUSEIPDB_API_KEY: {{ .Values.secrets.abuseipdbApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
{{- end }}
