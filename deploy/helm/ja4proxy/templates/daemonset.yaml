apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ja4proxy
  labels:
    app: ja4proxy
spec:
  selector:
    matchLabels:
      app: ja4proxy
  template:
    metadata:
      labels:
        app: ja4proxy
        metrics: "true"   # Selected by ServiceMonitor
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: ja4proxy
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        env:
        # The Go proxy reads config/proxy.yml which expands ${REDIS_HOST},
        # ${REDIS_PORT}, ${REDIS_PASSWORD} from env. Set them directly rather
        # than REDIS_URL (which the proxy does not parse).
        {{- if not .Values.redis.external }}
        # Bundled Redis StatefulSet (redis.yaml) — service name is ja4proxy-redis.
        - name: REDIS_HOST
          value: "ja4proxy-redis"
        - name: REDIS_PORT
          value: "6379"
        {{- else }}
        - name: REDIS_HOST
          value: {{ .Values.redis.host | default "redis" | quote }}
        - name: REDIS_PORT
          value: {{ .Values.redis.port | default 6379 | quote }}
        {{- end }}
        - name: REDIS_PASSWORD
          {{- if .Values.secrets.create }}
          valueFrom:
            secretKeyRef:
              name: ja4proxy-secrets
              key: REDIS_PASSWORD
              optional: true
          {{- else }}
          value: {{ .Values.secrets.redisPassword | default "" | quote }}
          {{- end }}
        - name: ABUSEIPDB_API_KEY
          {{- if .Values.secrets.create }}
          valueFrom:
            secretKeyRef:
              name: ja4proxy-secrets
              key: ABUSEIPDB_API_KEY
              optional: true
          {{- end }}
        {{- if .Values.config.enabled }}
        volumeMounts:
        - name: config-volume
          mountPath: {{ .Values.config.mountPath }}
          subPath: {{ .Values.config.subPath }}
        {{- end }}
      {{- if .Values.config.enabled }}
      volumes:
      - name: config-volume
        configMap:
          name: ja4proxy-config
      {{- end }}
