services:
  haproxy:
    image: haproxy:2.8.5-alpine
    container_name: ja4proxy-haproxy
    ports:
      - "443:443"
      - "8880:80"
      - "127.0.0.1:8404:8404"
    volumes:
      - ./ha-config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - proxy
    networks:
      - ja4proxy-frontend
      - ja4proxy-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 64M

  proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    image: ja4proxy:1.0.0
    container_name: ja4proxy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      - redis
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - redis-sock:/var/run/redis
    environment:
      - CONFIG_PATH=/app/config/proxy.yml
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Backend destination — override in .env for production (BACKEND_HOST=your.server.ip)
      - BACKEND_HOST=${BACKEND_HOST:-backend}
      - BACKEND_PORT=${BACKEND_PORT:-443}
      - REDIS_UNIX_SOCKET_PATH=/var/run/redis/redis.sock
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - ja4proxy-backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2.0'
        reservations:
          memory: 128M

  redis:
    image: redis/redis-stack:7.4.0-v3
    container_name: ja4proxy-redis
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # redis/redis-stack passes extra flags via REDIS_ARGS (see /entrypoint.sh)
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 256mb --maxmemory-policy allkeys-lru --hz 20 --tcp-keepalive 60 --save "" --unixsocket /var/run/redis/redis.sock --unixsocketperm 777
    # Redis not exposed to host — only accessible from backend network
    networks:
      - ja4proxy-backend
    volumes:
      - redis_data:/data
      - redis-sock:/var/run/redis
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 64M

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.mockbackend
      network: host
    image: ja4proxy-mockbackend:1.0.0
    container_name: ja4proxy-backend
    ports:
      - "127.0.0.1:8443:443"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - ja4proxy-backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

  tarpit:
    build:
      context: ./tarpit
      dockerfile: Dockerfile
      network: host
    image: ja4proxy-tarpit:1.0.0
    container_name: ja4proxy-tarpit
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9099:9099"
    environment:
      - TARPIT_PORT=8888
      - TARPIT_DURATION=60
      - TARPIT_METRICS_PORT=9099
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - ja4proxy-backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M

  trafficgen:
    build:
      context: .
      dockerfile: docker/Dockerfile.trafficgen
      network: host
    image: ja4proxy-trafficgen:1.0.0
    container_name: ja4proxy-trafficgen
    depends_on:
      - proxy
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ja4proxy-backend
    profiles:
      - traffic
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  analytics:
    build:
      context: .
      dockerfile: src/analytics/Dockerfile
      network: host
    image: ja4proxy-analytics:1.0.0
    container_name: ja4proxy-analytics
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - WAIT_FOR_REDIS=true
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ja4proxy-backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
      network: host
    image: ja4proxy-test:1.0.0
    container_name: ja4proxy-test
    depends_on:
      - proxy
      - redis
      - backend
    volumes:
      - ./tests:/app/tests:ro
      - ./performance:/app/performance:ro
      - ./reports:/app/reports
      - ./proxy.py:/app/proxy.py:ro
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - PROXY_HOST=proxy
      - PROXY_PORT=8080
      - BACKEND_HOST=backend
      - BACKEND_PORT=443
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    networks:
      - ja4proxy-backend
    profiles:
      - test
    command: ["pytest", "/app/tests", "-v", "--cov=proxy", "--cov-report=html:/app/reports/coverage", "--cov-report=term", "--junitxml=/app/reports/junit.xml"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

volumes:
  redis_data:
  redis-sock:

networks:
  ja4proxy-frontend:
    driver: bridge
  ja4proxy-backend:
    driver: bridge