name: ja4proxy

services:
  haproxy:
    image: haproxy:2.8.5-alpine
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_INGRESS:-443}:443"
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_HAPROXY_STATS:-8404}:8404"
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - proxy
    networks:
      - dmz_net
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-proxy
      network: host
    image: ja4proxy:2.0.0
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_PROXY:-8081}:8080"
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_METRICS:-9090}:9090"
    depends_on:
      - redis
    volumes:
      - ./config:/app/config:ro
      - ./geoip:/app/geoip:ro
    environment:
      - CONFIG_PATH=/app/config/proxy.yml
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - BACKEND_HOST=${BACKEND_HOST:-backend}
      - BACKEND_PORT=${BACKEND_PORT:-443}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    networks:
      - dmz_net
      - data_net
      - origin_net
      - mgmt_net
    security_opt:
      - no-new-privileges:true
      # AppArmor profile (Phase 34d): must be loaded on host before enabling.
      # Load with: sudo apparmor_parser -r config/apparmor/ja4proxy
      # Then uncomment the line below:
      # - apparmor:ja4proxy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
      - /var/run:noexec,nosuid,nodev,size=10m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Non-root user: ja4proxy (set in docker/Dockerfile.go-proxy)
    cpuset: "${AGENT_CPU_SET:-0-15}"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '4.0'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  redis:
    image: redis/redis-stack:7.4.0-v3
    # No host port exposure — internal to data_net only
    environment:
      # redis/redis-stack passes extra flags via REDIS_ARGS (see /entrypoint.sh)
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 256mb --maxmemory-policy allkeys-lru --hz 20 --tcp-keepalive 60 --save "" --unixsocket /var/run/redis/redis.sock --unixsocketperm 777
    networks:
      - data_net
    volumes:
      - redis_data:/data
      - redis-sock:/var/run/redis
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
      - /var/run:noexec,nosuid,nodev,size=10m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.mockbackend
      network: host
    image: ja4proxy-mockbackend:1.0.0
    # No host port exposure — internal to origin_net only
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - origin_net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    # Non-root user set in docker/Dockerfile.mockbackend (USER backend)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  tarpit:
    build:
      context: ./tarpit
      dockerfile: Dockerfile
      network: host
    image: ja4proxy-tarpit:1.0.0
    # No host port exposure — internal to origin_net only
    environment:
      - TARPIT_PORT=8888
      - TARPIT_DURATION=60
      - TARPIT_METRICS_PORT=9099
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - origin_net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    # Non-root user set in tarpit/Dockerfile (USER tarpit)
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  trafficgen:
    build:
      context: .
      dockerfile: docker/Dockerfile.trafficgen
      network: host
    image: ja4proxy-trafficgen:1.0.0
    depends_on:
      - proxy
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - dmz_net
    profiles:
      - traffic
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Non-root user set in docker/Dockerfile.trafficgen
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  analytics:
    build:
      context: .
      dockerfile: src/analytics/Dockerfile
      network: host
    image: ja4proxy-analytics:1.0.0
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_ANALYTICS:-8080}:8080"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - WAIT_FOR_REDIS=true
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mgmt_net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    # Non-root user set in src/analytics/Dockerfile (USER analytics)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  admin-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      network: host
    image: ja4proxy-admin-api:1.0.0
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_ADMIN_API:-8091}:8090"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_SIGNING_KEY=${REDIS_SIGNING_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - mgmt_net
      - data_net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
      network: host
    image: ja4proxy-test:1.0.0
    depends_on:
      - proxy
      - redis
      - backend
    volumes:
      - ./tests:/app/tests:ro
      - ./performance:/app/performance:ro
      - reports_data:/app/reports
      - ./proxy.py:/app/proxy.py:ro
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - PROXY_HOST=proxy
      - PROXY_PORT=8080
      - BACKEND_HOST=backend
      - BACKEND_PORT=443
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    networks:
      - dmz_net
      - data_net
      - origin_net
    profiles:
      - test
    command: ["pytest", "/app/tests", "-v", "--cov=proxy", "--cov-report=html:/app/reports/coverage", "--cov-report=term", "--junitxml=/app/reports/junit.xml"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  management:
    image: ja4proxy-management:1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.management
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${HOST_PORT_MANAGEMENT:-8090}:8090"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MANAGEMENT_JWT_SECRET=${MANAGEMENT_JWT_SECRET:-change-me-in-production}
      - MANAGEMENT_ADMIN_USER=${MANAGEMENT_ADMIN_USER:-admin}
      - MANAGEMENT_ADMIN_PASSWORD=${MANAGEMENT_ADMIN_PASSWORD:-admin}
    networks:
      - mgmt_net
      - data_net
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  redis_data:
  redis-sock:
  reports_data:  # Per-agent test reports — prefixed by COMPOSE_PROJECT_NAME

networks:
  dmz_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true   # No internet/external access — Proxy ↔ Redis only
  origin_net:
    driver: bridge
    internal: true   # No internet/external access — Proxy ↔ Backend/Tarpit only
  mgmt_net:
    driver: bridge
