# docker-compose.go.yml — overlay that adds the Go proxy alongside the Python stack.
# Usage: docker compose -f docker-compose.poc.yml -f docker-compose.go.yml --env-file .env.<agent> up -d
#   or:  make agent-up-go NAME=<agent>
#
# Go proxy listens on :8082 (host) / :8080 (container)
# Go metrics listen on :9092 (host) / :9090 (container)
# Python proxy remains on its configured ports.
# Both proxies share the same Redis instance (data_net).

services:
  go-proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-proxy
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:8082:8080"
      - "${AGENT_BIND_IP:-127.0.0.1}:9092:9090"
    environment:
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      BACKEND_HOST: "${BACKEND_HOST:-backend}"
      BACKEND_PORT: "${BACKEND_PORT:-443}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
    depends_on:
      - redis
    networks:
      - dmz_net
      - data_net
      - origin_net
      - mgmt_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3

# Networks are declared in docker-compose.poc.yml (dmz_net, data_net, origin_net, mgmt_net).
# No network declarations needed here — the overlay inherits them from the base file.
