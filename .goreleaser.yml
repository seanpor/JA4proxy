version: 2

before:
  hooks:
    - GOROOT=/snap/go/current go mod tidy
    - GOROOT=/snap/go/current go generate ./...

builds:
  - id: ja4proxy-cli
    binary: ja4proxy-cli
    main: ./cmd/ja4proxy-cli/
    env:
      - CGO_ENABLED=0
      - GOROOT=/snap/go/current
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: ja4proxy-cli
    name_template: "ja4proxy-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - --batch
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

sbom:
  - artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.bom.json"

# SLSA provenance is generated by the release workflow via slsa-github-generator.
# See .github/workflows/release-cli.yml.

release:
  github:
    owner: seanpor
    name: ja4proxy
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
  header: |
    ## JA4proxy CLI v{{ .Version }}

    See [CHANGELOG.md](CHANGELOG.md) for details.
  footer: |
    **Full Changelog**: https://github.com/seanpor/ja4proxy/compare/{{ .PreviousTag }}...{{ .Tag }}

snapshot:
  name_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
